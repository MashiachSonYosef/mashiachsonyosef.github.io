<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orot</title>
  <style>
    :root { color-scheme: dark; --bg: #0a0b0d; --panel: #111318; --panel-2: #171a21; --text: #ece7dd; --muted: #aaa296; --line: #2a2d35; --accent: #d6be8a; --hebrew: #f4efe5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
    a { color: var(--accent); }
    main { width: min(1400px, calc(100% - 24px)); margin: 0 auto; padding: 24px 0 48px; }
    h1, h2, h3 { font-weight: 400; margin: 0; scroll-margin-top: 18px; }
    h1 { font-size: clamp(2rem, 5vw, 4.8rem); line-height: 0.95; margin-bottom: 14px; }
    h2 { color: var(--accent); font-size: 1.25rem; margin: 28px 0 12px; }
    h3 { font-size: 1.05rem; margin-bottom: 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 8px; }
    .crumbs, .meta { color: var(--muted); font-size: 0.92rem; }
    .home-grid, .works-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 20px; }
    .work-card { display: block; border: 1px solid var(--line); background: var(--panel); padding: 16px; text-decoration: none; min-height: 120px; }
    .work-card strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 8px; }
    .reader-shell { display: grid; grid-template-columns: minmax(210px, 280px) 1fr; gap: 20px; align-items: start; }
    .toc { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--line); background: var(--panel); padding: 14px; }
    .toc ul { list-style: none; padding: 0; margin: 0; }
    .toc li { margin: 0 0 7px; }
    .toc a { text-decoration: none; font-size: 0.94rem; }
    .search { width: 100%; border: 1px solid var(--line); background: #090a0c; color: var(--text); padding: 10px; margin-bottom: 12px; font: inherit; }
    .unit { border-top: 1px solid var(--line); padding: 18px 0; }
    .unit-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 10px; }
    .anchor { text-decoration: none; color: var(--accent); font-size: 0.9rem; }
    .unit-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 18px; }
    .hebrew { color: var(--hebrew); direction: rtl; unicode-bidi: plaintext; text-align: right; font-size: 1.18rem; line-height: 1.7; }
    .placeholder { color: #8c857c; }
    .overlay-block { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; margin-bottom: 10px; }
    .overlay-label { display: block; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0; margin-bottom: 6px; }
    details { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
    summary { cursor: pointer; color: var(--accent); }
    @media (max-width: 820px) { .reader-shell, .unit-grid { grid-template-columns: 1fr; } .toc { position: static; max-height: none; } }
  </style>
</head>
<body>
  <main>
    <p class="crumbs"><a href="../">Home</a></p>
    <h1>Orot</h1>
    <p>One work per page. Hebrew source data is imported separately from human overlays.</p>
    <div class="works-grid">
      <a class="work-card" href="orot/lights-from-darkness/">
        <strong>Orot: Lights from Darkness</strong>
        <span class="meta">123 units | Sefaria API | imported 2026-04-27</span>
      </a>
    </div>
  </main>
</body>
</html>
