<title>Zone reader · The Tabernacle</title>
<script>
// The tabernacle has two faces and both are the record's: linen hangings in
// daylight, the tent dark under its coverings by night. The device's own
// preference decides until the reader chooses; a choice is the device's to
// remember, and it is remembered on the device and nowhere else.
(() => {
  const root = document.documentElement;
  let held = null;
  try { held = localStorage.getItem("scheme"); } catch { /* a device that remembers nothing still reads */ }
  const sys = matchMedia("(prefers-color-scheme: light)");
  const apply = () => { root.dataset.scheme = held === "day" || held === "night" ? held : (sys.matches ? "day" : "night"); };
  apply();
  if (sys.addEventListener) sys.addEventListener("change", apply);
  window.__face = { set(v) { held = v; try { localStorage.setItem("scheme", v); } catch { /* still reads */ } apply(); } };
})();
</script>
