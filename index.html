<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hebrew work bench</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0b;
      --text: #f4efe5;
      --muted: #bdb5a7;
      --line: rgba(214, 190, 138, 0.32);
      --accent: #d8c38d;
      --panel: #141411;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(920px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 44px 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 34px;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 400;
      letter-spacing: 0;
    }

    h1 {
      font-size: 3.15rem;
      line-height: 1;
    }

    h2 {
      color: var(--text);
      font-size: 1.18rem;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .corpus-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .corpus-link,
    .download-link {
      display: flex;
      align-items: center;
      min-height: 64px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 14px;
      line-height: 1.25;
    }

    .corpus-link:hover,
    .corpus-link:focus-visible,
    .download-link:hover,
    .download-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .corpus-link[data-live="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .downloads {
      display: grid;
      gap: 10px;
    }

    .download-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .download-link {
      min-height: 44px;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      main { width: min(100% - 22px, 920px); }
      h1 { font-size: 2.35rem; }
      .corpus-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>hebrew work bench</h1>
    </header>

    <section aria-labelledby="corpus-title">
      <h2 id="corpus-title">11 corpus org chart</h2>
      <div class="corpus-grid">
        <a class="corpus-link" data-live="true" href="tanakh/daniel/">tanakh</a>
        <a class="corpus-link" href="#mishnah">mishnah</a>
        <a class="corpus-link" href="#midrash">midrash</a>
        <a class="corpus-link" href="#talmud">talmud</a>
        <a class="corpus-link" href="#halakhah">halakhah</a>
        <a class="corpus-link" href="#kabbalah">kabbalah</a>
        <a class="corpus-link" href="#thought">thought / musar / chasidut</a>
        <a class="corpus-link" href="#second-temple">second temple</a>
        <a class="corpus-link" href="#liturgy">liturgy</a>
        <a class="corpus-link" href="#targum">targum</a>
        <a class="corpus-link" href="#other">other</a>
      </div>
    </section>

    <footer class="downloads" aria-labelledby="downloads-title">
      <h2 id="downloads-title">potential downloads</h2>
      <div class="download-list">
        <a class="download-link" href="data/public-lexical/by-work/daniel-token-claims-min60.csv" download>full csv</a>
      </div>
    </footer>
  </main>
</body>
</html>
