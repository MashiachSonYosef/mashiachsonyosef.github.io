<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hebrew Workbench Render</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #100018;
  --panel: #21052d;
  --panel-2: #321640;
  --panel-3: #452451;
  --line: #d8a93b;
  --line-soft: rgba(216, 169, 59, .52);
  --text: #ffe7a8;
  --muted: #d2bd93;
  --blue: #9fc9ff;
  --shadow: rgba(3, 0, 9, .42);
  --radius: 8px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  color: var(--text);
  background:
    radial-gradient(circle at 20% 0%, rgba(112, 67, 82, .45), transparent 26rem),
    linear-gradient(90deg, rgba(216, 169, 59, .24) 0 1px, transparent 1px calc(100% - 1px), rgba(216, 169, 59, .24) calc(100% - 1px)),
    var(--bg);
  font-family: Georgia, "Times New Roman", serif;
}

.shell {
  width: min(100%, 1180px);
  margin: 0 auto;
  border-left: 1px solid var(--line-soft);
  border-right: 1px solid var(--line-soft);
}

.contents-strip {
  border-bottom: 1px solid var(--line-soft);
  background: rgba(13, 0, 20, .92);
}

.contents-strip summary {
  display: block;
  min-height: 3.7rem;
  padding: 1rem 1.5rem;
  color: var(--text);
  cursor: pointer;
  font-size: clamp(1rem, 3.4vw, 1.25rem);
  font-weight: 700;
  letter-spacing: .05em;
}

.contents-strip summary::before {
  content: ">";
  color: #f7d65c;
}

.contents-strip[open] summary::before {
  content: "v";
}

.contents-strip span {
  color: #8f8199;
  font-weight: 400;
  letter-spacing: 0;
}

.contents-list {
  display: flex;
  flex-wrap: wrap;
  gap: .55rem;
  padding: 0 1.5rem 1rem;
}

.contents-link {
  min-height: 2.35rem;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: .28rem .72rem .34rem;
  color: var(--text);
  background: rgba(255, 226, 165, .08);
  text-decoration: none;
  font-weight: 700;
}

.contents-link[aria-current="true"] {
  color: var(--blue);
  border-color: var(--line);
  background: rgba(77, 31, 86, .78);
}

.passage-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  padding: 1.25rem 1.5rem 1.55rem;
  border-bottom: 1px solid var(--line);
  background: rgba(13, 0, 20, .96);
  box-shadow: 0 12px 30px var(--shadow);
}

.passage-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 1.45rem;
  align-items: center;
  margin-bottom: 1.35rem;
  font-size: clamp(.94rem, 3.3vw, 1.14rem);
  letter-spacing: .06em;
}

.passage-nav a {
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
}

.passage-nav a:first-child {
  margin-right: auto;
  color: var(--blue);
}

.nav-action {
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: .28rem .7rem .34rem;
  color: var(--text);
  background: rgba(255, 226, 165, .08);
  cursor: pointer;
  font-size: inherit;
  font-weight: 700;
}

.passage-line {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .7rem 1.35rem;
  font-size: clamp(2rem, 8vw, 3.45rem);
  line-height: 1.5;
}

.passage-token {
  border: 0;
  padding: 0 .05em;
  color: var(--text);
  background: transparent;
  font: inherit;
  cursor: pointer;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .45);
}

.passage-token[aria-pressed="true"] {
  color: #fff1bf;
}

.passage-token:disabled {
  color: rgba(255, 231, 168, .62);
  cursor: default;
}

.reader-frame {
  position: relative;
  padding: 1.35rem 1rem 1rem;
}

.reader-frame::before,
.reader-frame::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--line);
  opacity: .72;
}

.reader-frame::before {
  left: 2.35rem;
}

.reader-frame::after {
  right: 2.35rem;
}

.top-card-grid,
.section-control-card {
  position: relative;
  z-index: 1;
  width: min(100%, 1040px);
  margin: 0 auto 1rem;
}

.top-card-grid {
  display: grid;
  grid-template-columns: minmax(0, .75fr) minmax(0, 1fr);
  gap: 1rem;
}

.word-card,
.selected-gloss-card,
.section-control-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(92, 60, 86, .86), rgba(34, 7, 47, .94));
}

.word-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 1rem;
  align-items: center;
  padding: 1.2rem 1.5rem;
  min-width: 0;
}

.word-labels,
.word-values {
  display: grid;
  gap: .35rem;
}

.word-labels {
  color: var(--text);
  font-weight: 700;
  font-size: clamp(.95rem, 3.6vw, 1.1rem);
}

.word-values {
  grid-template-columns: auto minmax(0, 1fr);
  align-items: baseline;
  gap: .55rem 1rem;
}

#word-hebrew {
  color: var(--text);
  font-size: clamp(2.1rem, 9vw, 3.2rem);
  line-height: 1;
}

#word-transliteration {
  color: #9f9bbb;
  font-size: clamp(1rem, 3.8vw, 1.2rem);
}

.selected-gloss-card {
  padding: .85rem 1.3rem 1rem;
  min-width: 0;
}

.selected-gloss-card h2 {
  margin: 0 0 .45rem;
  color: var(--muted);
  font-size: clamp(.95rem, 3.6vw, 1.05rem);
}

#selected-gloss-stack {
  display: grid;
  gap: .65rem;
}

.selected-gloss-line {
  min-height: 3.45rem;
  padding: .45rem 1rem;
  border: 1px solid rgba(216, 169, 59, .44);
  border-radius: var(--radius);
  color: var(--text);
  background: rgba(20, 1, 31, .78);
  font-size: clamp(1.45rem, 7vw, 2.2rem);
  font-weight: 700;
  line-height: 1.08;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .5);
}

.selected-gloss-line.is-split {
  display: flex;
  flex-wrap: wrap;
  gap: .42rem;
  align-items: center;
}

.selected-gloss-part {
  display: inline-block;
}

.selected-gloss-plus {
  color: var(--muted);
  font-size: .8em;
}

.commentary-modes {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
}

.section-control-card {
  display: flex;
  flex-wrap: wrap;
  gap: .75rem;
  align-items: center;
  justify-content: space-between;
  padding: .85rem 1.3rem;
  color: var(--text);
}

.section-control-card strong {
  color: var(--blue);
  font-size: clamp(1rem, 3.8vw, 1.25rem);
}

#section-commentary-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
}

.section-commentary-button {
  display: inline-flex;
  min-height: 2.65rem;
  align-items: center;
  gap: .45rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: .28rem .75rem .34rem;
  color: var(--text);
  background: rgba(77, 31, 86, .82);
  cursor: pointer;
  font-size: clamp(.95rem, 3.8vw, 1.12rem);
  font-weight: 700;
}

.section-commentary-count {
  display: inline-grid;
  min-width: 1.45rem;
  min-height: 1.45rem;
  place-items: center;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(20, 1, 31, .72);
  font-size: .86em;
}

.commentary-mode {
  min-height: 2.55rem;
  padding: .3rem .75rem .36rem;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255, 226, 165, .1);
  cursor: pointer;
  font-size: clamp(.95rem, 3.8vw, 1.15rem);
  font-weight: 700;
}

.commentary-mode[aria-pressed="true"] {
  color: var(--text);
  border-color: var(--line);
  background: rgba(77, 31, 86, .82);
  box-shadow: inset 0 0 0 1px rgba(255, 224, 141, .88);
}

.commentary-mode.is-held {
  opacity: .68;
  cursor: not-allowed;
}

.commentary-status-card,
.commentary-metrics,
.commentary-edge-list {
  border: 1px solid rgba(216, 169, 59, .44);
  border-radius: var(--radius);
  background: rgba(20, 1, 31, .72);
}

.commentary-status-card,
.commentary-edge-list {
  padding: .75rem .85rem;
}

.commentary-status-title {
  display: block;
  color: var(--text);
  font-size: clamp(1.05rem, 4vw, 1.28rem);
}

.commentary-copy,
.commentary-edge,
.commentary-note {
  margin: .35rem 0 0;
  color: var(--text);
  font-size: clamp(.94rem, 3.6vw, 1.05rem);
  line-height: 1.2;
}

.commentary-metrics {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: .34rem .8rem;
  margin: 0;
  padding: .75rem .85rem;
}

.commentary-metrics dt {
  color: var(--muted);
  font-weight: 700;
}

.commentary-metrics dd {
  margin: 0;
  color: var(--text);
  font-weight: 700;
  text-align: right;
}

.commentary-subtitle {
  margin: 0;
  color: var(--muted);
  font-size: clamp(.95rem, 3.6vw, 1.05rem);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.commentary-edge strong {
  color: var(--text);
}

.commentary-note {
  color: var(--muted);
}

.commentary-scrim {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(5, 0, 10, .52);
}

.commentary-scrim[hidden] {
  display: none;
}

.commentary-drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 21;
  display: flex;
  width: min(34vw, 32rem);
  min-width: min(23rem, 100vw);
  height: 100vh;
  flex-direction: column;
  border-left: 1px solid var(--line);
  color: var(--text);
  background: linear-gradient(145deg, rgba(58, 25, 68, .98), rgba(16, 0, 24, .99));
  box-shadow: -20px 0 45px rgba(0, 0, 0, .45);
  transform: translateX(100%);
  transition: transform .18s ease;
}

.commentary-drawer[aria-hidden="true"] {
  pointer-events: none;
}

body.commentary-open {
  overflow: hidden;
}

body.commentary-open .commentary-drawer {
  transform: translateX(0);
}

.commentary-drawer-header {
  display: flex;
  gap: 1rem;
  align-items: start;
  justify-content: space-between;
  padding: 1rem;
  border-bottom: 1px solid var(--line-soft);
  background: rgba(13, 0, 20, .92);
}

.commentary-drawer-header p {
  margin: 0 0 .2rem;
  color: var(--blue);
  font-size: clamp(.95rem, 3.5vw, 1.08rem);
  font-weight: 700;
}

.commentary-drawer-header h2 {
  margin: 0;
  color: var(--text);
  font-size: clamp(1.45rem, 5vw, 2rem);
  line-height: 1.05;
}

.commentary-close {
  min-height: 2.35rem;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: .2rem .7rem .28rem;
  color: var(--text);
  background: rgba(255, 226, 165, .08);
  cursor: pointer;
  font-size: 1rem;
  font-weight: 700;
}

.commentary-drawer-body {
  display: grid;
  gap: .75rem;
  align-content: start;
  padding: 1rem;
  overflow: auto;
  scrollbar-color: var(--line) transparent;
}

.selector-row {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: .9rem;
  align-items: center;
  margin: 0 auto 1rem;
  width: min(100%, 1040px);
}

.selector-row label,
.selector-label {
  font-weight: 700;
  font-size: clamp(1rem, 3.2vw, 1.2rem);
}

select,
button,
input {
  font: inherit;
}

.span-options {
  display: flex;
  flex-wrap: wrap;
  gap: .55rem;
  min-width: 0;
}

.span-option {
  min-height: 3.2rem;
  min-width: 8.5rem;
  padding: .45rem 1.1rem .55rem;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255, 226, 165, .1);
  font-size: clamp(1.15rem, 4.6vw, 1.55rem);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}

.span-option[aria-pressed="true"] {
  color: var(--text);
  border-color: var(--line);
  background: rgba(77, 31, 86, .82);
  box-shadow: inset 0 0 0 1px rgba(255, 224, 141, .88);
}

.render-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
  gap: 1rem;
  width: min(100%, 1040px);
  margin: 0 auto;
}

.choice-panel,
.detail-panel,
.span-card,
.route-card,
.detail-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.choice-panel,
.detail-panel {
  padding: 1rem;
  background: linear-gradient(145deg, rgba(84, 50, 89, .88), rgba(31, 5, 44, .96));
}

.span-card,
.detail-card {
  background: rgba(25, 2, 38, .86);
  box-shadow: inset 0 0 0 1px rgba(255, 225, 159, .06);
}

.span-card {
  padding: 1rem;
}

.choice-panel {
  box-shadow: inset 0 0 0 1px rgba(216, 169, 59, .2);
}

.span-card + .span-card,
.detail-card + .detail-card {
  margin-top: 1rem;
}

.section-kicker {
  margin: 0 0 .85rem;
  color: var(--muted);
  font-size: clamp(1rem, 3vw, 1.25rem);
  font-weight: 700;
  letter-spacing: .04em;
}

.span-label {
  margin: 0 0 .75rem;
  color: var(--text);
  font-size: clamp(1.05rem, 3.4vw, 1.35rem);
  font-weight: 700;
}

.component-shell {
  padding: .9rem;
  border: 1px solid rgba(216, 169, 59, .42);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, .045);
}

.component-shell + .component-shell {
  margin-top: .85rem;
}

.component-hebrew {
  margin: 0 0 .75rem;
  color: var(--muted);
  direction: rtl;
  font-size: clamp(1.3rem, 4.8vw, 2rem);
  font-weight: 700;
  text-align: left;
}

.split-label {
  direction: rtl;
  text-align: left;
}

.route-card {
  display: block;
  width: 100%;
  min-height: 5.8rem;
  padding: .8rem 1rem;
  color: var(--text);
  text-align: left;
  border-color: var(--line);
  background: rgba(77, 31, 86, .82);
  cursor: pointer;
}

.route-card[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1px #ffe08d;
}

.route-title {
  display: block;
  font-size: clamp(1.35rem, 6.2vw, 2rem);
  line-height: 1.08;
  font-weight: 700;
}

.route-subtitle {
  display: block;
  margin-top: .25rem;
  color: var(--muted);
  font-size: clamp(1rem, 4.5vw, 1.45rem);
  line-height: 1.1;
}

.route-chips {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
  margin-top: .65rem;
}

.route-chip {
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: .2rem .55rem .26rem;
  color: var(--muted);
  background: rgba(255, 226, 165, .1);
  font-size: clamp(.95rem, 4vw, 1.35rem);
  line-height: 1.05;
}

.detail-panel {
  display: grid;
  gap: .85rem;
  align-content: start;
  box-shadow: inset 0 0 0 1px rgba(216, 169, 59, .2);
}

.detail-card {
  padding: 1rem;
}

.detail-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: .75rem;
  align-items: end;
  min-height: 7rem;
}

.detail-title {
  margin: 0;
  color: var(--text);
  font-size: clamp(1.35rem, 5.7vw, 2rem);
  line-height: 1.12;
}

.detail-hebrew {
  color: var(--text);
  direction: rtl;
  font-size: clamp(1.7rem, 7vw, 2.45rem);
  font-weight: 700;
}

.detail-kind {
  margin: .8rem 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 3.8vw, 1.3rem);
  font-weight: 700;
}

.detail-copy {
  margin: .55rem 0 0;
  color: var(--text);
  font-size: clamp(1rem, 4.1vw, 1.25rem);
  line-height: 1.18;
  max-height: 8.25rem;
  overflow: auto;
  scrollbar-color: var(--line) transparent;
}

.license-title {
  margin: .25rem 0 .55rem;
  color: var(--text);
  font-size: clamp(1.3rem, 5.5vw, 1.8rem);
  line-height: 1.1;
  font-weight: 700;
}

.bundle-select-wrap {
  margin: 0 0 .75rem;
}

.source-select-wrap {
  margin: 0 0 .85rem;
}

.control-label {
  display: block;
  margin: 0 0 .35rem;
  color: var(--text);
  font-size: clamp(.92rem, 3.4vw, 1.05rem);
  font-weight: 700;
  letter-spacing: .04em;
}

.source-kicker {
  display: block;
}

.ledger-pills {
  display: flex;
  flex-wrap: wrap;
  gap: .45rem;
}

.ledger-pill {
  min-height: 2.45rem;
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  padding: .25rem .68rem .32rem;
  color: var(--muted);
  background: rgba(255, 226, 165, .1);
  cursor: pointer;
  font-size: clamp(.94rem, 3.7vw, 1.15rem);
  line-height: 1.05;
  font-weight: 700;
}

.ledger-pill[aria-pressed="true"] {
  color: var(--text);
  border-color: var(--line);
  background: rgba(77, 31, 86, .86);
  box-shadow: inset 0 0 0 1px rgba(255, 224, 141, .9);
}

.bundle-select,
.source-select {
  display: block;
  width: 100%;
  min-height: 3.65rem;
  margin: .35rem 0 .8rem;
  padding: .45rem 2.4rem .45rem .8rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text);
  background: #170121;
  font-size: clamp(1.05rem, 4.8vw, 1.45rem);
  font-weight: 700;
}

.bundle-card {
  cursor: default;
}

.bundle-layer {
  display: block;
  margin: 0 0 .3rem;
  color: var(--muted);
  font-size: clamp(.88rem, 3.2vw, 1rem);
  font-weight: 700;
  letter-spacing: .05em;
}

.route-chip-button {
  cursor: pointer;
  font-family: inherit;
}

.route-chip-button[aria-pressed="true"] {
  color: var(--text);
  border-color: var(--line);
  box-shadow: inset 0 0 0 1px rgba(255, 224, 141, .9);
}

.source-copy {
  margin: 0;
  color: var(--text);
  font-size: clamp(.98rem, 3.8vw, 1.15rem);
  line-height: 1.18;
  max-height: 9rem;
  overflow: auto;
  scrollbar-color: var(--line) transparent;
  overflow-wrap: anywhere;
}

.next-anchor {
  height: 40vh;
}

@media (max-width: 760px) {
  .shell {
    width: 100%;
  }

  .passage-bar {
    padding: 1.05rem 1.35rem 1.35rem;
  }

  .passage-nav {
    gap: 1rem;
  }

  .reader-frame {
    padding: 1rem .85rem 1.5rem;
  }

  .reader-frame::before {
    left: 1.05rem;
  }

  .reader-frame::after {
    right: 1.05rem;
  }

  .selector-row {
    grid-template-columns: auto minmax(0, 1fr);
    padding: 0 .7rem;
  }

  .top-card-grid,
  .section-control-card {
    width: calc(100% - 1.4rem);
  }

  .top-card-grid {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .word-card {
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .render-grid {
    grid-template-columns: 1fr;
    padding: 0 .7rem;
  }

  .choice-panel,
  .detail-panel {
    padding: .7rem;
  }

  .commentary-drawer {
    width: 50vw;
    min-width: min(24rem, 100vw);
  }
}

@media (max-width: 430px) {
  .passage-nav {
    gap: .8rem;
    font-size: .92rem;
  }

  .nav-action {
    padding-inline: .55rem;
  }

  .span-options {
    width: 100%;
  }

  .span-option {
    flex: 1 1 8.5rem;
  }

  .word-card {
    grid-template-columns: auto minmax(0, 1fr);
    gap: .85rem;
  }

  .word-values {
    grid-template-columns: 1fr;
  }

  .selected-gloss-line {
    font-size: 1.45rem;
  }

  .route-title {
    font-size: 1.42rem;
  }

  .route-card {
    min-height: 5rem;
    padding: .72rem .85rem;
  }

  .span-card,
  .component-shell {
    padding: .7rem;

  <script>
(function () {
  const model = window.HEBREW_RENDER_MODEL;
  const PILL_LIMIT = 5;
  const state = {
    compSpanId: model.defaultCompSpanId,
    lBundleByCell: new Map(),
    routeByLBundle: new Map(),
    mSupportByLBundle: new Map(),
    commentarySectionId: (
      model.passage.sections &&
      model.passage.sections[0] &&
      model.passage.sections[0].id
    ) || null,
    commentaryOpen: false,
    commentaryMode: (
      model.ledgerContracts &&
      model.ledgerContracts.commentary &&
      model.ledgerContracts.commentary.defaultMode
    ) || 'base_only'
  };

  const contentsList = document.getElementById('contents-list');
  const passageLine = document.getElementById('passage-line');
  const wordHebrew = document.getElementById('word-hebrew');
  const wordTransliteration = document.getElementById('word-transliteration');
  const selectedGlossStack = document.getElementById('selected-gloss-stack');
  const activeSectionRef = document.getElementById('active-section-ref');
  const topCommentaryButton = document.getElementById('top-commentary-button');
  const sectionCommentaryActions = document.getElementById('section-commentary-actions');
  const commentaryScrim = document.getElementById('commentary-scrim');
  const commentaryDrawer = document.getElementById('commentary-drawer');
  const commentaryDrawerContext = document.getElementById('commentary-drawer-context');
  const commentaryDrawerBody = document.getElementById('commentary-drawer-body');
  const commentaryClose = document.getElementById('commentary-close');
  const spanOptions = document.getElementById('span-options');
  const routeStack = document.getElementById('route-stack');
  const detailStack = document.getElementById('detail-stack');

  function selectedCompSpan() {
    return model.compSpans.find((span) => span.id === state.compSpanId) || model.compSpans[0];
  }

  function selectedLBundle(cell) {
    const requested = state.lBundleByCell.get(cell.id) || cell.defaultLBundleId;
    return cell.lBundles.find((bundle) => bundle.id === requested) || cell.lBundles[0];
  }

  function selectedRoute(bundle) {
    const requested = state.routeByLBundle.get(bundle.id) || bundle.defaultRouteId;
    return bundle.routes.find((route) => route.id === requested) || bundle.routes[0];
  }

  function selectedMSupport(bundle) {
    const requested = state.mSupportByLBundle.get(bundle.id);
    return bundle.mSupports.find((support) => support.id === requested) || bundle.mSupports[0];
  }

  function firstSection() {
    return (model.passage.sections && model.passage.sections[0]) || null;
  }

  function sectionById(sectionId) {
    return (
      model.passage.sections &&
      model.passage.sections.find((section) => section.id === sectionId)
    ) || firstSection();
  }

  function commentaryContract() {
    return model.ledgerContracts && model.ledgerContracts.commentary;
  }

  function commentaryEdgesForSection(section) {
    const commentary = commentaryContract();
    if (!commentary) return [];
    if (!section) return commentary.availableEdges;

    const ids = new Set(section.commentaryEdgeIds || []);
    return commentary.availableEdges.filter((edge) => (
      ids.has(edge.id) || (edge.sectionIds || []).includes(section.id)
    ));
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function renderContents() {
    if (!contentsList) return;
    clear(contentsList);

    const sections = model.passage.sections || [];
    for (const section of sections) {
      const link = el('a', 'contents-link', section.label || section.ref);
      link.href = '#page-top';
      link.setAttribute('aria-current', section.id === state.commentarySectionId ? 'true' : 'false');
      contentsList.appendChild(link);
    }
  }

  function renderPassage() {
    clear(passageLine);
    for (const token of model.passage.tokens) {
      const button = el('button', 'passage-token', token.hebrew);
      button.type = 'button';
      button.lang = 'he';
      button.dir = 'rtl';
      button.disabled = !token.active;
      button.setAttribute('aria-pressed', token.active ? 'true' : 'false');
      if (!token.active) button.title = 'Not materialized in this render slice';
      passageLine.appendChild(button);
    }
  }

  function renderSectionCommentaryActions() {
    const section = firstSection();
    if (!section || !sectionCommentaryActions) return;

    activeSectionRef.textContent = section.label || section.ref;
    clear(sectionCommentaryActions);

    const edges = commentaryEdgesForSection(section);
    if (!edges.length) return;

    const button = el('button', 'section-commentary-button', 'COMMENTARY');
    button.type = 'button';
    button.dataset.sectionId = section.id;
    button.appendChild(el('span', 'section-commentary-count', String(edges.length)));
    button.addEventListener('click', () => openCommentary(section.id));
    sectionCommentaryActions.appendChild(button);
  }

  function renderSelector() {
    clear(spanOptions);
    for (const span of model.compSpans) {
      const button = el('button', 'span-option', span.selectLabel);
      button.type = 'button';
      button.lang = 'he';
      button.dir = 'rtl';
      button.dataset.compSpanId = span.id;
      button.setAttribute('aria-pressed', span.id === selectedCompSpan().id ? 'true' : 'false');
      button.addEventListener('click', () => {
        state.compSpanId = span.id;
        render();
      });
      spanOptions.appendChild(button);
    }
  }

  function renderWordCard() {
    wordHebrew.textContent = model.word.hebrew;
    wordTransliteration.textContent = model.word.transliteration;
  }

  function selectedGlossText(span) {
    const parts = span.cells.map((cell) => selectedRoute(selectedLBundle(cell)).text);
    return span.isSplit ? parts.join(' + ') : parts[0];
  }

  function renderSelectedGloss(span) {
    clear(selectedGlossStack);
    const line = el('div', `selected-gloss-line${span.isSplit ? ' is-split' : ''}`);
    if (!span.isSplit) {
      line.textContent = selectedGlossText(span);
      selectedGlossStack.appendChild(line);
      return;
    }

    span.cells.forEach((cell, index) => {
      if (index > 0) line.appendChild(el('span', 'selected-gloss-plus', ' + '));
      line.appendChild(el('span', 'selected-gloss-part', selectedRoute(selectedLBundle(cell)).text));
    });
    selectedGlossStack.appendChild(line);
  }

  function selectedCommentaryMode(commentary) {
    const requested = state.commentaryMode || commentary.defaultMode;
    return commentary.modes.find((mode) => mode.id === requested) || commentary.modes[0];
  }

  function renderCommentaryModeButtons(commentary) {
    const modes = el('div', 'commentary-modes');
    for (const mode of commentary.modes) {
      const button = el('button', `commentary-mode${mode.enabled ? '' : ' is-held'}`, mode.label);
      button.type = 'button';
      button.disabled = !mode.enabled;
      button.setAttribute('aria-disabled', mode.enabled ? 'false' : 'true');
      button.setAttribute('aria-pressed', mode.id === state.commentaryMode ? 'true' : 'false');
      button.title = mode.copy;
      if (mode.enabled) {
        button.addEventListener('click', () => {
          state.commentaryMode = mode.id;
          renderCommentaryDrawer();
        });
      }
      modes.appendChild(button);
    }
    return modes;
  }

  function renderCommentaryMetrics(summary) {
    const metrics = el('dl', 'commentary-metrics');
    const rows = [
      ['edges audited', summary.commentaryEdgesAudited],
      ['source/license clean', summary.sourceAndLicenseCleanEdges],
      ['base split ready', summary.baseWithCommentarySplitReady],
      ['commentary-only ready', summary.commentaryOnlyReady],
      ['alignment required', summary.alignmentArtifactRequiredRows],
      ['source text appended', summary.sourceTextRowsAppended],
      ['cleanroom touched', summary.cleanroomTouched]
    ];

    for (const row of rows) {
      metrics.appendChild(el('dt', null, row[0]));
      metrics.appendChild(el('dd', null, String(row[1])));
    }

    return metrics;
  }

  function renderCommentaryDrawer() {
    const commentary = commentaryContract();
    if (!commentaryDrawerBody || !commentary || !state.commentaryOpen) return;

    const section = sectionById(state.commentarySectionId);
    const commentaryEdges = commentaryEdgesForSection(section);
    commentaryDrawerContext.textContent = section ? section.ref : model.passage.ref;
    clear(commentaryDrawerBody);
    commentaryDrawerBody.appendChild(renderCommentaryModeButtons(commentary));

    const activeMode = selectedCommentaryMode(commentary);
    const status = el('div', 'commentary-status-card');
    status.appendChild(el('strong', 'commentary-status-title', activeMode.statusLabel));
    status.appendChild(el('p', 'commentary-copy', activeMode.copy));
    commentaryDrawerBody.appendChild(status);
    commentaryDrawerBody.appendChild(renderCommentaryMetrics(commentary.summary));

    const edgeList = el('div', 'commentary-edge-list');
    edgeList.appendChild(el('h3', 'commentary-subtitle', 'Aligned here, held'));
    for (const edge of commentaryEdges) {
      const item = el('p', 'commentary-edge');
      item.appendChild(el('strong', null, edge.work));
      item.appendChild(document.createTextNode(` - ${edge.status}`));
      edgeList.appendChild(item);
    }
    commentaryDrawerBody.appendChild(edgeList);

    for (const noteText of commentary.contractNotes) {
      commentaryDrawerBody.appendChild(el('p', 'commentary-note', noteText));
    }
  }

  function openCommentary(sectionId) {
    const section = sectionById(sectionId) || firstSection();
    if (section) state.commentarySectionId = section.id;
    state.commentaryOpen = true;
    document.body.classList.add('commentary-open');
    commentaryScrim.hidden = false;
    commentaryDrawer.setAttribute('aria-hidden', 'false');
    renderCommentaryDrawer();
    commentaryDrawer.focus({ preventScroll: true });
  }

  function closeCommentary() {
    state.commentaryOpen = false;
    document.body.classList.remove('commentary-open');
    commentaryScrim.hidden = true;
    commentaryDrawer.setAttribute('aria-hidden', 'true');
  }

  function wireCommentaryControls() {
    if (topCommentaryButton) {
      topCommentaryButton.addEventListener('click', () => {
        const section = sectionById(state.commentarySectionId) || firstSection();
        openCommentary(section && section.id);
      });
    }
    if (commentaryClose) commentaryClose.addEventListener('click', closeCommentary);
    if (commentaryScrim) commentaryScrim.addEventListener('click', closeCommentary);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.commentaryOpen) closeCommentary();
    });
  }

  function renderLBundleControl(cell, bundle) {
    if (cell.lBundles.length < 2) return null;

    const wrap = el('div', 'bundle-select-wrap');
    const label = el('span', 'control-label', 'L BUNDLE');
    wrap.appendChild(label);

    if (cell.lBundles.length <= PILL_LIMIT) {
      const pills = el('div', 'bundle-pills ledger-pills');
      pills.setAttribute('role', 'group');
      pills.setAttribute('aria-label', `L bundle for ${cell.transliteration}`);

      for (const optionBundle of cell.lBundles) {
        const button = el('button', 'bundle-pill ledger-pill', optionBundle.label);
        button.type = 'button';
        button.setAttribute('aria-pressed', optionBundle.id === bundle.id ? 'true' : 'false');
        button.addEventListener('click', () => {
          state.lBundleByCell.set(cell.id, optionBundle.id);
          render();
        });
        pills.appendChild(button);
      }

      wrap.appendChild(pills);
      return wrap;
    }

    const select = el('select', 'bundle-select');
    select.id = `l-${cell.id}`;
    select.dataset.cellId = cell.id;
    for (const optionBundle of cell.lBundles) {
      const option = document.createElement('option');
      option.value = optionBundle.id;
      option.textContent = optionBundle.label;
      select.appendChild(option);
    }
    select.value = bundle.id;
    select.addEventListener('change', () => {
      state.lBundleByCell.set(cell.id, select.value);
      render();
    });
    wrap.appendChild(select);
    return wrap;
  }

  function renderRouteButton(bundle, route) {
    const button = el('button', 'route-chip route-chip-button r-route-pill', route.text);
    button.type = 'button';
    button.setAttribute('aria-pressed', selectedRoute(bundle).id === route.id ? 'true' : 'false');
    button.addEventListener('click', () => {
      state.routeByLBundle.set(bundle.id, route.id);
      render();
    });
    return button;
  }

  function renderBundleCard(cell, bundle) {
    const card = el('section', 'route-card bundle-card');
    card.appendChild(el('span', 'bundle-layer', 'D BUNDLE'));
    card.appendChild(el('span', 'route-title', bundle.label));
    const chips = el('span', 'route-chips');
    for (const route of bundle.routes) chips.appendChild(renderRouteButton(bundle, route));
    card.appendChild(chips);
    return card;
  }

  function renderChoicePanel(span) {
    clear(routeStack);
    const spanCard = el('article', 'span-card');
    spanCard.appendChild(el('h2', 'section-kicker', span.kindLabel.toUpperCase()));
    const spanLabel = el('p', `span-label${span.isSplit ? ' split-label' : ''}`, span.displayLabel);
    spanCard.appendChild(spanLabel);

    for (const cell of span.cells) {
      const bundle = selectedLBundle(cell);
      const componentShell = el('section', 'component-shell');
      const hebrew = el('p', 'component-hebrew', cell.hebrew);
      hebrew.lang = 'he';
      hebrew.dir = 'rtl';
      componentShell.appendChild(hebrew);

      const bundleControl = renderLBundleControl(cell, bundle);
      if (bundleControl) componentShell.appendChild(bundleControl);
      componentShell.appendChild(renderBundleCard(cell, bundle));
      spanCard.appendChild(componentShell);
    }

    routeStack.appendChild(spanCard);
  }

  function renderSpanDetail(cell) {
    const card = el('article', 'detail-card');
    const top = el('div', 'detail-top');
    top.appendChild(el('h2', 'section-kicker', 'SPAN'));
    const hebrew = el('div', 'detail-hebrew', cell.hebrew);
    hebrew.lang = 'he';
    hebrew.dir = 'rtl';
    top.appendChild(hebrew);
    card.appendChild(top);
    card.appendChild(el('p', 'detail-kind', cell.spanKind));
    return card;
  }

  function renderDefinitionDetail(cell, bundle) {
    const route = selectedRoute(bundle);
    const card = el('article', 'detail-card');
    card.appendChild(el('h2', 'section-kicker', 'DEFINITION'));
    card.appendChild(el('h3', 'detail-title', bundle.label));
    card.appendChild(el('p', 'detail-copy', `Selected R: ${route.text}. D: ${bundle.label}. ${cell.hebrew} carries this licensed bundle.`));
    return card;
  }

  function renderMSupportControl(bundle, support) {
    if (bundle.mSupports.length < 2) return null;

    const wrap = el('div', 'source-select-wrap');
    const label = el('span', 'section-kicker source-kicker', 'M SOURCE');
    wrap.appendChild(label);

    if (bundle.mSupports.length <= PILL_LIMIT) {
      const pills = el('div', 'source-pills ledger-pills');
      pills.setAttribute('role', 'group');
      pills.setAttribute('aria-label', `M source for ${bundle.label}`);

      for (const optionSupport of bundle.mSupports) {
        const button = el('button', 'source-pill ledger-pill', optionSupport.label);
        button.type = 'button';
        button.setAttribute('aria-pressed', optionSupport.id === support.id ? 'true' : 'false');
        button.addEventListener('click', () => {
          state.mSupportByLBundle.set(bundle.id, optionSupport.id);
          render();
        });
        pills.appendChild(button);
      }

      wrap.appendChild(pills);
      return wrap;
    }

    const select = el('select', 'source-select');
    select.id = `m-${bundle.id}`;
    for (const optionSupport of bundle.mSupports) {
      const option = document.createElement('option');
      option.value = optionSupport.id;
      option.textContent = optionSupport.label;
      select.appendChild(option);
    }
    select.value = support.id;
    select.addEventListener('change', () => {
      state.mSupportByLBundle.set(bundle.id, select.value);
      render();
    });
    wrap.appendChild(select);
    return wrap;
  }

  function renderLicenseDetail(cell, bundle) {
    const support = selectedMSupport(bundle);
    const card = el('article', 'detail-card');
    card.appendChild(el('h2', 'section-kicker', 'LICENSE / SOURCE'));

    const supportControl = renderMSupportControl(bundle, support);
    if (supportControl) card.appendChild(supportControl);

    card.appendChild(el('div', 'license-title', support.title));
    card.appendChild(el('p', 'source-copy', support.copy));
    return card;
  }

  function renderDetails(span) {
    clear(detailStack);
    for (const cell of span.cells) {
      const bundle = selectedLBundle(cell);
      detailStack.appendChild(renderSpanDetail(cell));
      detailStack.appendChild(renderDefinitionDetail(cell, bundle));
      detailStack.appendChild(renderLicenseDetail(cell, bundle));
    }
  }

  function render() {
    const span = selectedCompSpan();
    renderSectionCommentaryActions();
    renderSelector();
    renderSelectedGloss(span);
    renderChoicePanel(span);
    renderDetails(span);
    renderCommentaryDrawer();
  }

  wireCommentaryControls();
  renderContents();
  renderPassage();
  renderWordCard();
  render();
}());

  </script>
</head>
<body>
  <main class="shell">
    <details class="contents-strip">
      <summary>CONTENTS <span>292 sections</span></summary>
      <div class="contents-list" id="contents-list"></div>
    </details>

    <header class="passage-bar">
      <nav class="passage-nav" aria-label="Passage navigation">
        <a href="#page-top">GENESIS 1:1</a>
        <a href="#page-top">PAGE TOP</a>
        <a href="#next-section">NEXT SECTION</a>
        <button class="nav-action" id="top-commentary-button" type="button">COMMENTARY</button>
      </nav>
      <div class="passage-line" id="passage-line" dir="rtl" lang="he"></div>
    </header>

    <section class="reader-frame" id="page-top" aria-label="Selected Hebrew render">
      <section class="section-control-card" aria-label="Section controls">
        <strong id="active-section-ref">GENESIS 1:1</strong>
        <div id="section-commentary-actions"></div>
      </section>

      <div class="top-card-grid">
        <section class="word-card" aria-label="Selected Hebrew word">
          <div class="word-labels">
            <span>Hebrew</span>
            <span>Transliteration</span>
          </div>
          <div class="word-values">
            <strong id="word-hebrew" lang="he" dir="rtl"></strong>
            <span id="word-transliteration"></span>
          </div>
        </section>

        <section class="selected-gloss-card" aria-label="Selected gloss">
          <h2>Selected Gloss</h2>
          <div id="selected-gloss-stack"></div>
        </section>
      </div>

      <div class="selector-row">
        <span class="selector-label">HEBREW SPAN</span>
        <div class="span-options" id="span-options" role="group" aria-label="Hebrew span"></div>
      </div>

      <div class="render-grid">
        <section class="choice-panel" aria-label="Available route choices">
          <div id="route-stack"></div>
        </section>

        <section class="detail-panel" aria-label="Selected route details">
          <div id="detail-stack"></div>
        </section>
      </div>
    </section>

    <div id="next-section" class="next-anchor" aria-hidden="true"></div>
  </main>
  <div class="commentary-scrim" id="commentary-scrim" hidden></div>
  <aside class="commentary-drawer" id="commentary-drawer" aria-label="Commentary" aria-hidden="true" tabindex="-1">
    <header class="commentary-drawer-header">
      <div>
        <p id="commentary-drawer-context"></p>
        <h2>Commentary</h2>
      </div>
      <button class="commentary-close" id="commentary-close" type="button">Close</button>
    </header>
    <div class="commentary-drawer-body" id="commentary-drawer-body"></div>
  </aside>
</body>
</html>
