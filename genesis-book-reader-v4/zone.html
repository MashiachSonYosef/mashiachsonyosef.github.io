<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone reader · The Tabernacle</title>
<style>
  :root {
    color-scheme: dark;
    /* Tabernacle materials: shesh (linen), zahav (gold), tekhelet reserved
       for structure lines — text and links wear linen, never blue. */
    --bg: #0a0f16; --panel: #101823; --panel2: #0d1520;
    --ink: #ece1c4; --ink-strong: #f6ecd2; --muted: #8fa1b3; --faint: #5f7183;
    --shesh: #d8c7a4; --shesh-bright: #eadbbd;
    --gold: #e8c46a; --gold-dim: #9a7f3f; --amber: #d9a441;
    --line: #1e2c3c; --link: var(--shesh);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Georgia, "Times New Roman", serif; }

  header.top { padding: 1.4rem 1.5rem 1rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0d1520 0%, var(--bg) 100%); }
  header.top h1 { margin: 0; font-size: 1.9rem; color: var(--ink-strong); letter-spacing: 0.01em; }
  header.top h1 .he-t { font-size: 2.1rem; margin-right: 0.7rem; }
  header.top h1 .en-t { color: var(--gold); font-size: 1.15rem; font-variant: small-caps; letter-spacing: 0.14em; }
  header.top p.byline { margin: 0.25rem 0 0; font-size: 0.85rem; color: var(--muted); }
  header.top p#meta { margin: 0.55rem 0 0; font-size: 0.8rem; color: var(--muted); max-width: 60rem; }
  .receipts-btn { background: none; border: 0; border-bottom: 1px dotted var(--gold-dim);
    color: var(--link); font: inherit; font-size: 0.8rem; cursor: pointer; padding: 0; }
  .receipts-btn:hover { color: var(--gold); }
  .receipts-full { display: block; margin-top: 0.4rem; color: var(--faint); }
  .receipts-full[hidden] { display: none; }
  /* A work the ledger has not named in Hebrew keeps its English locator, but
     the locator does not get to look like a title. */
  header.top h1 .en-t.unnamed { color: var(--muted); font-variant: normal; letter-spacing: 0.06em; }
  header.top nav { margin-top: 0.6rem; font-size: 0.85rem; }
  /* A book the ledger has named reads in Hebrew here; one it has not keeps its
     English locator, at the weight of a locator. */
  header.top nav a[lang="he"] { font-family: "Frank Ruehl CLM", "David Libre", "SBL Hebrew", Georgia, serif;
    font-size: 1.02rem; }
  header.top a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(216, 199, 164, 0.35); }
  header.top a:hover { color: var(--gold); border-bottom-color: var(--gold); }

  /* contents */
  #toc { max-width: 48rem; margin: 1.3rem auto 0; padding: 0 1.5rem; }
  #toc h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); margin: 0 0 0.5rem; }
  /* Contents is a coordinate grid: positions, not content. Plain English
     names the structure ("Part 2", "Chapter 7") — describing a thing is not
     translating it, and an English reader should never be locked out of
     navigation. The words themselves live in the text, where they can be
     tapped. */
  #toc .chs { display: grid; gap: 0.28rem; margin-top: 0.3rem;
    grid-template-columns: repeat(auto-fill, minmax(2.35rem, 1fr)); }
  #toc .chs a { display: flex; align-items: center; justify-content: center; min-height: 2.05rem;
    border: 1px solid var(--line); border-radius: 0.35rem; background: var(--panel2);
    text-decoration: none; font: 0.92rem/1 Georgia, serif; color: var(--gold);
    font-variant-numeric: tabular-nums; transition: border-color 120ms, background 120ms; }
  #toc .chs a:hover { border-color: var(--gold); background: #16202c; }
  #toc .chs a.on { border-color: var(--gold); background: var(--gold); color: #171105; font-weight: bold; }
  /* the sections of one chapter, opened in place under the grid */
  #secPanel { margin-top: 0.7rem; border: 1px solid var(--line); border-radius: 0.5rem;
    background: var(--panel2); padding: 0.6rem 0.7rem; }
  #secPanel[hidden] { display: none; }
  #secPanel .sp-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem;
    font-size: 0.74rem; letter-spacing: 0.14em; font-variant: small-caps; color: var(--faint); }
  #secPanel .sp-he { font-variant: normal; letter-spacing: 0; font-size: 1rem; color: var(--gold); }
  #secPanel .sp-x { margin-inline-start: auto; background: none; border: 0; color: var(--muted);
    font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 0 0.2rem; }
  #secPanel .sp-grid { display: grid; gap: 0.26rem;
    grid-template-columns: repeat(auto-fill, minmax(2.9rem, 1fr)); }
  #secPanel .sp-grid a { display: flex; align-items: center; justify-content: center; min-height: 1.85rem;
    border: 1px solid var(--line); border-radius: 0.32rem; background: var(--panel);
    color: var(--muted); text-decoration: none; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  #secPanel .sp-grid a:hover { border-color: var(--gold); color: var(--gold); }
  #secPanel .sp-grid a.sp-top { grid-column: span 2; color: var(--gold); font-variant: small-caps;
    letter-spacing: 0.1em; border-color: var(--gold-dim); }

  /* one floating bar, not chrome on every section */
  #nav { position: fixed; z-index: 60; right: 0.9rem; bottom: 0.9rem; display: flex; gap: 0.3rem;
    background: rgba(16, 24, 35, 0.94); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem; box-shadow: 0 8px 24px rgba(0,0,0,.5); backdrop-filter: blur(4px); }
  #nav[hidden] { display: none; }
  #nav button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.75rem;
    letter-spacing: 0.08em; font-variant: small-caps; cursor: pointer; border-radius: 999px;
    padding: 0.24rem 0.7rem; white-space: nowrap; }
  #nav button:hover:not(:disabled) { color: var(--gold); background: #16202c; }
  #nav button:disabled { opacity: 0.35; cursor: default; }
  #navPrev, #navNext { font-size: 1rem; padding: 0.14rem 0.55rem; }
  @media (max-width: 520px) { #nav { left: 0.9rem; right: 0.9rem; justify-content: center; } }

  #toc .toc-note { margin: 0.75rem 0 0; font-size: 0.72rem; color: var(--faint); }
  #toc .part { margin: 0 0 0.65rem; }
  #toc .part b { display: block; color: var(--gold); font-variant: small-caps; letter-spacing: 0.1em;
    font-weight: normal; font-size: 0.92rem; margin-bottom: 0.15rem; }
  #toc .part b .he-small { color: var(--ink); font-size: 1rem; margin-left: 0.6rem; }
  #toc a { color: var(--muted); text-decoration: none; font-size: 0.84rem; }
  #toc a:hover { color: var(--link); }

  main { max-width: 48rem; margin: 0 auto; padding: 0.4rem 1.5rem 5rem; }

  .part-head { margin: 3rem 0 0.4rem; padding-top: 1.6rem; border-top: 1px double var(--gold-dim); }
  .part-head .he { direction: rtl; text-align: right; font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .part-head .en { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); text-align: left; }
  /* Titles are corpus words: same word blocks as the text, sized as a title.
     Gold on the Hebrew per the Y ledger's own colour contract (structure). */
  .title-row { direction: rtl; text-align: right; }
  body.en .title-row { direction: ltr; text-align: left; }
  .part-head .title-row .w { font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .node-head .title-row .w { font-size: 1.55rem; color: var(--gold); }
  .title-row .wb { margin-bottom: 0.35rem; }
  .title-row .g { font-size: 0.62rem; max-width: 9em; }
  .node-head .title-row .g { font-size: 0.68rem; }
  .locator { display: block; font-size: 0.74rem; letter-spacing: 0.16em; font-variant: small-caps;
    color: var(--faint); margin-bottom: 0.3rem; }
  .vnum { font-variant-numeric: tabular-nums; }
  .seg-row .vlabel { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-inline-start: 0.4rem; }

  .node-head { margin: 1.9rem 0 0.9rem; }
  .node-head .he { direction: rtl; text-align: right; font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .node-head .en { font-size: 0.82rem; font-variant: small-caps; letter-spacing: 0.16em; color: var(--gold); margin-top: 0.1rem; }

  section.seg { margin: 0 0 1.35rem; }
  .seg-row { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.25rem; direction: ltr; }
  .vnum { font-size: 0.72rem; color: var(--gold); border: 1px solid #3a3220;
    background: #151b26; border-radius: 0.5rem; padding: 0.05rem 0.5rem; letter-spacing: 0.06em; }
  .vnum.at { background: var(--gold); color: #171105; border-color: var(--gold); font-weight: bold; }
  .drift-chip { font-size: 0.68rem; color: var(--amber); border: 1px dashed #6b5320; border-radius: 0.5rem;
    padding: 0.05rem 0.45rem; letter-spacing: 0.03em; }
  .he-text { direction: rtl; text-align: right; font-size: 1.5rem; line-height: 1.35; margin: 0;
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  /* A commentary is not a book of its own; it belongs to the section it
     comments on. Turned on, it reads beneath the verse in the same word
     blocks, a size down, so the base text stays the text. */
  .c-inline { direction: rtl; text-align: right; margin: 0.15rem 0 0; padding-inline-end: 0.1rem;
    border-inline-end: 2px solid var(--line); padding-inline-start: 0; }
  .c-inline .wb { margin: 0 0.14rem 0.45rem; }
  .c-inline .w { font-size: 1.12rem; color: #c8bda0;
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .c-inline .g { font-size: 0.6rem; max-width: 8em; }
  .c-inline[hidden] { display: none; }
  .c-inline .lab { display: block; direction: ltr; text-align: left; font-size: 0.62rem;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-bottom: 0.1rem; }
  .c-inline .lab .lic-chip { text-transform: none; letter-spacing: 0.02em; }
  /* Where the attachment came from, said in place. The card used to carry
     this; the commentary reads here now, so the basis reads here too. */
  .c-inline .c-att { display: block; direction: ltr; text-align: left; font-size: 0.64rem;
    color: var(--faint); margin-top: 0.15rem; }
  body.en .c-inline { direction: ltr; text-align: left; }
  body.en .c-inline .g { font-size: 0.86rem; max-width: 11em; }
  body.en .c-inline .w { font-size: 0.92rem; }
  .wb { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top;
    margin: 0 0.16rem 0.55rem; cursor: pointer; }
  .w { display: block; order: 1; border-bottom: 1px dashed transparent; border-radius: 2px; }
  .wb:hover .w { color: #ffe08a; border-bottom-color: #6a5a33; }
  .wb.held { opacity: 0.45; cursor: default; }
  .wb.active .w { color: var(--gold); border-bottom: 1px solid var(--gold); }
  /* An occurrence written with a maqaf is one block and more than one W. The
     block never splits; the W inside it light and open one at a time, and the
     maqaf itself prints without opening, because it is not a W. */
  .wb.multi:hover .w { color: inherit; border-bottom-color: transparent; }
  .wb.multi.active .w { color: inherit; border-bottom: 1px dashed transparent; }
  .wr { border-bottom: 1px dashed transparent; border-radius: 2px; }
  .wr:hover { color: #ffe08a; border-bottom-color: #6a5a33; }
  .wr.on { color: var(--gold); border-bottom: 1px solid var(--gold); }
  .mq { color: var(--faint); }
  /* The reading under a word is shown whole. It used to run one line and end in
     an ellipsis, which was the honest thing to do when the average reading was
     45 characters and the tail ran to 435 — the page could not have carried
     them. Under the provider declarations the average is 23, so the tail is
     gone and the ellipsis has nothing left to hide. It wraps in a narrow
     column instead of widening the row, so a long reading costs its own word a
     few lines rather than costing the whole line its shape. The height is
     settled at paint and never changes afterwards: nothing here moves while
     the reader is reading. */
  .g { display: block; order: 2; direction: ltr; font: 0.66rem/1.25 Georgia, serif; color: var(--muted);
    letter-spacing: 0.02em; margin-top: 0.06rem; max-width: 11em;
    white-space: normal; overflow-wrap: anywhere; overflow: hidden; }
  .wb.active .g { color: var(--gold); }

  /* English reader (LTR): the gloss line leads, the Hebrew rides beneath. */
  body.en .he-text { direction: ltr; text-align: left; }
  /* In the English reader the gloss is the text, not a label on it. It clamped
     at two lines for the same reason the Hebrew-side one clipped at one, and
     it comes off for the same reason: there is no longer a tail to hide. */
  body.en .g { order: 1; font-size: 0.98rem; line-height: 1.3; color: var(--ink); margin-top: 0; max-width: 12em;
    white-space: normal; display: block; overflow: visible; }
  body.en .w { order: 2; font-size: 1.02rem; color: #b3a077; margin-top: 0.04rem; }
  body.en .wb.active .g { color: var(--gold); }

  #modeRow { margin-top: 0.75rem; display: flex; gap: 0.55rem; }
  .mode-btn { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 999px; padding: 0.32rem 1.15rem; font: inherit; font-size: 0.86rem; cursor: pointer; }
  .mode-btn.on { background: var(--gold); color: #171105; border-color: var(--gold); font-weight: bold; }

  /* The HUD floats. The Hebrew never moves — law of the house. */
  /* A card that always carries a whole record needs room for one; 55vh put
     the source and its licence below the fold on a phone. */
  #hud { position: fixed; z-index: 70; max-width: 23rem; width: min(23rem, 92vw); max-height: min(72vh, 44rem);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid #2c4a63; border-radius: 0.7rem;
    padding: 0.85rem 1.05rem; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
  /* what scrolls, and what does not */
  #hud .rows { flex: 1 1 auto; min-height: 2.5rem; overflow-y: auto; }
  #hud .d-slot { flex: 0 0 auto; max-height: 58%; overflow-y: auto; }
  #hud .prov { flex: 0 0 auto; }
  #hud[hidden] { display: none; }
  /* The head is the handle. A card the reader can move is a card that stops
     being in the way, and a card that is never re-anchored while it is open
     stops moving on its own. It is sticky so the handle is reachable however
     far the record below it has been scrolled. */
  #hud .head { cursor: grab; touch-action: none; flex: 0 0 auto; }
  #hud .head:active { cursor: grabbing; }
  #hud.moved { box-shadow: 0 14px 40px rgba(0,0,0,.6), 0 0 0 1px var(--gold-dim); }
  #hud .head button { cursor: pointer; }
  #hud .head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem;
    border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; margin-bottom: 0.3rem; }
  #hud .head b { font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .head button { background: none; border: 0; color: var(--link); font-size: 1.15rem; cursor: pointer; }
  #hud p { margin: 0.45rem 0; }
  #hud .att { color: var(--muted); font-size: 0.78rem; }
  #hud .att a { color: var(--link); }
  /* R pills — one route per pill, one selected at a time (the reader's law). */
  #hud .r-label { margin: 0.5rem 0 0.3rem; color: var(--faint); font-size: 0.74rem;
    letter-spacing: 0.06em; text-transform: uppercase; }
  /* Every R is here, so this row is the one thing on the card allowed to be
     long. It scrolls on its own rather than pushing the D and M off the end. */
  #hud .r-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  /* A pill shows its whole reading. It used to clamp at two lines, which made
     the card claim a reading it was not showing — the code beneath says R is
     "never truncated away" and the clamp was quietly making that false. A long
     reading now takes the room it needs; the row scrolls, so the D and the M
     below it are still one flick away, and a reading that runs to a paragraph
     looks like one, which is information about the record, not noise. */
  #hud .r-pills button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 0.9rem; padding: 0.22rem 0.7rem; font: inherit; font-size: 0.76rem; cursor: pointer;
    max-width: 100%; text-align: left; white-space: normal; overflow-wrap: anywhere; }
  #hud .r-pills button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold);
    color: #171105; font-weight: bold; }
  #hud .r-more { margin-top: 0.35rem; background: none; border: 0; color: var(--link);
    font: inherit; font-size: 0.76rem; cursor: pointer; padding: 0; }
  #hud .r-overflow { margin-top: 0.45rem; }
  #hud .r-overflow select { width: 100%; font: inherit; font-size: 0.78rem; color: var(--muted);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 0.45rem;
    padding: 0.3rem 0.5rem; cursor: pointer; }
  #hud .r-overflow select:hover { border-color: var(--gold-dim); }
  #hud .r-overflow select.on { color: #171105; background: var(--gold); border-color: var(--gold); font-weight: bold; }
  #hud .d-card { margin-top: 0.55rem; border-top: 1px solid var(--line); padding-top: 0.45rem; }
  #hud .d-cut { margin: 0 0 0.35rem; font-size: 0.72rem; color: var(--amber);
    border-inline-start: 2px solid var(--amber); padding-inline-start: 0.5rem; }
  /* The D record, whole and never clipped. The sense the reader selected is
     lit inside it, so a truncated pill still resolves to something readable. */
  #hud .d-card .d-text { margin: 0.25rem 0; color: var(--muted); }
  #hud .d-card .d-sense.on { color: var(--ink-strong); font-weight: bold; }
  #hud .d-card .d-sep { color: var(--faint); }
  #hud .d-more { margin-top: 0.35rem; background: none; border: 0; border-bottom: 1px dotted var(--gold-dim);
    color: var(--muted); font: inherit; font-size: 0.72rem; cursor: pointer; padding: 0 0 0.05rem; text-align: left; }
  #hud .d-more:hover { color: var(--gold); }
  #hud .d-more[aria-expanded="true"] { color: var(--gold); }
  #hud .d-drawer { margin-top: 0.3rem; padding-inline-start: 0.6rem; border-inline-start: 1px solid var(--line); }
  #hud .d-drawer[hidden] { display: none; }
  /* Structure pills — how the form divides, and which block of it is open.
     Quieter than a reading pill on purpose: the reading is the loud thing on
     this card, and the structure is how you got to it. */
  #hud .s-pills { display: flex; flex-wrap: wrap; gap: 0.32rem; direction: ltr; }
  /* the blocks of one division lay out in the word's own direction, so the
     row reads as the form does and the word visibly reassembles */
  #hud .s-pills[dir="rtl"] { direction: rtl; }
  #hud .s-pills button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 0.4rem; padding: 0.18rem 0.6rem; font: inherit; font-size: 0.9rem; cursor: pointer;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .s-pills button:hover { border-color: var(--gold-dim); color: var(--shesh); }
  #hud .s-pills button[aria-pressed="true"] { border-color: var(--shesh); color: var(--ink-strong);
    background: #17222f; }
  #hud .s-pills button .none { font: 0.62rem/1 Georgia, serif; color: var(--faint); margin-inline-start: 0.35rem; }
  #hud .prov { color: var(--faint); font-size: 0.72rem; margin: 0.35rem 0 0; }
  .lic-chip { display: inline-block; margin-inline-start: 0.45rem; padding: 0.02rem 0.5rem;
    border-radius: 999px; background: rgba(216, 199, 164, 0.12); border: 1px solid rgba(216, 199, 164, 0.3);
    color: var(--shesh); font-size: 0.72rem; }
  /* Commentary rides in the same register as the readings: same pill, same
     selected treatment, same card. It is named by its label, not by a colour
     of its own — a commentator is one more voice on the card, not a louder
     kind of thing than the catalog it sits beside. */
  .wb { position: relative; }
  .c-chip { position: absolute; top: -0.35rem; left: -0.5rem; z-index: 2; direction: ltr;
    font: bold 0.58rem/1.5 Inter, system-ui, sans-serif; color: #171105; background: var(--gold-dim);
    border-radius: 999px; min-width: 1.05rem; text-align: center; padding: 0 0.22rem; pointer-events: none; }
  body.en .c-chip { left: auto; right: -0.5rem; }
  #hud .c-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  #hud .c-pills button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 999px; padding: 0.22rem 0.7rem; font: inherit; font-size: 0.76rem; cursor: pointer;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .c-pills button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold);
    color: #171105; font-weight: bold; }
  #hud .c-card { margin-top: 0.55rem; border-top: 1px solid var(--line); padding-top: 0.45rem; }
  #hud .c-card .c-he { margin: 0.3rem 0; font-size: 1.05rem; line-height: 1.9; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .c-note { color: var(--faint); font-size: 0.72rem; margin: 0.2rem 0 0; }
  /* A commentary served from the chain is text, not decoration: its own words
     carry their own routes, so they are word blocks like any others. */
  #hud .c-he .wb { margin: 0 0.14rem 0.5rem; }
  #hud .c-he .w { font-size: 1.05rem; }
  #hud .c-he .g { font-size: 0.6rem; max-width: 8em; }
  #hud .c-back { background: none; border: 0; color: var(--link); font: inherit; font-size: 0.74rem;
    cursor: pointer; padding: 0 0 0.25rem; letter-spacing: 0.04em; }
  #hud .c-back:hover { color: var(--gold); }
  /* Levels. Three things hang off a section and they are not the same size of
     act. The number names it. The commentary is the section's other text, so
     it gets a line of its own, the width of the column, carrying the name of
     the work rather than a letter. Taking the text away for good is the last
     act, so the export sits beneath at the smallest weight. Carrying a line
     off in a clipboard is not a control at all — see below. */
  .c-slot:empty { display: none; }
  .c-bar { display: flex; align-items: center; gap: 0.5rem; width: 100%;
    margin: 0.55rem 0 0.32rem; padding: 0.36rem 0.62rem; border: 1px solid var(--line);
    border-radius: 0.55rem; background: var(--panel2); color: var(--muted);
    font-family: inherit; font-size: 0.78rem; letter-spacing: 0.04em; cursor: pointer;
    direction: ltr; text-align: left; }
  .c-bar:hover { border-color: var(--gold-dim); color: var(--shesh); }
  .c-bar[aria-expanded="true"] { background: var(--gold); color: #171105; border-color: var(--gold); }
  .c-bar .c-glyph { font-variant: small-caps; letter-spacing: 0.12em; font-size: 0.7rem;
    border: 1px solid currentColor; border-radius: 0.35rem; padding: 0 0.32rem; opacity: 0.75; }
  .c-bar .c-name { flex: 1 1 auto; }
  .c-bar .c-hint { font-size: 0.66rem; opacity: 0.6; }
  /* Copying is the reader's act, not the page's. There is no button that writes
     to a clipboard here — a button doing that is the site handing text over,
     and text handed over carries obligations. A reader who selects and presses
     copy is doing what a reader does on any page, and the licences are on the
     page: on the card, in the footer, and in the export.
     What the page owes them is a clean selection. The Hebrew and its reading
     live in one block, so selecting a verse used to interleave them word by
     word. So a drag takes one layer, and which one is decided by the word the
     reader pressed to start it — not by a setting, and never permanently:
     press a Hebrew word and the drag takes Hebrew, press a reading and it
     takes readings. Nothing on this page is locked away from a reader who
     reaches for it. Either way what lands is a line rather than a zip of two. */
  body.pick-he .wb .g { user-select: none; -webkit-user-select: none; }
  body.pick-he .wb .w { user-select: text; -webkit-user-select: text; }
  body.pick-en .wb .g { user-select: text; -webkit-user-select: text; }
  body.pick-en .wb .w { user-select: none; -webkit-user-select: none; }
  /* the chrome is not text anyone wants in a copy */
  .seg-row, .c-bar, .xp-row, #nav, header.top nav, #modeRow { user-select: none; -webkit-user-select: none; }
  /* Taking the text away for good. A copy is a convenience; an export is the
     final stop, so it says what it is about to hand over before it hands it
     over, and it obeys the licence of every record it would carry. */
  .xp-row { display: flex; gap: 0.4rem; margin: 0.55rem 0 0.2rem; direction: ltr;
    flex-wrap: wrap; align-items: center; }
  .xp { font-size: 0.68rem; color: var(--muted); border: 1px solid var(--line);
    background: var(--panel2); border-radius: 0.5rem; padding: 0.12rem 0.5rem;
    letter-spacing: 0.04em; cursor: pointer; font-family: inherit; }
  .xp:hover { border-color: var(--gold-dim); color: var(--shesh); }
  .xp.armed { background: var(--gold); color: #171105; border-color: var(--gold); font-weight: bold; }
  .xp.busy { opacity: 0.6; cursor: progress; }
  .xp-note { font-size: 0.66rem; color: var(--faint); direction: ltr; flex: 1 1 100%; margin: 0.1rem 0 0; }
  .xp-note b { color: var(--shesh); font-weight: normal; }
  .xp-note .held { color: var(--amber); }
  .xp-lab { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-inline-end: 0.15rem; }
  #bookExport { max-width: 48rem; margin: 2.2rem auto 0; padding: 0 1.5rem; direction: ltr; }
  #bookExport .xp-lab { display: block; margin-bottom: 0.35rem; }
  #prov a { color: var(--shesh); }

  footer { max-width: 48rem; margin: 0 auto; padding: 1.1rem 1.5rem 2.2rem; font-size: 0.76rem;
    color: var(--faint); border-top: 1px solid var(--line); direction: ltr; text-align: left; }

  @media (max-width: 640px) {
    .he-text { font-size: 1.32rem; line-height: 2.05; }
    header.top h1 { font-size: 1.5rem; } header.top h1 .he-t { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<header class="top">
  <h1 id="workTitle"><span class="he-t" lang="he" dir="rtl"></span><span class="en-t">Zone reader</span></h1>
  <p class="byline" id="byline"></p>
  <p id="meta">Loading the zone…</p>
  <nav id="books"><a href="genesis-book-reader-v4.html">← Genesis reader</a> · <a href="dictionary.html">Dictionary</a> · books: <a href="zone.html?b=genesis" lang="he" dir="rtl">בראשית</a> · <a href="zone.html?b=1kings">I Kings</a> · <a href="zone.html?b=2kings">II Kings</a> · <a href="zone.html?b=orot" lang="he" dir="rtl">אורות</a></nav>
  <div id="modeRow">
    <button type="button" class="mode-btn on" id="modeHe">Hebrew reader</button>
    <button type="button" class="mode-btn" id="modeEn">English reader</button>
    <button type="button" class="mode-btn" id="layerC" hidden></button>
  </div>
</header>
<div id="toc" hidden><h2>Contents</h2><div id="tocBody"></div><div id="secPanel" hidden></div></div>
<div id="nav" hidden>
  <button id="navTop" type="button" title="Back to the top of the page">Top</button>
  <button id="navChapter" type="button" title="Back to the top of this chapter">Chapter</button>
  <button id="navPrev" type="button" aria-label="Previous chapter" title="Previous chapter">&lsaquo;</button>
  <button id="navNext" type="button" aria-label="Next chapter" title="Next chapter">&rsaquo;</button>
</div>
<main id="text"></main>
<div id="hud" hidden></div>
<footer id="prov"></footer>
<script>
(async () => {
  const BOOK = (new URLSearchParams(location.search).get("b") || "orot").replace(/[^a-z0-9-]/g, "");
  const unpack = async (res) =>
    JSON.parse(await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text());
  const licenseName = (posture) => {
    const v = String(posture || "").toLowerCase();
    if (!v) return "License unrecorded";
    if (v.startsWith("cc0")) return "CC0";
    if (/_nc(?:_|$)/u.test(v)) return /_sa(?:_|$)/u.test(v) ? "CC BY-NC-SA" : "CC BY-NC";
    if (v.includes("by_sa") || v.includes("gfdl")) return "CC BY-SA";
    if (v.startsWith("public_domain")) return "Public Domain";
    if (v.startsWith("cc_by") || v.includes("wordnet")) return "CC BY";
    return posture;
  };
  let zone, index;
  try {
    [zone, index] = await Promise.all([
      fetch(`data/zones/${BOOK}.bin`).then(unpack),
      // The index names the store's version, and every shard URL carries it.
      // So this one small file is the only thing that must never be stale:
      // revalidated on each load (a 304 when nothing moved), and everything
      // downstream is then addressed by content rather than by name.
      fetch("data/route-store/index.json", { cache: "no-cache" }).then((r) => r.json()),
    ]);
  } catch {
    document.getElementById("meta").textContent =
      "No book is published on this page yet — no walk has landed. The page takes its name from the zone when one arrives; nothing is shown, and nothing is named, that has not come through the pipeline.";
    return;
  }
  // The book is named in Hebrew where the Y ledger promoted a name for it, and
  // in English only where it did not. The English is a locator, not the title,
  // so it is not dressed up as one — and no Hebrew name is typed in here that
  // did not come through the ledger.
  document.querySelector("#workTitle .he-t").textContent = zone.work_he || "";
  document.querySelector("#workTitle .en-t").textContent = zone.work;
  if (!zone.work_he) {
    document.querySelector("#workTitle .en-t").classList.add("unnamed");
    const y = zone.emitted_from.y_ledger;
    if (y && y.status) document.querySelector("#workTitle .en-t").title =
      `No Hebrew name is carried for this work: ${y.status}`;
  }
  document.title = `${zone.work_he ? `${zone.work_he} · ` : ""}${zone.work} · The Tabernacle`;
  document.getElementById("byline").textContent = zone.byline || "";
  const ac = zone.emitted_from.acquisition, wk = zone.emitted_from.walk, oc = zone.emitted_from.identity_oracle;
  // What this is, in one line. Everything the zone can prove about itself used
  // to print here, because when this page was first written there was nowhere
  // else for a receipt to live. There is now: the card carries the licence of
  // every reading, each section names its own commentary, the export writes
  // the whole record into the file, and the footer has carried the hashes all
  // along. So the proof moves down to join them and stops standing between the
  // reader and the text. Nothing is dropped — the same sentence is one press
  // away, and the footer block is unchanged.
  const receiptsText =
    `${zone.counts.words.toLocaleString()} words · ${zone.counts.sections.toLocaleString()} sections · ` +
    (wk ? (/RESIDENT_SERVE/.test(wk.route || "")
      ? `served id-by-id from the seal-verified terminal reader artifacts (${wk.ids_walked.toLocaleString()} ids, every one FOUND_EXACT; the installed sealed reader re-answered ${wk.sealed_oracle.report.sampled} sampled ids ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact) · rights ride per occurrence from the chain · `
      : `walked word-by-word through the installed sealed terminal reader (${wk.ids_walked.toLocaleString()} ids, every one FOUND_EXACT) · rights ride per occurrence from the chain · `) : `Hebrew text: ${ac.hebrew_version} via Sefaria, license ${ac.hebrew_license_seen} (seen live on every payload) · `) +
    `${zone.counts.verified_units} of ${zone.counts.sections} sections verified word-for-word in count against the sealed corpus allocation` +
    `${zone.counts.drifted_units ? `; ${zone.counts.drifted_units} drift from it and are marked` : ""} · ` +
    `${zone.counts.glossed_words ? zone.counts.glossed_words.toLocaleString() + " words carry their oldest-sourced catalog route as an English gloss (exact spellings only — unmatched forms stay bare) · " : ""}` +
    `${zone.counts.w_regions_with_a_component_system
      ? `${zone.counts.occurrences_holding_more_than_one_w
          ? `${zone.counts.occurrences_holding_more_than_one_w.toLocaleString()} of those occurrences are written with a maqaf and hold two words each, ${zone.counts.w_regions.toLocaleString()} words in all; `
          : ""}` +
        `${zone.counts.w_regions_with_a_component_system.toLocaleString()} words carry a component system, so every complete division of a word and every block inside one opens on its own · `
      : ""}` +
    `tap any word for all routes, sources, and licenses`;
  {
    const meta = document.getElementById("meta");
    meta.replaceChildren();
    meta.append(`${zone.counts.words.toLocaleString()} words in ${zone.counts.sections.toLocaleString()} ${zone.counts.sections === 1 ? "section" : "sections"}, served from the sealed chain. `);
    const more = document.createElement("button");
    more.type = "button"; more.className = "receipts-btn";
    more.textContent = "receipts";
    more.setAttribute("aria-expanded", "false");
    const full = document.createElement("span");
    full.className = "receipts-full"; full.hidden = true; full.textContent = receiptsText;
    more.addEventListener("click", () => {
      const on = full.hidden;
      full.hidden = !on;
      more.setAttribute("aria-expanded", String(on));
      more.textContent = on ? "hide receipts" : "receipts";
    });
    meta.append(more, full);
  }
  document.getElementById("prov").textContent =
    `${zone.work_receipts && zone.work_receipts.b_n ? `${zone.work_receipts.b_n} · ` : ""}` +
    `${zone.rule_id} · route: ${zone.route} · identity oracle ${oc.bridge_sha256.slice(0, 16)}… ` +
    `(${oc.sealed_units.toLocaleString()} units, C0 ${oc.first_c0_numeric_id.toLocaleString()}–${oc.last_c0_numeric_id.toLocaleString()}) · ` +
    (wk ? `${/RESIDENT_SERVE/.test(wk.route || "") ? `serve rule ${wk.walker_rule}; sealed-reader oracle ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact; ` : `walk: `}module ${wk.module.sha256.slice(0, 12)}…, pointer ${wk.pointer.sha256.slice(0, 12)}… · ${zone.emitted_from.license_receipts.per_occurrence} · ` : `payload sha ${ac.payload_sha256_transferred.slice(0, 16)}… · ${zone.emitted_from.license_receipts.work_activation} · `) +
    `${zone.emitted_from.gloss_layer ? `glosses: ${zone.emitted_from.gloss_layer.rule} (table sha ${zone.emitted_from.gloss_layer.gloss_table_sha256.slice(0, 12)}…; ${zone.emitted_from.gloss_layer.attribution}) · ` : ""}` +
    `${zone.emitted_from.span_layer && zone.emitted_from.span_layer.rule
      ? `components: ${zone.emitted_from.span_layer.rule} from ${zone.emitted_from.span_layer.source.path} (sha ${zone.emitted_from.span_layer.source.sha256.slice(0, 12)}…), ` +
        `${zone.emitted_from.span_layer.forms_with_a_component_system.toLocaleString()} forms, ` +
        `${zone.emitted_from.span_layer.derived_cells.toLocaleString()} blocks and ${zone.emitted_from.span_layer.derived_complete_covers.toLocaleString()} complete divisions derived from the component lists alone · `
      : ""}` +
    `${zone.emitted_from.y_ledger?.consequence || zone.emitted_from.y_ledger?.status || ""}${zone.emitted_from.y_ledger ? " · " : ""}` +
    (zone.emitted_from.sealed_chain_status
      ? `the installed terminal reader does not yet carry this span (partial-rebuild gap); this page runs the acquisition route until a sealed generation includes the book.`
      : (wk && /RESIDENT_SERVE/.test(wk.route || "")
        ? `this zone was served from the sealed chain's own artifacts, seal-verified once, with the installed terminal reader re-answering sampled ids as oracle — the pipeline route, end to end.`
        : `this zone came through the installed terminal reader itself — the pipeline route, end to end.`));
  // explicit license links, from the zone's own receipts
  if (zone.emitted_from.license_links && zone.emitted_from.license_links.length) {
    const provEl = document.getElementById("prov");
    const linkRow = document.createElement("p");
    zone.emitted_from.license_links.forEach((l, i) => {
      if (i) linkRow.append(" · ");
      const a = document.createElement("a"); a.href = l.url; a.target = "_blank"; a.rel = "noreferrer";
      a.textContent = l.label; linkRow.append(a);
    });
    provEl.append(linkRow);
  }

  // Plain English for the two levels of the coordinate — "chapter · verse"
  // for a book of the Tanakh, "section · paragraph" for a work numbered that
  // way. These name the structure; they translate nothing.
  const COORD = zone.emitted_from.coordinate_labels || { major: "section", minor: "paragraph" };
  const MAJOR = COORD.major, MINOR = COORD.minor;
  const MAJOR_C = MAJOR.charAt(0).toUpperCase() + MAJOR.slice(1);

  const hud = document.getElementById("hud");
  // The reader's display law: route texts pack morpheme spans with "/"; the
  // page never shows the raw packing — spans join with " + ", exactly the
  // reader's own cell join. One route on display at a time, everywhere.
  const spanJoin = (t) => String(t).split("/").map((x) => x.trim()).filter(Boolean).join(" + ");
  const shardCache = new Map();
  // A shard is addressed by which store it belongs to. Without this a reader
  // whose browser already holds yesterday's shard keeps being answered from it
  // while the page prints today's reading — the two disagreeing on screen.
  const storeVersion = index.store_version || "";
  const routesFor = async (key) => {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(key));
    const shard = new Uint8Array(digest)[0].toString(16).padStart(2, "0");
    if (!shardCache.has(shard)) {
      const url = `data/route-store/shards/${shard}.bin${storeVersion ? `?v=${storeVersion}` : ""}`;
      shardCache.set(shard, fetch(url).then(unpack).catch(() => null));
    }
    const data = await shardCache.get(shard);
    return data ? data[key] : null;
  };
  let activeEl = null;
  // release=false means the card is being rebuilt for another word, not shut.
  // Only shutting it ends the reader's hold on where it sits — otherwise a
  // card parked out of the way would jump back the moment the next word was
  // tapped, which is the whole thing being fixed.
  const closeHud = (release = true) => {
    hud.hidden = true; hud.replaceChildren();
    activeEl = null; hudAnchor = null;
    if (release) { hudMoved = false; hud.classList.remove("moved"); }
    // a card may have been opened from a whole block or from one W inside it,
    // so both marks are cleared rather than the one we happen to remember
    document.querySelectorAll(".wb.active").forEach((w) => w.classList.remove("active"));
    document.querySelectorAll(".wr.on").forEach((r) => r.classList.remove("on"));
  };
  // Anchor the HUD to whatever was tapped. Three surfaces open it now — a
  // word, a commentary word, and a section's commentary handle — and a
  // commentary card is tall, so "just below" is not always on screen.
  // Below if it fits, above if that fits, clamped into view otherwise; the
  // HUD is never left hanging off the bottom edge with a strip showing.
  let hudAnchor = null;
  // Once a card is open it holds still. Anchoring is for opening; while the
  // reader is working inside a card — switching reading, opening the records
  // drawer — the card is only pulled back into view if it has grown past the
  // edge. Re-anchoring on every internal change is what made it feel shifty:
  // the card was being placed for a height it no longer had.
  // What the reader has settled on for one occurrence: which division of the
  // form they are reading it under, and which reading they chose for each
  // block of it. Both used to live inside the open and died with the card.
  const pickedByWord = new WeakMap();   // occurrence -> { cells: Map(surface -> reading), cut: key }
  const memoryOf = (wbEl) => {
    let m = pickedByWord.get(wbEl);
    if (!m) { m = { cells: new Map(), cut: null }; pickedByWord.set(wbEl, m); }
    return m;
  };
  const cutKey = (c) => c.map((x) => x.surface).join("+");

  // ---- the exporter ---------------------------------------------------
  // An export is the final stop: the thing that leaves the page and is read
  // somewhere else, by someone who will never see this reader. So it carries
  // the licence of every record it stands on, and a licence that forbids
  // redistribution stops it — per reading, not per file.
  //
  // The Hebrew is the sealed text of the work and rides on the work's own
  // licence. A refused reading never removes a Hebrew word; it removes the
  // English beside it, and says so where it stood.
  const LICENCE_RULES = {
    obligations: {
      sa: "Share-alike: anything derived from this must be shared under the same licence.",
      nc: "Noncommercial use only.",
      by: "Attribution required.",
    },
  };
  const postureOf = (mId) => {
    const m = index.m_sources[mId];
    return m ? String(m.licensePosture || "") : "";
  };
  // Refusals are decided here and nowhere else. A posture that forbids
  // derivatives forbids an export, because an export is one.
  const exportPosture = (posture) => {
    const p = String(posture || "");
    if (!p) return { ok: false, why: "the record carries no licence posture" };
    if (/(^|[^a-z])nd([^a-z]|$)/i.test(p) || /noderiv/i.test(p))
      return { ok: false, why: `NoDerivatives (${p}) — an export is a redistributed derivative` };
    const ob = [];
    if (/(^|_)by(_|$)/.test(p) || /cc_by/.test(p)) ob.push(LICENCE_RULES.obligations.by);
    if (/(^|_)sa(_|$)/.test(p) || /share.?alike/i.test(p)) ob.push(LICENCE_RULES.obligations.sa);
    if (/(^|_)nc(_|$)/.test(p) || /noncommercial/i.test(p)) ob.push(LICENCE_RULES.obligations.nc);
    return { ok: true, why: null, obligations: ob };
  };

  // What reading is standing under a word right now, and which record it is
  // standing on. The zone bakes the reading as text with no M attached, so the
  // record is recovered by asking the store what it attests for that form and
  // matching the text the page is showing. A reading nobody can trace is not
  // exported — it is named as untraceable, which is the honest refusal.
  const attributionFor = async (surface, shownText) => {
    const pool = await poolFor(surface);
    if (!pool || !pool.length) return { ok: false, why: "no record in the catalog for this form" };
    const hit = pool.find((r) => spanJoin(r.text) === shownText) ||
                pool.find((r) => r.text === shownText);
    if (!hit) return { ok: false, why: "the reading on the page does not match any record in the store" };
    const mId = hit.records[0][3];
    const m = index.m_sources[mId] || {};
    const post = exportPosture(m.licensePosture);
    // the record's own text, not the page's rendering of it: the page joins a
    // "/"-packed span with " + " for reading, and a file that leaves the
    // building must carry what the source wrote, not how we drew it
    return post.ok
      ? { ok: true, text: hit.text, label: m.label, posture: m.licensePosture,
          pointer: m.licensePointer, year: m.sourceYear, obligations: post.obligations }
      : { ok: false, why: post.why, label: m.label };
  };

  const EXPORT_RULE = "export-rule-v1-licence-per-reading-hebrew-on-the-work";

  /** Gather one section. Returns everything the writer and the confirm need. */
  const gatherSection = async (sec, el) => {
    const words = [];
    const wbs = [...el.querySelectorAll(".he-text .wb")];
    for (let i = 0; i < sec.words.length; i += 1) {
      const w = sec.words[i];
      const wb = wbs[i];
      const shown = wb ? (wb.querySelector(".g")?.textContent || "").trim() : "";
      const rec = { he: w.s, en: null, held: null, source: null };
      if (w.k && shown && shown !== "—") {
        const a = await attributionFor(w.k, shown);
        if (a.ok) { rec.en = a.text; rec.source = a; }
        else { rec.held = a.why; }
      } else if (!w.k) rec.held = "held by the ledger; no reading is offered";
      words.push(rec);
    }
    const sources = new Map();
    const obligations = new Set();
    let held = 0;
    for (const w of words) {
      if (w.held) { held += 1; continue; }
      const s = w.source;
      if (!sources.has(s.label)) sources.set(s.label, s);
      (s.obligations || []).forEach((o) => obligations.add(o));
    }
    return { sec, words, sources: [...sources.values()], obligations: [...obligations], held };
  };

  // The licence of the work itself — the Hebrew. This is the largest thing any
  // export carries and it is not public domain: 1 Kings' own rights record
  // reads CC-BY-NC, ALLOW_WITH_OBLIGATIONS. An earlier build printed the work
  // RECEIPT here, which is a B/N id and a unit count, and called that the
  // licence. It was not. A receipt says which rows were served; it says
  // nothing about what may be done with them.
  const workRights = () => {
    const wr = zone.work_receipts || {};
    const receipt = typeof wr === "string" ? wr : (wr.b_n || "");
    const rec = (zone.emitted_from && zone.emitted_from.license_receipts) || {};
    const per = String(rec.per_occurrence || "");
    // the rights record leads with the family and the posture
    const m = per.match(/([A-Z0-9][A-Z0-9._-]*(?:-[A-Z0-9._-]+)*)\s*·\s*([A-Z_]+)\s*·\s*([A-Z_]+)/);
    const family = m ? m[1] : null;
    const posture = m ? m[3] : null;
    const links = (zone.emitted_from && zone.emitted_from.license_links) || [];
    const obligations = [];
    if (family) {
      if (/BY/.test(family)) obligations.push("Attribution required.");
      if (/NC/.test(family)) obligations.push("Noncommercial use only — this text may not be used commercially.");
      if (/SA/.test(family)) obligations.push("Share-alike: anything derived from this must be shared under the same licence.");
      if (/ND/.test(family)) obligations.push("NoDerivatives.");
    }
    if (/ALLOW_WITH_OBLIGATIONS/.test(posture || "")) {
      if (!obligations.length) obligations.push("The chain records this text as allowed with obligations.");
    }
    return { receipt, family, posture, links, obligations, attribution: rec.attribution || zone.byline || "", raw: per };
  };

  /** The file itself. One shape for all three kinds; the kind decides columns. */
  const renderExport = (bundles, kind, title) => {
    const L = [];
    L.push(`# ${title}`);
    L.push("");
    const wr = workRights();
    L.push(`${zone.work}${zone.work_he ? ` · ${zone.work_he}` : ""}`);
    if (zone.byline) L.push(zone.byline);
    L.push("");
    L.push(`Hebrew text · licence: ${wr.family || "NOT ESTABLISHED"}${wr.posture ? ` · ${wr.posture}` : ""}`);
    if (wr.attribution) L.push(`Hebrew text · attribution: ${wr.attribution}`);
    wr.links.forEach((l) => L.push(`Hebrew text · ${l.label}${l.url ? ` — ${l.url}` : ""}`));
    L.push(`Work receipt: ${wr.receipt}`);
    L.push(`Store: ${index.rule_id} · ${index.store_version}`);
    if (index.reading_rule) L.push(`Reading: ${index.reading_rule}`);
    L.push(`Export: ${EXPORT_RULE}`);
    L.push("");
    const allSources = new Map(); const allObl = new Set(); let held = 0;
    for (const b of bundles) {
      L.push(`## ${b.sec.label || ""}`);
      L.push("");
      if (kind !== "en") L.push(b.words.map((w) => w.he).join(" "));
      if (kind === "both") L.push("");
      if (kind !== "he") {
        const line = b.words.map((w) => (w.held ? "[reading withheld]" : w.en)).join(" ");
        L.push(line);
      }
      L.push("");
      for (const w of b.words) if (w.held) held += 1;
      b.sources.forEach((s) => allSources.set(s.label, s));
      b.obligations.forEach((o) => allObl.add(o));
    }
    L.push("---");
    L.push("");
    L.push("## Sources");
    L.push("");
    if (kind === "he") {
      L.push(`The Hebrew is the sealed text of ${zone.work}, carried on the work's own receipt above.`);
    } else if (!allSources.size) {
      L.push("No reading in this export could be traced to a record.");
    } else {
      for (const s of [...allSources.values()].sort((a, b) => String(a.label).localeCompare(String(b.label)))) {
        L.push(`- ${s.label}${s.year ? ` · ${s.year}` : ""} · ${s.posture}${s.pointer ? ` · ${s.pointer}` : ""}`);
      }
    }
    wr.obligations.forEach((o) => allObl.add(`The Hebrew text: ${o}`));
    if (allObl.size) {
      L.push("");
      L.push("## Obligations carried by this file");
      L.push("");
      [...allObl].forEach((o) => L.push(`- ${o}`));
    }
    if (held && kind !== "he") {
      L.push("");
      L.push("## Withheld");
      L.push("");
      L.push(`${held} reading${held === 1 ? " was" : "s were"} not exported. Each is marked [reading withheld] where it stood. A reading is withheld when its record carries a licence that does not permit redistribution, when it carries no licence at all, or when the reading on the page could not be matched to a record. The Hebrew is never withheld: it rides on the work's own licence, not on any reading's.`);
    }
    L.push("");
    return L.join("\n");
  };

  const saveFile = (name, text) => {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  const KINDS = { he: "Hebrew", en: "English", both: "Hebrew + English" };

  /**
   * One export control. It arms rather than fires: the first press gathers the
   * records and says exactly what is about to leave, the second press writes
   * it. Nothing reaches the reader's disk from a single tap.
   */
  const exportButton = (kind, label, note, gather, filename) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "xp"; b.textContent = label;
    b.setAttribute("aria-label", `Export ${KINDS[kind]}`);
    let armed = null;
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (armed) {
        const wr = workRights();
        if (!wr.family) {
          note.textContent = "Refused: this work's own licence is not established in the zone's rights record, so nothing may leave.";
          b.classList.remove("armed"); b.textContent = label; armed = null;
          return;
        }
        saveFile(filename(), renderExport(armed.bundles, kind, armed.title));
        b.classList.remove("armed"); b.textContent = label;
        note.textContent = "Saved."; armed = null;
        return;
      }
      b.classList.add("busy"); note.textContent = "Reading the records this stands on…";
      let g;
      try { g = await gather(); }
      catch (err) { b.classList.remove("busy"); note.textContent = `Could not read the records: ${err.message}`; return; }
      b.classList.remove("busy");
      const words = g.bundles.reduce((a, x) => a + x.words.length, 0);
      const srcs = new Set(); const obl = new Set(); let held = 0;
      g.bundles.forEach((x) => { x.sources.forEach((s) => srcs.add(s.label)); x.obligations.forEach((o) => obl.add(o)); held += x.held; });
      note.replaceChildren();
      const say = (t, cls) => { const sp = document.createElement("span"); if (cls) sp.className = cls; sp.textContent = t; note.append(sp); };
      const wr = workRights();
      wr.obligations.forEach((o) => obl.add(`The Hebrew text: ${o}`));
      if (kind === "he") {
        say(`${words} words of Hebrew · ${wr.family || "licence NOT ESTABLISHED"}`);
        if (wr.obligations.length) { say(" · "); say(wr.obligations.join(" ")); }
        say(". ");
      } else {
        say(`${words} words · ${srcs.size} source${srcs.size === 1 ? "" : "s"}`);
        if (obl.size) { say(" · "); say([...obl].join(" ").replace(/\.$/, "")); }
        if (held) { say(" · "); say(`${held} reading${held === 1 ? "" : "s"} withheld on licence`, "held"); }
        say(". ");
      }
      const strong = document.createElement("b"); strong.textContent = "Press again to save.";
      note.append(strong);
      b.classList.add("armed"); b.textContent = "save";
      armed = g;
      setTimeout(() => { if (armed) { armed = null; b.classList.remove("armed"); b.textContent = label; note.textContent = ""; } }, 20000);
    });
    return b;
  };

  const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  let hudMoved = false;
  // Two rules, and which one applies depends on who moved the card.
  //
  // A card the page placed is kept whole on screen: the reader did not ask for
  // any of it to be off, so none of it is.
  //
  // A card the reader dragged is theirs. They may park it half off the side or
  // hanging below the fold — that is a legitimate thing to want from a card
  // that sits over the text you are reading. The only thing held back is the
  // handle: the head must stay reachable, or the card could be pushed
  // somewhere it can never be pulled back from.
  const GRAB = 56;
  const placeInBounds = () => {
    if (hud.hidden) return;
    const h = hud.offsetHeight || 0, w = hud.offsetWidth || 0, pad = 8;
    const top = parseFloat(hud.style.top) || 0, left = parseFloat(hud.style.left) || 0;
    if (hudMoved) {
      // free to hang off the left, the right and the bottom; the head stays on
      hud.style.top = `${Math.max(pad, Math.min(top, window.innerHeight - GRAB))}px`;
      hud.style.left = `${Math.max(GRAB - w, Math.min(left, window.innerWidth - GRAB))}px`;
      return;
    }
    hud.style.top = `${Math.max(pad, Math.min(top, window.innerHeight - h - pad))}px`;
    hud.style.left = `${Math.max(pad, Math.min(left, window.innerWidth - w - pad))}px`;
  };
  const clampHud = placeInBounds;
  const placeHud = (el) => {
    if (el) hudAnchor = el;
    if (!hudAnchor) return;
    hud.hidden = false;
    // A card the reader has taken hold of belongs to the reader. It is not
    // moved back to a word again, only kept on screen.
    if (hudMoved) { clampHud(); return; }
    const rect = hudAnchor.getBoundingClientRect();
    const h = hud.offsetHeight || 0, w = hud.offsetWidth || 0;
    const pad = 8;
    let top;
    if (rect.bottom + pad + h <= window.innerHeight - pad) top = rect.bottom + pad;
    else if (rect.top - pad - h >= pad) top = rect.top - pad - h;
    else top = Math.max(pad, window.innerHeight - h - pad);
    // A card grows when the reader switches reading or opens the records
    // drawer, and the placement above was computed for the height it had a
    // moment ago. Clamp unconditionally so no part of it is ever unreachable.
    top = Math.max(pad, Math.min(top, window.innerHeight - h - pad));
    hud.style.top = `${top}px`;
    hud.style.left = `${Math.max(pad, Math.min(window.innerWidth - w - pad, rect.left - 100))}px`;
  };
  // Moving the card. Pointer events so a finger and a mouse take the same
  // path; the close button is excluded so the reader can still hit it.
  let drag = null;
  hud.addEventListener("pointerdown", (e) => {
    justDragged = false;
    const head = e.target.closest(".head");
    if (!head || !hud.contains(head) || e.target.closest("button")) return;
    drag = { dx: e.clientX - (parseFloat(hud.style.left) || 0),
             dy: e.clientY - (parseFloat(hud.style.top) || 0) };
    head.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  hud.addEventListener("pointermove", (e) => {
    if (!drag) return;
    hud.style.left = `${e.clientX - drag.dx}px`;
    hud.style.top = `${e.clientY - drag.dy}px`;
  });
  // A drag that ends over the page is still a drag, not a tap on the page. The
  // outside-click handler would otherwise close the card the reader was in the
  // middle of moving — which is exactly what happens when you park it far
  // enough that you let go over the text.
  let justDragged = false;
  const endDrag = () => {
    if (!drag) return;
    drag = null; justDragged = true;
    hudMoved = true; hud.classList.add("moved"); clampHud();
  };
  hud.addEventListener("pointerup", endDrag);
  hud.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", clampHud);
  const backButton = (back) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "c-back";
    b.textContent = `‹ back to ${back.label}`;
    b.addEventListener("click", (e) => { e.stopPropagation(); back.open(); });
    return b;
  };

  // ---- the component system -------------------------------------------
  // A W's COMPspan is the attested list of its components. Everything the
  // card offers below follows from that list by arithmetic and asks the
  // catalog nothing: n components make n(n+1)/2 contiguous cells and
  // 2^(n-1) complete covers — every way of dividing the form so that each
  // component is used exactly once, and none is used twice.
  const cutsOf = (comps) => {
    const n = comps.length, out = [];
    for (let mask = 0; mask < 1 << (n - 1); mask += 1) {
      const parts = []; let start = 0;
      const cut = (from, to) => ({ surface: comps.slice(from, to + 1).join(""), from, to });
      for (let i = 0; i < n - 1; i += 1)
        if (mask & (1 << i)) { parts.push(cut(start, i)); start = i + 1; }
      parts.push(cut(start, n - 1));
      out.push(parts);
    }
    // coarse first, so the whole form leads and the finest cut is last
    return out.sort((a, b) => a.length - b.length);
  };
  const joinCut = (cut) => cut.map((c) => c.surface).join(" + ");
  // What the boundary is, and where it came from. Provenance on the cut —
  // not a verdict on any reading that the cut makes reachable.
  const SPLIT_PROVENANCE = {
    stepbible_tahot_explicit_source_alignment_v1: "component boundaries aligned to an explicit source",
    formulaic_clitic_candidate_v1: "component boundaries proposed by the formulaic clitic pass",
    whole_token_only_v1: "recorded as one component",
  };
  const spanOf = (bin, k) => {
    const row = bin && bin.spans ? bin.spans[k] : null;
    if (!row) return null;
    const [surfaces, roleIdx, ruleIdx, confIdx] = row;
    return {
      comps: surfaces,
      roles: roleIdx.map((i) => (bin.span_roles || [])[i]),
      rule: (bin.span_rules || [])[ruleIdx],
      conf: (bin.span_conf || [])[confIdx],
    };
  };

  // The readings for one cell surface, as the reader's law has them
  // (rule v3 · 2026-08-10): a route text packs senses with ";" and each sense
  // is its own pill; pills dedupe by text, merging the oldest year and lowest
  // rank; oldest source leads, post-1940 and unyeared sources last.
  const poolFor = async (surface) => {
    const routes = await routesFor(surface);
    if (!routes) return null;
    const groups = new Map();
    routes.forEach((row) => {
      const [rank, routeText, , mId, year] = row;
      if (!index.m_sources[mId]) return;
      const y = Number.parseInt(year, 10);
      const yr = Number.isInteger(y) ? y : Infinity;
      String(routeText || "").split(";").map((s) => s.trim()).filter(Boolean).forEach((sense) => {
        const key = sense.toLowerCase();
        const g = groups.get(key);
        if (!g) groups.set(key, { text: sense, year: yr, ledger: Number(rank), records: [row] });
        else {
          g.year = Math.min(g.year, yr); g.ledger = Math.min(g.ledger, Number(rank));
          if (!g.records.includes(row)) g.records.push(row);
        }
      });
    });
    const tier = (r) => (Number.isFinite(r.year) && r.year <= 1940 ? 0 : 1);
    return [...groups.values()].sort((a, b) => tier(a) - tier(b) || a.year - b.year || a.ledger - b.ledger);
  };

  /**
   * One card. The rows read top to bottom as one sentence: this is the form,
   * this is how it divides, this is the block you have open, this is what the
   * catalog attests for that block, and this is who attested it.
   *
   * The card opens on the whole W — one cell, its first reading — because a
   * complete word is what a reader came for. Every finer cut is one tap away
   * and none of them is hidden.
   */
  const openHud = async (el, region, unitId, wordPos, opts = {}) => {
    closeHud(false);
    activeEl = el;
    if (!opts.mark) el.classList.add("active");
    const bin = opts.bin || zone;
    const word = opts.word || region;
    const regionIndex = opts.regionIndex || 0;
    const regions = word.w || [region];
    if (opts.mark) opts.mark();
    placeHud(el);

    const head = document.createElement("div"); head.className = "head";
    const b = document.createElement("b"); b.lang = "he"; b.dir = "rtl";
    // the whole occurrence in the header, with the W you opened marked, so a
    // maqaf'd word never loses the half you are not reading
    if (regions.length > 1) {
      regions.forEach((r, i) => {
        if (i) b.append(Object.assign(document.createElement("span"), { className: "mq", textContent: "־" }));
        const seg = document.createElement("span");
        seg.textContent = r.s;
        if (i !== regionIndex) seg.style.color = "var(--faint)";
        b.append(seg);
      });
    } else b.textContent = word.s;
    const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", "Close");
    x.addEventListener("click", closeHud);
    head.append(b, x);
    const status = document.createElement("p"); status.textContent = "Fetching one shard…";
    if (opts.back) hud.replaceChildren(backButton(opts.back), head, status);
    else hud.replaceChildren(head, status);
    placeHud();

    const cm = opts.back ? null : commentaryFor(unitId, wordPos);
    const span = spanOf(bin, region.k);
    const comps = span ? span.comps : [region.k];
    const covers = cutsOf(comps);

    // What the reader chose, kept where they chose it. This lived inside the
    // open, so closing the card threw it away and the next open painted the
    // catalog's default back over the reader's reading. Remembering the
    // readings alone was not enough: the card also reopened on the whole form,
    // and a reading chosen for a block of a finer division was painted over by
    // the whole form's own. The division is remembered too.
    const wbEl = (el.closest && el.closest(".wb")) || el;
    const mem = memoryOf(wbEl);
    const picked = mem.cells;
    let cover = covers[0];
    if (mem.cut) {
      const found = covers.find((c) => cutKey(c) === mem.cut);
      if (found) cover = found;
    }
    let cellIdx = 0;
    const selectedRecordRef = { m: null };
    // A route object is rebuilt from the shard every time the card opens, so
    // remembering the object itself remembers nothing — the new pool holds
    // different objects carrying the same reading. The choice is held by what
    // identifies a route in the record instead: its text and the M behind it.
    const routeKey = (r) => spanJoin(r.text) + " | " +
      (r.records && r.records[0] ? r.records[0][3] : "no m");
    const cache = new Map();           // cell surface -> pool (or null)

    // The gloss under the word follows the whole card: every cell of the cut
    // you have open, joined the way the reader joins a span. A cell the
    // catalog does not attest reads as a dash rather than borrowing its
    // neighbour's word.
    const glossEl = el.closest(".wb") ? el.closest(".wb").querySelector(".g") : null;
    const glossParts = opts.glossParts || null;
    const textOfCell = (surface) => {
      const p = picked.get(surface);
      if (p) return spanJoin(p.text);
      const g = bin.gloss ? bin.gloss[surface] : null;
      return g ? spanJoin(g) : "—";
    };
    const paintGloss = () => {
      if (!glossEl) return;
      // The page's own reading is printed whole — that is why the ellipsis came
      // off. But a reading the reader chooses can be longer than the one the
      // page painted, and letting the line grow would move every Hebrew word
      // below it, which is the one thing this page never does. So the moment
      // before a word's reading is first changed, its box is fixed at the
      // height it was painted at. Nothing moves; a chosen reading longer than
      // the painted one is held in the card, which never clips, and on the
      // line's own title.
      if (!glossEl.style.height) {
        const h = glossEl.getBoundingClientRect().height;
        if (h) glossEl.style.height = `${h}px`;
      }
      const mine = cover.map((c) => textOfCell(c.surface)).join(" + ");
      const line = glossParts ? (glossParts[regionIndex] = mine, glossParts.join(" + ")) : mine;
      glossEl.textContent = line; glossEl.title = line; glossEl.classList.remove("bare");
      // record what this reading stands on, so a copy can name it
      const wbEl2 = glossEl.closest(".wb");
      if (wbEl2 && selectedRecordRef.m) {
        wbEl2.dataset.source = selectedRecordRef.m.label || "";
        wbEl2.dataset.licence = licenseName(selectedRecordRef.m.licensePosture) || "";
      }
    };

    const cutRow = document.createElement("div");
    const cellRow = document.createElement("div");
    const readRow = document.createElement("div");
    const prov = document.createElement("p"); prov.className = "prov";
    // The divisions, the blocks and the readings share one scrolling region;
    // the record sits below it and is never scrolled away. A form with two
    // hundred readings used to push its D and M off the bottom of the card,
    // and the reader's own law is that a selected reading always shows at
    // least one whole D with its M. Pinning it is how that stays true however
    // many readings the catalog attests — no reading is capped to make room.
    const rows = document.createElement("div"); rows.className = "rows";
    rows.append(cutRow, cellRow, readRow);
    const dSlot = document.createElement("div"); dSlot.className = "d-slot";
    hud.replaceChildren(...(opts.back ? [backButton(opts.back)] : []), head, rows, dSlot, prov);

    // --- row 1 · how the form divides ---------------------------------
    const renderCuts = () => {
      cutRow.replaceChildren();
      if (covers.length < 2) return;
      const label = document.createElement("p"); label.className = "r-label";
      label.textContent = `Complete divisions · ${covers.length}`;
      const pills = document.createElement("div"); pills.className = "s-pills";
      covers.forEach((c) => {
        const btn = document.createElement("button"); btn.type = "button";
        btn.lang = "he"; btn.dir = "rtl"; btn.textContent = joinCut(c);
        btn.setAttribute("aria-pressed", String(c === cover));
        btn.addEventListener("click", () => {
          cover = c; mem.cut = cutKey(c); cellIdx = 0;
          renderCuts(); renderCells(); renderReadings(); paintGloss();
        });
        pills.append(btn);
      });
      cutRow.append(label, pills);
    };

    // --- row 2 · which block of it is open -----------------------------
    const renderCells = () => {
      cellRow.replaceChildren();
      if (cover.length < 2) return;
      const label = document.createElement("p"); label.className = "r-label"; label.textContent = "Block";
      // the blocks sit in the word's own direction, so the row reads as the
      // form does and a reader watches the word come back together
      const pills = document.createElement("div"); pills.className = "s-pills"; pills.dir = "rtl";
      cover.forEach((c, i) => {
        const btn = document.createElement("button"); btn.type = "button";
        btn.lang = "he"; btn.dir = "rtl"; btn.textContent = c.surface;
        if (span) {
          const roles = [...new Set(span.roles.slice(c.from, c.to + 1))].join(", ").replace(/_/gu, " ");
          if (roles) btn.title = roles;
        }
        btn.setAttribute("aria-pressed", String(i === cellIdx));
        btn.addEventListener("click", () => { cellIdx = i; renderCells(); renderReadings(); });
        pills.append(btn);
      });
      cellRow.append(label, pills);
    };

    // --- row 3 · what the catalog attests for that block ---------------
    const renderReadings = async () => {
      const surface = cover[cellIdx].surface;
      readRow.replaceChildren();
      const label = document.createElement("p"); label.className = "r-label";
      label.textContent = cover.length > 1 ? `Exact selectable routes · ${surface}` : "Exact selectable routes";
      const wait = document.createElement("p"); wait.textContent = "Fetching one shard…";
      readRow.append(label, wait);
      clampHud();
      if (!cache.has(surface)) cache.set(surface, await poolFor(surface));
      if (surface !== cover[cellIdx].surface) return;    // the reader moved on
      const pool = cache.get(surface);
      readRow.replaceChildren(label);
      if (!pool || !pool.length) {
        const p = document.createElement("p");
        p.textContent = pool ? "No displayable route in the catalog for this form." : "No exact route in the catalog for this form.";
        readRow.append(p); clampHud(); return;
      }
      const remembered = picked.get(surface);
      let selected = (remembered && pool.find((r) => routeKey(r) === remembered.key)) || pool[0];
      const pills = document.createElement("div"); pills.className = "r-pills";
      const dCard = document.createElement("div"); dCard.className = "d-card";
      // A selected reading always shows at least one whole D with its M.
      //
      // R debundles where the rest of the chain bundles: one route stands on
      // one definition record, and ten million more would be welcome but are
      // not needed. So the record that carries it is not optional furniture —
      // it is what makes the reading a reading, and it prints in full even
      // when it reads the same as the pill, because the pill is a chooser and
      // may be clipped while the record may not.
      //
      // Identical records from several sources print once, with every source
      // that carries them beneath.
      const renderDCard = () => {
        dCard.replaceChildren();
        // A reading that is a piece cut out of the record beneath it says so.
        // The provider wrote one sentence; this is part of that sentence, not a
        // second thing the provider said, and attributing an arrangement to a
        // source that did not arrange it that way is only honest if the
        // arrangement is disclosed. Whether a cut may be shown at all is the
        // provider's licence to decide, and the store has already decided it —
        // a licence that forbids derivatives never reaches this card.
        if (selected.records.some((r) => r[5] === 1)) {
          const cut = document.createElement("p"); cut.className = "d-cut";
          cut.textContent = "This reading is a piece cut out of the record below, not the record's own sentence.";
          dCard.append(cut);
        }
        const recs = [...selected.records].sort((a, c) => {
          const ya = Number.parseInt(a[4], 10), yc = Number.parseInt(c[4], 10);
          return (Number.isInteger(ya) ? ya : 9e9) - (Number.isInteger(yc) ? yc : 9e9);
        });
        const byText = new Map();
        recs.forEach((row) => {
          const text = row[2] || row[1] || "";
          if (!byText.has(text)) byText.set(text, []);
          byText.get(text).push(row);
        });
        // the record as the source packs it: senses divided by ";", cells by
        // "/" — cells join the way they join everywhere else, and the sense
        // the reader picked is lit where it sits inside the record
        const dText = (text) => {
          const d = document.createElement("p"); d.className = "d-text"; d.dir = "auto";
          String(text).split(";").map((x) => x.trim()).filter(Boolean).forEach((sense, i) => {
            if (i) d.append(Object.assign(document.createElement("span"), { className: "d-sep", textContent: " · " }));
            const s = document.createElement("span");
            s.className = sense.toLowerCase() === String(selected.text).toLowerCase() ? "d-sense on" : "d-sense";
            s.textContent = spanJoin(sense);
            d.append(s);
          });
          if (!d.childNodes.length) d.textContent = spanJoin(text);
          return d;
        };
        const mLine = ([, , , mId, year]) => {
          const m = index.m_sources[mId];
          const att = document.createElement("p"); att.className = "att";
          att.append(`${m.label} · ${!year || year === "S_NO_SOURCE_YEAR" ? "source year not supplied" : year} `);
          const lic = document.createElement("span"); lic.className = "lic-chip";
          lic.textContent = licenseName(m.licensePosture); att.append(lic, " ");
          if (/^https?:\/\//u.test(m.licensePointer)) {
            const a = document.createElement("a"); a.href = m.licensePointer; a.target = "_blank";
            a.rel = "noreferrer"; a.textContent = "License terms"; att.append(a);
          } else att.append(`record: ${m.licensePointer}`);
          return att;
        };
        // One record stands the reading up, and it is always on the card.
        // Anything further is corroboration, and corroboration folds away —
        // named by its licences, so a reader looking for a particular one can
        // see from the closed drawer whether it is worth opening.
        const groups = [...byText.entries()];
        const [firstText, firstGroup] = groups[0];
        dCard.append(dText(firstText), mLine(firstGroup[0]));
        const rest = [...firstGroup.slice(1).map((r) => [firstText, r]),
                      ...groups.slice(1).flatMap(([t, g]) => g.map((r) => [t, r]))];
        if (!rest.length) return;
        const licences = [...new Set(rest.map(([, r]) => licenseName(index.m_sources[r[3]].licensePosture)))];
        const more = document.createElement("button"); more.type = "button"; more.className = "d-more";
        const drawer = document.createElement("div"); drawer.className = "d-drawer"; drawer.hidden = true;
        more.textContent = `${rest.length} further record${rest.length === 1 ? "" : "s"} · ${licences.join(", ")}`;
        more.setAttribute("aria-expanded", "false");
        more.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const open = drawer.hidden;
          drawer.hidden = !open; more.setAttribute("aria-expanded", String(open));
          if (open && !drawer.childNodes.length) {
            let last = null;
            for (const [text, row] of rest) {
              if (text !== last) { drawer.append(dText(text)); last = text; }
              drawer.append(mLine(row));
            }
          }
          clampHud();
        });
        dCard.append(more, drawer);
      };
      const choose = (route) => {
        selected = route; picked.set(surface, { key: routeKey(route), text: route.text });
        selectedRecordRef.m = index.m_sources[route.records[0][3]] || null;
        renderDCard(); paintGloss(); clampHud();
      };
      const makePill = (route) => {
        const btn = document.createElement("button"); btn.type = "button";
        btn.textContent = spanJoin(route.text);
        const oldestM = index.m_sources[route.records[0][3]];
        btn.title = [Number.isFinite(route.year) ? String(route.year) : "no source year", oldestM ? oldestM.label : ""].filter(Boolean).join(" · ");
        btn.setAttribute("aria-pressed", String(route === selected));
        btn.addEventListener("click", () => {
          pills.querySelectorAll("button").forEach((q) => q.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true"); choose(route);
        });
        return btn;
      };
      // Every reading is a pill. R is never demoted to a picker, never
      // truncated away, never capped: it sits above and before the D and the
      // M, and a reading the catalog attests is a reading the reader can see
      // and press. A form carrying hundreds gets a taller row, which is the
      // honest cost of carrying hundreds.
      pool.forEach((r) => pills.append(makePill(r)));
      readRow.append(pills);
      selectedRecordRef.m = index.m_sources[selected.records[0][3]] || null;
      renderDCard(); dSlot.replaceChildren(dCard);
      paintGloss();
      clampHud();
    };

    // --- row 4 · where the boundaries came from ------------------------
    if (span) {
      prov.textContent = comps.length === 1
        ? `${SPLIT_PROVENANCE[span.rule] || span.rule}`.replace(/^./u, (c) => c.toUpperCase())
        : `${comps.length} components · ${SPLIT_PROVENANCE[span.rule] || span.rule}`;
    } else if (bin.spans) {
      // this zone carries components and this form is not among them
      prov.textContent = "No component system recorded for this form.";
    } else prov.remove();     // this zone carries none at all; say nothing

    renderCuts(); renderCells();
    await renderReadings();
    appendCommentarySection(cm);
    placeHud();
  };

  // Commentary layer — the sidecar rides per book, and there are two grains.
  //
  // V1 anchors a commentary unit to one word of one verse, which is what a
  // word-level attachment map can prove. V2 attaches a whole work to a whole
  // section, because both works are units of the sealed chain and their unit
  // ids already carry the same coordinates: i-kings-7-14 receives
  // targum-jonathan-on-i-kings-7-14. Nothing is fetched and nothing is
  // guessed; the attachment is the chain's own numbering.
  //
  // Absent sidecar, absent anchors, absent section = no commentary shown and
  // nothing implied.
  let commentaryStore = null;
  const commentaryReady = fetch(`data/zones/${BOOK}-commentary.bin`)
    .then((r) => (r.ok ? unpack(r) : null))
    .then((s) => { commentaryStore = s; })
    .catch(() => {});
  const commentaryFor = (unitId, wordPos) => {
    const u = commentaryStore && commentaryStore.units && commentaryStore.units[unitId];
    if (!u || !u.words) return null;
    return u.words[String(wordPos)] || null;
  };
  // Whether any commentary in this zone is anchored to a word rather than to a
  // whole section. It decides one line of help: a section's commentary now
  // names itself on its own line, so the only thing left needing a word of
  // explanation is the mark that sits on a single word.
  const hasWordAnchoredCommentary = () => {
    const us = commentaryStore && commentaryStore.units;
    if (!us) return false;
    for (const u of Object.values(us)) if (u && u.words && Object.keys(u.words).length) return true;
    return false;
  };
  const sectionCommentaryFor = (unitId) => {
    const u = commentaryStore && commentaryStore.units && commentaryStore.units[unitId];
    if (!u || !u.section || !u.section.length) return null;
    return u.section;
  };
  const commentaryWorkOf = (entry) =>
    (commentaryStore && commentaryStore.works && commentaryStore.works[entry.work || 0]) || {};
  const appendCommentarySection = (entries) => {
    if (!entries || !entries.length) return;
    const label = document.createElement("p"); label.className = "r-label";
    label.textContent = "Commentary · attached at this word";
    const pills = document.createElement("div"); pills.className = "c-pills";
    const card = document.createElement("div"); card.className = "c-card";
    let selected = entries[0];
    const renderCard = () => {
      card.replaceChildren();
      const heP = document.createElement("p"); heP.className = "c-he"; heP.lang = "he"; heP.dir = "rtl";
      heP.textContent = selected.text; card.append(heP);
      const att = document.createElement("p"); att.className = "att";
      att.append(`${selected.he_ref || selected.ref} · ${selected.version_title} `);
