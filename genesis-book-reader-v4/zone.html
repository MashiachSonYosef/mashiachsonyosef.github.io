<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone reader · The Tabernacle</title>
<style>
  :root {
    color-scheme: dark;
    /* Tabernacle materials: shesh (linen), zahav (gold), tekhelet reserved
       for structure lines — text and links wear linen, never blue. */
    --bg: #0a0f16; --panel: #101823; --panel2: #0d1520;
    --ink: #ece1c4; --ink-strong: #f6ecd2; --muted: #8fa1b3; --faint: #5f7183;
    --shesh: #d8c7a4; --shesh-bright: #eadbbd;
    --gold: #e8c46a; --gold-dim: #9a7f3f; --amber: #d9a441;
    --line: #1e2c3c; --link: var(--shesh);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Georgia, "Times New Roman", serif; }

  header.top { padding: 1.4rem 1.5rem 1rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0d1520 0%, var(--bg) 100%); }
  header.top h1 { margin: 0; font-size: 1.9rem; color: var(--ink-strong); letter-spacing: 0.01em; }
  header.top h1 .he-t { font-size: 2.1rem; margin-right: 0.7rem; }
  header.top h1 .en-t { color: var(--gold); font-size: 1.15rem; font-variant: small-caps; letter-spacing: 0.14em; }
  header.top p.byline { margin: 0.25rem 0 0; font-size: 0.85rem; color: var(--muted); }
  header.top p#meta { margin: 0.55rem 0 0; font-size: 0.8rem; color: var(--muted); max-width: 60rem; }
  header.top nav { margin-top: 0.6rem; font-size: 0.85rem; }
  header.top a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(216, 199, 164, 0.35); }
  header.top a:hover { color: var(--gold); border-bottom-color: var(--gold); }

  /* contents */
  #toc { max-width: 48rem; margin: 1.3rem auto 0; padding: 0 1.5rem; }
  #toc h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); margin: 0 0 0.5rem; }
  /* Contents is a coordinate grid: positions, not content. Plain English
     names the structure ("Part 2", "Chapter 7") — describing a thing is not
     translating it, and an English reader should never be locked out of
     navigation. The words themselves live in the text, where they can be
     tapped. */
  #toc .chs { display: grid; gap: 0.28rem; margin-top: 0.3rem;
    grid-template-columns: repeat(auto-fill, minmax(2.35rem, 1fr)); }
  #toc .chs a { display: flex; align-items: center; justify-content: center; min-height: 2.05rem;
    border: 1px solid var(--line); border-radius: 0.35rem; background: var(--panel2);
    text-decoration: none; font: 0.92rem/1 Georgia, serif; color: var(--gold);
    font-variant-numeric: tabular-nums; transition: border-color 120ms, background 120ms; }
  #toc .chs a:hover { border-color: var(--gold); background: #16202c; }
  #toc .chs a.on { border-color: var(--gold); background: var(--gold); color: #171105; font-weight: bold; }
  /* the sections of one chapter, opened in place under the grid */
  #secPanel { margin-top: 0.7rem; border: 1px solid var(--line); border-radius: 0.5rem;
    background: var(--panel2); padding: 0.6rem 0.7rem; }
  #secPanel[hidden] { display: none; }
  #secPanel .sp-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem;
    font-size: 0.74rem; letter-spacing: 0.14em; font-variant: small-caps; color: var(--faint); }
  #secPanel .sp-he { font-variant: normal; letter-spacing: 0; font-size: 1rem; color: var(--gold); }
  #secPanel .sp-x { margin-inline-start: auto; background: none; border: 0; color: var(--muted);
    font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 0 0.2rem; }
  #secPanel .sp-grid { display: grid; gap: 0.26rem;
    grid-template-columns: repeat(auto-fill, minmax(2.9rem, 1fr)); }
  #secPanel .sp-grid a { display: flex; align-items: center; justify-content: center; min-height: 1.85rem;
    border: 1px solid var(--line); border-radius: 0.32rem; background: var(--panel);
    color: var(--muted); text-decoration: none; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  #secPanel .sp-grid a:hover { border-color: var(--gold); color: var(--gold); }
  #secPanel .sp-grid a.sp-top { grid-column: span 2; color: var(--gold); font-variant: small-caps;
    letter-spacing: 0.1em; border-color: var(--gold-dim); }

  /* one floating bar, not chrome on every section */
  #nav { position: fixed; z-index: 60; right: 0.9rem; bottom: 0.9rem; display: flex; gap: 0.3rem;
    background: rgba(16, 24, 35, 0.94); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem; box-shadow: 0 8px 24px rgba(0,0,0,.5); backdrop-filter: blur(4px); }
  #nav[hidden] { display: none; }
  #nav button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.75rem;
    letter-spacing: 0.08em; font-variant: small-caps; cursor: pointer; border-radius: 999px;
    padding: 0.24rem 0.7rem; white-space: nowrap; }
  #nav button:hover:not(:disabled) { color: var(--gold); background: #16202c; }
  #nav button:disabled { opacity: 0.35; cursor: default; }
  #navPrev, #navNext { font-size: 1rem; padding: 0.14rem 0.55rem; }
  @media (max-width: 520px) { #nav { left: 0.9rem; right: 0.9rem; justify-content: center; } }

  #toc .toc-note { margin: 0.75rem 0 0; font-size: 0.72rem; color: var(--faint); }
  #toc .part { margin: 0 0 0.65rem; }
  #toc .part b { display: block; color: var(--gold); font-variant: small-caps; letter-spacing: 0.1em;
    font-weight: normal; font-size: 0.92rem; margin-bottom: 0.15rem; }
  #toc .part b .he-small { color: var(--ink); font-size: 1rem; margin-left: 0.6rem; }
  #toc a { color: var(--muted); text-decoration: none; font-size: 0.84rem; }
  #toc a:hover { color: var(--link); }

  main { max-width: 48rem; margin: 0 auto; padding: 0.4rem 1.5rem 5rem; }

  .part-head { margin: 3rem 0 0.4rem; padding-top: 1.6rem; border-top: 1px double var(--gold-dim); }
  .part-head .he { direction: rtl; text-align: right; font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .part-head .en { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); text-align: left; }
  /* Titles are corpus words: same word blocks as the text, sized as a title.
     Gold on the Hebrew per the Y ledger's own colour contract (structure). */
  .title-row { direction: rtl; text-align: right; }
  body.en .title-row { direction: ltr; text-align: left; }
  .part-head .title-row .w { font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .node-head .title-row .w { font-size: 1.55rem; color: var(--gold); }
  .title-row .wb { margin-bottom: 0.35rem; }
  .title-row .g { font-size: 0.62rem; max-width: 9em; }
  .node-head .title-row .g { font-size: 0.68rem; }
  .locator { display: block; font-size: 0.74rem; letter-spacing: 0.16em; font-variant: small-caps;
    color: var(--faint); margin-bottom: 0.3rem; }
  .vnum { font-variant-numeric: tabular-nums; }
  .seg-row .vlabel { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-inline-start: 0.4rem; }

  .node-head { margin: 1.9rem 0 0.9rem; }
  .node-head .he { direction: rtl; text-align: right; font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .node-head .en { font-size: 0.82rem; font-variant: small-caps; letter-spacing: 0.16em; color: var(--gold); margin-top: 0.1rem; }

  section.seg { margin: 0 0 1.35rem; }
  .seg-row { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.25rem; direction: ltr; }
  .vnum { font-size: 0.72rem; color: var(--gold); border: 1px solid #3a3220;
    background: #151b26; border-radius: 0.5rem; padding: 0.05rem 0.5rem; letter-spacing: 0.06em; }
  .drift-chip { font-size: 0.68rem; color: var(--amber); border: 1px dashed #6b5320; border-radius: 0.5rem;
    padding: 0.05rem 0.45rem; letter-spacing: 0.03em; }
  .he-text { direction: rtl; text-align: right; font-size: 1.5rem; line-height: 1.35; margin: 0;
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .wb { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top;
    margin: 0 0.16rem 0.55rem; cursor: pointer; }
  .w { display: block; order: 1; border-bottom: 1px dashed transparent; border-radius: 2px; }
  .wb:hover .w { color: #ffe08a; border-bottom-color: #6a5a33; }
  .wb.held { opacity: 0.45; cursor: default; }
  .wb.active .w { color: var(--gold); border-bottom: 1px solid var(--gold); }
  .g { display: block; order: 2; direction: ltr; font: 0.66rem/1.25 Georgia, serif; color: var(--muted);
    letter-spacing: 0.02em; margin-top: 0.06rem; max-width: 10em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb.active .g { color: var(--gold); }

  /* English reader (LTR): the gloss line leads, the Hebrew rides beneath. */
  body.en .he-text { direction: ltr; text-align: left; }
  body.en .g { order: 1; font-size: 0.98rem; line-height: 1.3; color: var(--ink); margin-top: 0; max-width: 12em; }
  body.en .w { order: 2; font-size: 1.02rem; color: #b3a077; margin-top: 0.04rem; }
  body.en .wb.active .g { color: var(--gold); }

  #modeRow { margin-top: 0.75rem; display: flex; gap: 0.55rem; }
  .mode-btn { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 999px; padding: 0.32rem 1.15rem; font: inherit; font-size: 0.86rem; cursor: pointer; }
  .mode-btn.on { background: var(--gold); color: #171105; border-color: var(--gold); font-weight: bold; }

  /* The HUD floats. The Hebrew never moves — law of the house. */
  #hud { position: fixed; z-index: 70; max-width: 23rem; width: min(23rem, 92vw); max-height: 55vh;
    overflow-y: auto; background: var(--panel); border: 1px solid #2c4a63; border-radius: 0.7rem;
    padding: 0.85rem 1.05rem; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
  #hud[hidden] { display: none; }
  #hud .head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem;
    border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; margin-bottom: 0.3rem; }
  #hud .head b { font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .head button { background: none; border: 0; color: var(--link); font-size: 1.15rem; cursor: pointer; }
  #hud p { margin: 0.45rem 0; }
  #hud .att { color: var(--muted); font-size: 0.78rem; }
  #hud .att a { color: var(--link); }
  /* R pills — one route per pill, one selected at a time (the reader's law). */
  #hud .r-label { margin: 0.5rem 0 0.3rem; color: var(--faint); font-size: 0.74rem;
    letter-spacing: 0.06em; text-transform: uppercase; }
  #hud .r-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  #hud .r-pills button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 999px; padding: 0.22rem 0.7rem; font: inherit; font-size: 0.76rem; cursor: pointer;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .r-pills button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold);
    color: #171105; font-weight: bold; }
  #hud .r-more { margin-top: 0.35rem; background: none; border: 0; color: var(--link);
    font: inherit; font-size: 0.76rem; cursor: pointer; padding: 0; }
  #hud .r-overflow { margin-top: 0.45rem; }
  #hud .r-overflow select { width: 100%; font: inherit; font-size: 0.78rem; color: var(--muted);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 0.45rem;
    padding: 0.3rem 0.5rem; cursor: pointer; }
  #hud .r-overflow select:hover { border-color: var(--gold-dim); }
  #hud .r-overflow select.on { color: #171105; background: var(--gold); border-color: var(--gold); font-weight: bold; }
  #hud .d-card { margin-top: 0.55rem; border-top: 1px solid var(--line); padding-top: 0.45rem; }
  #hud .d-card .d-text { margin: 0.25rem 0; }
  .lic-chip { display: inline-block; margin-inline-start: 0.45rem; padding: 0.02rem 0.5rem;
    border-radius: 999px; background: rgba(216, 199, 164, 0.12); border: 1px solid rgba(216, 199, 164, 0.3);
    color: var(--shesh); font-size: 0.72rem; }
  /* commentary chip on a word block */
  .wb { position: relative; }
  .c-chip { position: absolute; top: -0.35rem; left: -0.5rem; z-index: 2; direction: ltr;
    font: bold 0.58rem/1.5 Inter, system-ui, sans-serif; color: #2a1a10; background: #b06a4a;
    border-radius: 999px; min-width: 1.05rem; text-align: center; padding: 0 0.22rem; pointer-events: none; }
  body.en .c-chip { left: auto; right: -0.5rem; }
  #hud .c-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  #hud .c-pills button { border: 1px solid #5a3a2a; background: #1c1410; color: #d9b49a;
    border-radius: 999px; padding: 0.22rem 0.7rem; font: inherit; font-size: 0.76rem; cursor: pointer;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .c-pills button[aria-pressed="true"] { background: #b06a4a; border-color: #b06a4a; color: #1c0f08; font-weight: bold; }
  #hud .c-card { margin-top: 0.55rem; border-top: 1px solid var(--line); padding-top: 0.45rem; }
  #hud .c-card .c-he { margin: 0.3rem 0; font-size: 1.05rem; line-height: 1.9; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .c-note { color: var(--faint); font-size: 0.72rem; margin: 0.2rem 0 0; }
  #prov a { color: var(--shesh); }

  footer { max-width: 48rem; margin: 0 auto; padding: 1.1rem 1.5rem 2.2rem; font-size: 0.76rem;
    color: var(--faint); border-top: 1px solid var(--line); direction: ltr; text-align: left; }

  @media (max-width: 640px) {
    .he-text { font-size: 1.32rem; line-height: 2.05; }
    header.top h1 { font-size: 1.5rem; } header.top h1 .he-t { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<header class="top">
  <h1 id="workTitle"><span class="he-t" lang="he" dir="rtl"></span><span class="en-t">Zone reader</span></h1>
  <p class="byline" id="byline"></p>
  <p id="meta">Loading the zone…</p>
  <nav><a href="genesis-book-reader-v4.html">← Genesis reader</a> · <a href="dictionary.html">Dictionary</a> · books: <a href="zone.html?b=orot">Orot</a> · <a href="zone.html?b=genesis">Genesis</a></nav>
  <div id="modeRow">
    <button type="button" class="mode-btn on" id="modeHe">Hebrew reader</button>
    <button type="button" class="mode-btn" id="modeEn">English reader</button>
  </div>
</header>
<div id="toc" hidden><h2>Contents</h2><div id="tocBody"></div><div id="secPanel" hidden></div></div>
<div id="nav" hidden>
  <button id="navTop" type="button" title="Back to the top of the page">Top</button>
  <button id="navChapter" type="button" title="Back to the top of this chapter">Chapter</button>
  <button id="navPrev" type="button" aria-label="Previous chapter" title="Previous chapter">&lsaquo;</button>
  <button id="navNext" type="button" aria-label="Next chapter" title="Next chapter">&rsaquo;</button>
</div>
<main id="text"></main>
<div id="hud" hidden></div>
<footer id="prov"></footer>
<script>
(async () => {
  const BOOK = (new URLSearchParams(location.search).get("b") || "orot").replace(/[^a-z0-9-]/g, "");
  const unpack = async (res) =>
    JSON.parse(await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text());
  const licenseName = (posture) => {
    const v = String(posture || "").toLowerCase();
    if (!v) return "License unrecorded";
    if (v.startsWith("cc0")) return "CC0";
    if (/_nc(?:_|$)/u.test(v)) return /_sa(?:_|$)/u.test(v) ? "CC BY-NC-SA" : "CC BY-NC";
    if (v.includes("by_sa") || v.includes("gfdl")) return "CC BY-SA";
    if (v.startsWith("public_domain")) return "Public Domain";
    if (v.startsWith("cc_by") || v.includes("wordnet")) return "CC BY";
    return posture;
  };
  let zone, index;
  try {
    [zone, index] = await Promise.all([
      fetch(`data/zones/${BOOK}.bin`).then(unpack),
      fetch("data/route-store/index.json").then((r) => r.json()),
    ]);
  } catch {
    document.getElementById("meta").textContent =
      "No book is published on this page yet — no walk has landed. The page takes its name from the zone when one arrives; nothing is shown, and nothing is named, that has not come through the pipeline.";
    return;
  }
  document.querySelector("#workTitle .he-t").textContent = zone.work_he || "";
  document.querySelector("#workTitle .en-t").textContent = zone.work;
  document.title = `${zone.work} · The Tabernacle`;
  document.getElementById("byline").textContent = zone.byline || "";
  const ac = zone.emitted_from.acquisition, wk = zone.emitted_from.walk, oc = zone.emitted_from.identity_oracle;
  document.getElementById("meta").textContent =
    `${zone.counts.words.toLocaleString()} words · ${zone.counts.sections.toLocaleString()} sections · ` +
    (wk ? (/RESIDENT_SERVE/.test(wk.route || "")
      ? `served id-by-id from the seal-verified terminal reader artifacts (${wk.ids_walked.toLocaleString()} ids, every one FOUND_EXACT; the installed sealed reader re-answered ${wk.sealed_oracle.report.sampled} sampled ids ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact) · rights ride per occurrence from the chain · `
      : `walked word-by-word through the installed sealed terminal reader (${wk.ids_walked.toLocaleString()} ids, every one FOUND_EXACT) · rights ride per occurrence from the chain · `) : `Hebrew text: ${ac.hebrew_version} via Sefaria, license ${ac.hebrew_license_seen} (seen live on every payload) · `) +
    `${zone.counts.verified_units} of ${zone.counts.sections} sections verified word-for-word in count against the sealed corpus allocation` +
    `${zone.counts.drifted_units ? `; ${zone.counts.drifted_units} drift from it and are marked` : ""} · ` +
    `${zone.counts.glossed_words ? zone.counts.glossed_words.toLocaleString() + " words carry their oldest-sourced catalog route as an English gloss (exact spellings only — unmatched forms stay bare) · " : ""}` +
    `tap any word for all routes, sources, and licenses`;
  document.getElementById("prov").textContent =
    `${zone.rule_id} · route: ${zone.route} · identity oracle ${oc.bridge_sha256.slice(0, 16)}… ` +
    `(${oc.sealed_units.toLocaleString()} units, C0 ${oc.first_c0_numeric_id.toLocaleString()}–${oc.last_c0_numeric_id.toLocaleString()}) · ` +
    (wk ? `${/RESIDENT_SERVE/.test(wk.route || "") ? `serve rule ${wk.walker_rule}; sealed-reader oracle ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact; ` : `walk: `}module ${wk.module.sha256.slice(0, 12)}…, pointer ${wk.pointer.sha256.slice(0, 12)}… · ${zone.emitted_from.license_receipts.per_occurrence} · ` : `payload sha ${ac.payload_sha256_transferred.slice(0, 16)}… · ${zone.emitted_from.license_receipts.work_activation} · `) +
    `${zone.emitted_from.gloss_layer ? `glosses: ${zone.emitted_from.gloss_layer.rule} (table sha ${zone.emitted_from.gloss_layer.gloss_table_sha256.slice(0, 12)}…; ${zone.emitted_from.gloss_layer.attribution}) · ` : ""}` +
    `chapter names shown in English come verbatim from the source index receipts; no English translation is paired, because the only licensed one survives as fragments in another edition's paragraphing and honest alignment does not exist · ` +
    (zone.emitted_from.sealed_chain_status
      ? `the installed terminal reader does not yet carry this span (partial-rebuild gap); this page runs the acquisition route until a sealed generation includes the book.`
      : (wk && /RESIDENT_SERVE/.test(wk.route || "")
        ? `this zone was served from the sealed chain's own artifacts, seal-verified once, with the installed terminal reader re-answering sampled ids as oracle — the pipeline route, end to end.`
        : `this zone came through the installed terminal reader itself — the pipeline route, end to end.`));
  // explicit license links, from the zone's own receipts
  if (zone.emitted_from.license_links && zone.emitted_from.license_links.length) {
    const provEl = document.getElementById("prov");
    const linkRow = document.createElement("p");
    zone.emitted_from.license_links.forEach((l, i) => {
      if (i) linkRow.append(" · ");
      const a = document.createElement("a"); a.href = l.url; a.target = "_blank"; a.rel = "noreferrer";
      a.textContent = l.label; linkRow.append(a);
    });
    provEl.append(linkRow);
  }

  const hud = document.getElementById("hud");
  // The reader's display law: route texts pack morpheme spans with "/"; the
  // page never shows the raw packing — spans join with " + ", exactly the
  // reader's own cell join. One route on display at a time, everywhere.
  const spanJoin = (t) => String(t).split("/").map((x) => x.trim()).filter(Boolean).join(" + ");
  const shardCache = new Map();
  const routesFor = async (key) => {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(key));
    const shard = new Uint8Array(digest)[0].toString(16).padStart(2, "0");
    if (!shardCache.has(shard)) {
      shardCache.set(shard, fetch(`data/route-store/shards/${shard}.bin`).then(unpack).catch(() => null));
    }
    const data = await shardCache.get(shard);
    return data ? data[key] : null;
  };
  let activeEl = null;
  const closeHud = () => { hud.hidden = true; hud.replaceChildren(); activeEl?.classList.remove("active"); activeEl = null; };
  const openHud = async (el, word, unitId, wordPos) => {
    closeHud();
    activeEl = el; el.classList.add("active");
    const rect = el.getBoundingClientRect();
    hud.style.top = Math.min(window.innerHeight - 60, rect.bottom + 8) + "px";
    hud.style.left = Math.max(8, Math.min(window.innerWidth - Math.min(368, window.innerWidth * 0.92) - 8, rect.left - 100)) + "px";
    hud.hidden = false;
    const head = document.createElement("div"); head.className = "head";
    const b = document.createElement("b"); b.lang = "he"; b.dir = "rtl"; b.textContent = word.s;
    const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", "Close"); x.addEventListener("click", closeHud);
    head.append(b, x);
    const status = document.createElement("p"); status.textContent = "Fetching one shard…";
    hud.replaceChildren(head, status);
    const cm = commentaryFor(unitId, wordPos);
    const routes = await routesFor(word.k);
    if (!routes) {
      status.textContent = "No exact route in the catalog for this form. Exact spellings only — nothing folded, nothing guessed.";
      appendCommentarySection(cm);
      return;
    }
    hud.removeChild(status);
    // R pills, the reader's law (rule v2 · 2026-08-10): dedupe routes
    // by text merging the oldest year and lowest rank; oldest source
    // leads, post-1940 and unyeared sources last; ONE route selected at a
    // time — its D record and attribution ride below; tap a pill to switch,
    // and the gloss under the word follows the selection.
    // Sense level (rule v3): a route text packs senses with ";" — each sense
    // is its own pill. One reading on display at a time, in every packing.
    const groups = new Map();
    routes.forEach((row) => {
      const [rank, routeText, definitionText, mId, year] = row;
      if (!index.m_sources[mId]) return;
      const y = Number.parseInt(year, 10);
      const yr = Number.isInteger(y) ? y : Infinity;
      String(routeText || "").split(";").map((s) => s.trim()).filter(Boolean).forEach((sense) => {
        const key = sense.toLowerCase();
        const g = groups.get(key);
        if (!g) groups.set(key, { text: sense, year: yr, ledger: Number(rank), records: [row] });
        else {
          g.year = Math.min(g.year, yr); g.ledger = Math.min(g.ledger, Number(rank));
          if (!g.records.includes(row)) g.records.push(row);
        }
      });
    });
    const tier = (r) => Number.isFinite(r.year) && r.year <= 1940 ? 0 : 1;
    const pool = [...groups.values()].sort((a, b) => tier(a) - tier(b) || a.year - b.year || a.ledger - b.ledger);
    if (!pool.length) {
      const p = document.createElement("p");
      p.textContent = "No displayable route in the catalog for this form.";
      hud.append(p); return;
    }
    let selected = pool[0];
    const label = document.createElement("p"); label.className = "r-label";
    label.textContent = "Exact selectable routes";
    const pills = document.createElement("div"); pills.className = "r-pills";
    const dCard = document.createElement("div"); dCard.className = "d-card";
    const renderDCard = () => {
      dCard.replaceChildren();
      const recs = [...selected.records].sort((a, b) => {
        const ya = Number.parseInt(a[4], 10), yb = Number.parseInt(b[4], 10);
        return (Number.isInteger(ya) ? ya : 9e9) - (Number.isInteger(yb) ? yb : 9e9);
      });
      recs.forEach(([rank, routeText, definitionText, mId, year]) => {
        const m = index.m_sources[mId];
        if (definitionText && definitionText !== routeText) {
          const d = document.createElement("p"); d.className = "d-text"; d.dir = "auto";
          d.textContent = definitionText; dCard.append(d);
        }
        const att = document.createElement("p"); att.className = "att";
        const yearLabel = !year || year === "S_NO_SOURCE_YEAR" ? "source year not supplied" : year;
        att.append(`${m.label} · ${yearLabel} `);
        const lic = document.createElement("span"); lic.className = "lic-chip";
        lic.textContent = licenseName(m.licensePosture); att.append(lic, " ");
        if (/^https?:\/\//u.test(m.licensePointer)) {
          const a = document.createElement("a"); a.href = m.licensePointer; a.target = "_blank"; a.rel = "noreferrer"; a.textContent = "License terms"; att.append(a);
        } else att.append(`record: ${m.licensePointer}`);
        dCard.append(att);
      });
    };
    const glossEl = el.querySelector(".g");
    let overflow = null;
    const clearPressed = () => {
      pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
      if (overflow) { overflow.selectedIndex = 0; overflow.classList.remove("on"); }
    };
    const choose = (route) => {
      selected = route;
      renderDCard();
      if (glossEl) { glossEl.textContent = spanJoin(route.text); glossEl.title = spanJoin(route.text); glossEl.classList.remove("bare"); }
    };
    const makePill = (route) => {
      const b = document.createElement("button"); b.type = "button";
      b.textContent = spanJoin(route.text);
      const oldestM = index.m_sources[route.records[0][3]];
      b.title = [Number.isFinite(route.year) ? String(route.year) : "no source year", oldestM ? oldestM.label : ""].filter(Boolean).join(" · ");
      b.setAttribute("aria-pressed", String(route === selected));
      b.addEventListener("click", () => { clearPressed(); b.setAttribute("aria-pressed", "true"); choose(route); });
      return b;
    };
    // Ten readings sit out as pills; the rest go to a picker rather than an
    // ever-growing wall of them. Some words carry hundreds.
    const SHOWN = 10;
    pool.slice(0, SHOWN).forEach((r) => pills.append(makePill(r)));
    hud.append(label, pills);
    if (pool.length > SHOWN) {
      const rest = pool.slice(SHOWN);
      const wrap = document.createElement("div"); wrap.className = "r-overflow";
      const sel = document.createElement("select"); overflow = sel;
      sel.setAttribute("aria-label", `${rest.length} more readings`);
      const head = document.createElement("option");
      head.textContent = `${rest.length} more readings…`; head.value = ""; sel.append(head);
      rest.forEach((r, i) => {
        const o = document.createElement("option"); o.value = String(i);
        const yr = Number.isFinite(r.year) ? r.year : null;
        o.textContent = spanJoin(r.text) + (yr ? `  ·  ${yr}` : "");
        sel.append(o);
      });
      sel.addEventListener("change", () => {
        if (sel.value === "") return;
        const route = rest[Number(sel.value)];
        pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        sel.classList.add("on");
        choose(route);
      });
      wrap.append(sel); hud.append(wrap);
    }
    renderDCard();
    hud.append(dCard);
    appendCommentarySection(cm);
  };

  // Commentary layer — the sidecar rides per book; word-anchored units from
  // the attachment map, each with its own license, one unit on display at a
  // time. Absent sidecar or absent anchors = no section, nothing implied.
  let commentaryStore = null;
  const commentaryReady = fetch(`data/zones/${BOOK}-commentary.bin`)
    .then((r) => (r.ok ? unpack(r) : null))
    .then((s) => { commentaryStore = s; })
    .catch(() => {});
  const commentaryFor = (unitId, wordPos) => {
    const u = commentaryStore && commentaryStore.units && commentaryStore.units[unitId];
    if (!u || !u.words) return null;
    return u.words[String(wordPos)] || null;
  };
  const appendCommentarySection = (entries) => {
    if (!entries || !entries.length) return;
    const label = document.createElement("p"); label.className = "r-label";
    label.textContent = "Commentary · attached at this word";
    const pills = document.createElement("div"); pills.className = "c-pills";
    const card = document.createElement("div"); card.className = "c-card";
    let selected = entries[0];
    const renderCard = () => {
      card.replaceChildren();
      const heP = document.createElement("p"); heP.className = "c-he"; heP.lang = "he"; heP.dir = "rtl";
      heP.textContent = selected.text; card.append(heP);
      const att = document.createElement("p"); att.className = "att";
      att.append(`${selected.he_ref || selected.ref} · ${selected.version_title} `);
      const lic = document.createElement("span"); lic.className = "lic-chip"; lic.textContent = selected.license; att.append(lic, " ");
      if (selected.source_url) {
        const a = document.createElement("a"); a.href = selected.source_url; a.target = "_blank"; a.rel = "noreferrer";
        a.textContent = "Source"; att.append(a);
      }
      card.append(att);
      const note = document.createElement("p"); note.className = "c-note";
      note.textContent = selected.state === "PROVEN_EDGE"
        ? `Attachment: proven edge (${selected.basis})`
        : `Attachment: suggested reach only — ${selected.basis}; not a proven word edge`;
      card.append(note);
    };
    // Same shape as the readings: ten out front, the rest in a picker. One
    // word here carries a hundred and six.
    const C_SHOWN = 10;
    let cOverflow = null;
    entries.slice(0, C_SHOWN).forEach((e, i) => {
      const p = document.createElement("button"); p.type = "button";
      p.textContent = e.title || `${e.family_en} · ${i + 1}`;
      p.title = `${e.family_en}${e.years && e.years.length ? " · " + e.years.join("–") : ""}`;
      p.setAttribute("aria-pressed", String(e === selected));
      p.addEventListener("click", () => {
        selected = e;
        pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        if (cOverflow) { cOverflow.selectedIndex = 0; cOverflow.classList.remove("on"); }
        p.setAttribute("aria-pressed", "true");
        renderCard();
      });
      pills.append(p);
    });
    hud.append(label, pills);
    if (entries.length > C_SHOWN) {
      const rest = entries.slice(C_SHOWN);
      const wrap = document.createElement("div"); wrap.className = "r-overflow";
      const sel = document.createElement("select"); cOverflow = sel;
      sel.setAttribute("aria-label", `${rest.length} more commentary units`);
      const head = document.createElement("option");
      head.textContent = `${rest.length} more commentary units…`; head.value = ""; sel.append(head);
      rest.forEach((e, j) => {
        const o = document.createElement("option"); o.value = String(j);
        o.textContent = (e.title || `${e.family_en} · ${C_SHOWN + j + 1}`) +
          (e.years && e.years.length ? `  ·  ${e.years[0]}` : "");
        sel.append(o);
      });
      sel.addEventListener("change", () => {
        if (sel.value === "") return;
        selected = rest[Number(sel.value)];
        pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        sel.classList.add("on");
        renderCard();
      });
      wrap.append(sel); hud.append(wrap);
    }
    renderCard();
    hud.append(card);
  };
  document.addEventListener("click", (e) => { if (!hud.hidden && !hud.contains(e.target) && !e.target.closest(".wb")) closeHud(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeHud(); });

  // Hebrew / English reader toggle. Same words, same order, same receipts —
  // the English mode flips the flow LTR and lets the gloss line lead.
  const btnHe = document.getElementById("modeHe"), btnEn = document.getElementById("modeEn");
  const setMode = (m) => {
    closeHud();
    document.body.classList.toggle("en", m === "en");
    btnHe.classList.toggle("on", m !== "en");
    btnEn.classList.toggle("on", m === "en");
  };
  btnHe.addEventListener("click", () => setMode("he"));
  btnEn.addEventListener("click", () => setMode("en"));
  if (new URLSearchParams(location.search).get("mode") === "en") setMode("en");

  // contents
  // A title is the section's own words, so it renders exactly like the text:
  // word blocks, gloss beneath where that token's route carries one, HUD on
  // tap. Used in the body only — see the contents note below.
  const titleRow = (toks, raw) => {
    const row = document.createElement("div"); row.className = "title-row";
    if (!toks || !toks.length) { row.lang = "he"; row.dir = "rtl"; row.textContent = raw || ""; return row; }
    toks.forEach((t) => {
      const wb = document.createElement("span"); wb.className = "wb";
      const w = document.createElement("span"); w.className = "w"; w.lang = "he"; w.dir = "rtl"; w.textContent = t.s;
      wb.append(w);
      const g = zone.gloss ? zone.gloss[t.k] : null;
      const ge = document.createElement("span"); ge.className = "g";
      if (g) { ge.textContent = spanJoin(g); ge.title = spanJoin(g); } else { ge.textContent = " "; ge.classList.add("bare"); }
      wb.append(ge);
      wb.addEventListener("click", (e) => { e.stopPropagation(); openHud(wb, { s: t.s, k: t.k }, null, null); });
      row.append(wb, document.createTextNode(" "));
    });
    return row;
  };

  // Contents is navigation, not text: one surface, one verb — every tap here
  // jumps. It carries coordinates, not content: a title is corpus text, and
  // corpus text belongs where it can be tapped and defined. The Hebrew name
  // rides as a hover title only, an access aid like the number itself.
  const nodes = zone.nodes || [];
  if (nodes.length) {
    const tocBody = document.getElementById("tocBody");
    const multiPart = new Set(nodes.map((n) => n.part_num || 1)).size > 1;
    let lastPart = null, chs = null;
    nodes.forEach((n, i) => {
      const partKey = n.part_num || 1;
      if (partKey !== lastPart) {
        lastPart = partKey;
        const partDiv = document.createElement("div"); partDiv.className = "part";
        if (multiPart) { const b = document.createElement("b"); b.textContent = `Part ${partKey}`; partDiv.append(b); }
        chs = document.createElement("div"); chs.className = "chs"; partDiv.append(chs);
        tocBody.append(partDiv);
      }
      const a = document.createElement("a"); a.href = `#n${i}`;
      a.textContent = String(n.num || i + 1);
      // the name and the size live on hover and in the label, where they can
      // be read as sentences — the cell itself stays a coordinate
      const named = [n.name_he, n.sections ? `${n.sections} sections` : ""].filter(Boolean).join(" · ");
      if (named) a.title = named;
      a.setAttribute("aria-label", `${n.name_en || `Chapter ${n.num || i + 1}`}${n.sections ? `, ${n.sections} sections` : ""}`);
      chs.append(a);
    });
    const note = document.createElement("p"); note.className = "toc-note";
    note.textContent = multiPart
      ? "Chapter numbers by part. Titles read in the text; hover a number for its title and size."
      : "Chapter numbers. Titles read in the text; hover a number for its title and size.";
    tocBody.append(note);
    document.getElementById("toc").hidden = false;
  }

  // text — the commentary sidecar (if any) must be in hand before word
  // blocks render, so C chips land on first paint.
  await commentaryReady;
  const main = document.getElementById("text");
  const frag = document.createDocumentFragment();
  let curPart = null, curNode = -1, openedNode = false;
  let secIdx = 0;
  const nodeSections = {};
  const nodeHeads = [];
  zone.sections.forEach((sec) => {
    const n = nodes[sec.node] || {};
    if (sec.node !== curNode) {
      const partKey = n.part_he || n.part_en || "";
      if (partKey !== curPart) {
        curPart = partKey;
        const ph = document.createElement("div"); ph.className = "part-head";
        // Plain English names the structure — a position and a count, never a
        // translation of the title. The title itself is the Hebrew row below.
        if (n.part_num) { const pen = document.createElement("div"); pen.className = "locator"; pen.textContent = `Part ${n.part_num} · part title`; ph.append(pen); }
        ph.append(titleRow(n.part_tokens, n.part_he));
        frag.append(ph);
      }
      curNode = sec.node;
      const nh = document.createElement("div"); nh.className = "node-head"; nh.id = `n${sec.node}`;
      const loc = document.createElement("span"); loc.className = "locator";
      loc.textContent = `${n.name_en || `Chapter ${n.num || sec.node + 1}`} · chapter title` +
        (n.sections ? ` · ${n.sections} ${n.sections === 1 ? "section" : "sections"}` : "");
      nh.append(loc);
      nh.append(titleRow(n.name_tokens, n.name_he));
      frag.append(nh); openedNode = true; nodeHeads.push({ node: sec.node, el: nh });
    }
    const s = document.createElement("section"); s.className = "seg";
    s.id = `s${secIdx}`;
    (nodeSections[sec.node] = nodeSections[sec.node] || []).push({ label: sec.label || String(secIdx + 1), id: s.id });
    secIdx += 1;
    const row = document.createElement("div"); row.className = "seg-row";
    const v = document.createElement("span"); v.className = "vnum"; v.textContent = sec.label || "";
    const parts = String(sec.label || "").split(":");
    v.title = parts.length === 2 ? `Section ${parts[0]}, paragraph ${parts[1]}` : `Section ${parts[0]}`;
    row.append(v);
    // name the numbering once per chapter, so a reader meets it before
    // scrolling past four hundred of them
    if (openedNode) {
      const vl = document.createElement("span"); vl.className = "vlabel";
      vl.textContent = parts.length === 2 ? "section · paragraph" : "section";
      row.append(vl); openedNode = false;
    }
    if (sec.drift) {
      const d = document.createElement("span"); d.className = "drift-chip";
      d.textContent = `drifts from the sealed count · ${sec.drift.sealed_rows} sealed → ${sec.drift.observed_rows} here`;
      row.append(d);
    }
    const he = document.createElement("p"); he.className = "he-text"; he.lang = "he"; he.dir = "rtl";
    let wIdx = 0;
    sec.words.forEach((word) => {
      const wb = document.createElement("span");
      wb.className = word.held ? "wb held" : "wb";
      const span = document.createElement("span");
      span.className = "w"; span.lang = "he"; span.dir = "rtl";
      span.textContent = word.s;
      wb.append(span);
      const g = zone.gloss ? zone.gloss[word.k] : null;
      // The gloss line always exists — words without English keep an empty
      // line so the Hebrew never rides higher than its neighbors, in either
      // reader mode.
      const ge = document.createElement("span"); ge.className = "g";
      if (g) { ge.textContent = spanJoin(g); ge.title = spanJoin(g); }
      else { ge.textContent = " "; ge.classList.add("bare"); }
      wb.append(ge);
      const myIdx = wIdx; wIdx += 1;
      const cm = commentaryFor(sec.unit, myIdx);
      if (cm && cm.length) {
        const chip = document.createElement("span"); chip.className = "c-chip";
        chip.textContent = "C" + (cm.length > 1 ? cm.length : "");
        wb.append(chip);
      }
      if (!word.held) wb.addEventListener("click", () => openHud(wb, word, sec.unit, myIdx));
      he.append(wb, document.createTextNode(" "));
    });
    s.append(row, he);
    frag.append(s);
  });
  main.append(frag);

  // ---- getting around -------------------------------------------------
  // One floating bar rather than controls on every section: at 1,533
  // sections per book, per-section chrome is noise. The bar knows which
  // chapter you are in and stands down whenever the HUD is open, so only
  // one thing ever asks for a tap.
  const nav = document.getElementById("nav");
  const navChapter = document.getElementById("navChapter");
  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");
  const heads = nodeHeads.map((h) => ({ node: h.node, el: h.el }));
  let atNode = 0;
  // A book this long runs to millions of pixels; smooth scrolling across
  // that distance stalls, so only short hops animate.
  const goTo = (top) => {
    const d = Math.abs(top - window.scrollY);
    window.scrollTo({ top, behavior: d > 2500 ? "auto" : "smooth" });
    requestAnimationFrame(paintNav);
  };
  const jump = (el) => { if (el) goTo(el.getBoundingClientRect().top + window.scrollY - 12); };
  const currentIndex = () => {
    const y = window.scrollY + 80;
    let lo = 0;
    for (let i = 0; i < heads.length; i += 1) { if (heads[i].el.offsetTop <= y) lo = i; else break; }
    return lo;
  };
  const paintNav = () => {
    if (!heads.length) return;
    atNode = currentIndex();
    const n = nodes[heads[atNode].node] || {};
    navChapter.textContent = `Chapter ${n.num || heads[atNode].node + 1}`;
    navPrev.disabled = atNode === 0;
    navNext.disabled = atNode >= heads.length - 1;
    nav.hidden = window.scrollY < 200 || !hud.hidden;
  };
  document.getElementById("navTop").addEventListener("click", () => goTo(0));
  navChapter.addEventListener("click", () => jump(heads[atNode].el));
  navPrev.addEventListener("click", () => { if (atNode > 0) jump(heads[atNode - 1].el); });
  navNext.addEventListener("click", () => { if (atNode < heads.length - 1) jump(heads[atNode + 1].el); });
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { paintNav(); ticking = false; });
  }, { passive: true });
  paintNav();
  const navSync = new MutationObserver(paintNav);
  navSync.observe(hud, { attributes: true, attributeFilter: ["hidden"] });

  // ---- contents: chapter opens its sections ---------------------------
  // Tap a chapter number for its sections, tap a section number to land —
  // the same book-chapter-verse drill a reader already knows. Each surface
  // still carries exactly one verb.
  const panel = document.getElementById("secPanel");
  const closePanel = () => { panel.hidden = true; document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on")); };
  const openPanel = (i, cell) => {
    const list = nodeSections[i] || [];
    if (!list.length) return;
    document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on"));
    cell.classList.add("on");
    const n = nodes[i] || {};
    panel.replaceChildren();
    const head = document.createElement("div"); head.className = "sp-head";
    const lbl = document.createElement("span");
    lbl.textContent = `${n.name_en || `Chapter ${n.num || i + 1}`} · ${list.length} ${list.length === 1 ? "section" : "sections"}`;
    head.append(lbl);
    if (n.name_he) { const he2 = document.createElement("span"); he2.className = "sp-he"; he2.lang = "he"; he2.dir = "rtl"; he2.textContent = n.name_he; head.append(he2); }
    const x = document.createElement("button"); x.type = "button"; x.className = "sp-x"; x.textContent = "×";
    x.setAttribute("aria-label", "Close"); x.addEventListener("click", closePanel); head.append(x);
    const grid = document.createElement("div"); grid.className = "sp-grid";
    const top = document.createElement("a"); top.href = `#n${i}`; top.className = "sp-top"; top.textContent = "chapter top";
    top.addEventListener("click", () => { closePanel(); requestAnimationFrame(paintNav); }); grid.append(top);
    list.forEach((sc) => {
      const a = document.createElement("a"); a.href = `#${sc.id}`; a.textContent = sc.label;
      a.addEventListener("click", () => { closePanel(); requestAnimationFrame(paintNav); }); grid.append(a);
    });
    panel.append(head, grid);
    panel.hidden = false;
  };
  document.querySelectorAll("#toc .chs a").forEach((cell, i) => {
    cell.addEventListener("click", (e) => {
      if (!(nodeSections[i] || []).length) return; // nothing to drill into
      e.preventDefault();
      if (cell.classList.contains("on")) { closePanel(); return; }
      openPanel(i, cell);
    });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
})();
</script>
</body>
</html>
