      const lic = document.createElement("span"); lic.className = "lic-chip"; lic.textContent = selected.license; att.append(lic, " ");
      if (selected.source_url) {
        const a = document.createElement("a"); a.href = selected.source_url; a.target = "_blank"; a.rel = "noreferrer";
        a.textContent = "Source"; att.append(a);
      }
      card.append(att);
      const note = document.createElement("p"); note.className = "c-note";
      note.textContent = selected.state === "PROVEN_EDGE"
        ? `Attachment: proven edge (${selected.basis})`
        : `Attachment: suggested reach only — ${selected.basis}; not a proven word edge`;
      card.append(note);
    };
    // Same shape as the readings: ten out front, the rest in a picker. One
    // word here carries a hundred and six.
    const C_SHOWN = 10;
    let cOverflow = null;
    entries.slice(0, C_SHOWN).forEach((e, i) => {
      const p = document.createElement("button"); p.type = "button";
      p.textContent = e.title || `${e.family_en} · ${i + 1}`;
      p.title = `${e.family_en}${e.years && e.years.length ? " · " + e.years.join("–") : ""}`;
      p.setAttribute("aria-pressed", String(e === selected));
      p.addEventListener("click", () => {
        selected = e;
        pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        if (cOverflow) { cOverflow.selectedIndex = 0; cOverflow.classList.remove("on"); }
        p.setAttribute("aria-pressed", "true");
        renderCard();
      });
      pills.append(p);
    });
    hud.append(label, pills);
    if (entries.length > C_SHOWN) {
      const rest = entries.slice(C_SHOWN);
      const wrap = document.createElement("div"); wrap.className = "r-overflow";
      const sel = document.createElement("select"); cOverflow = sel;
      sel.setAttribute("aria-label", `${rest.length} more commentary units`);
      const head = document.createElement("option");
      head.textContent = `${rest.length} more commentary units…`; head.value = ""; sel.append(head);
      rest.forEach((e, j) => {
        const o = document.createElement("option"); o.value = String(j);
        o.textContent = (e.title || `${e.family_en} · ${C_SHOWN + j + 1}`) +
          (e.years && e.years.length ? `  ·  ${e.years[0]}` : "");
        sel.append(o);
      });
      sel.addEventListener("change", () => {
        if (sel.value === "") return;
        selected = rest[Number(sel.value)];
        pills.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", "false"));
        sel.classList.add("on");
        renderCard();
      });
      wrap.append(sel); hud.append(wrap);
    }
    renderCard();
    hud.append(card);
  };

  // One word block, used by the text, by the titles, and by a commentary that
  // came through the chain — same shape, same gloss line, same tap. The gloss
  // table is passed in because a commentary carries its own: it answers from
  // the same catalog, but only for the forms it actually contains.
  const wordBlock = (word, table) => {
    const wb = document.createElement("span");
    wb.className = word.held ? "wb held" : "wb";
    const w = document.createElement("span");
    w.className = "w"; w.lang = "he"; w.dir = "rtl";
    // The block is the occurrence. What is clickable inside it is whatever the
    // ledger says the occurrence contains: one W, or several with a maqaf
    // between them. The maqaf prints and does not open, because it is not a W.
    const regions = word.w || null;
    const regionEls = [];
    if (regions) {
      wb.classList.add("multi");
      const printed = word.s.split("־");
      printed.forEach((piece, i) => {
        if (i) w.append(Object.assign(document.createElement("span"), { className: "mq", textContent: "־" }));
        if (!piece) return;
        const seg = document.createElement("span"); seg.className = "wr"; seg.textContent = piece;
        w.append(seg); regionEls.push(seg);
      });
    } else w.textContent = word.s;
    wb.append(w);
    // The gloss line always exists — words without English keep an empty line
    // so the Hebrew never rides higher than its neighbors, in either mode.
    // A word holding several W reads them joined, the same join a span uses.
    const parts = (regions || (word.k ? [{ k: word.k }] : [])).map((r) => {
      const g = table ? table[r.k] : null;
      return g ? spanJoin(g) : "—";
    });
    const line = parts.filter((p) => p !== "—").length ? parts.join(" + ") : "";
    const ge = document.createElement("span"); ge.className = "g";
    if (line) { ge.textContent = line; ge.title = line; }
    else { ge.textContent = " "; ge.classList.add("bare"); }
    wb.append(ge);
    return { wb, regionEls, glossParts: parts };
  };

  /**
   * Wire an occurrence so that each W inside it opens on its own. One W and
   * the whole block is the target; several and each region is, which is what
   * "one word, both halves clickable" means in the DOM.
   */
  const wireWord = (built, word, bin, unitId, wordPos, opts = {}) => {
    // held by the chain's script rule, or normalizing to nothing at all: no
    // key, no catalog question, no tap
    if (word.held || (!word.w && !word.k)) { built.wb.style.cursor = "default"; return built.wb; }
    const regions = word.w || [{ s: word.s, k: word.k }];
    const targets = built.regionEls.length ? built.regionEls : [built.wb];
    targets.forEach((target, i) => {
      target.addEventListener("click", (ev) => {
        ev.stopPropagation();
        built.regionEls.forEach((r) => r.classList.remove("on"));
        openHud(target, regions[i], unitId, wordPos, {
          ...opts, bin, word, regionIndex: i,
          glossParts: built.regionEls.length ? built.glossParts : null,
          mark: () => { if (built.regionEls.length) target.classList.add("on"); built.wb.classList.add("active"); },
        });
      });
    });
    return built.wb;
  };

  document.addEventListener("click", (e) => {
    if (hud.hidden) return;
    // A handler may have replaced the HUD's contents before this listener
    // runs; the node that was tapped is then detached, and asking whether the
    // HUD still contains it answers no about a tap that came from inside it.
    if (!e.target.isConnected) return;
    if (justDragged) { justDragged = false; return; }
    if (hud.contains(e.target) || e.target.closest(".wb")) return;
    closeHud();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeHud(); });

  // Hebrew / English reader toggle. Same words, same order, same receipts —
  // the English mode flips the flow LTR and lets the gloss line lead.
  const btnHe = document.getElementById("modeHe"), btnEn = document.getElementById("modeEn");
  // Which of the two layers a drag takes. It follows the word the reader
  // presses, so nothing is ever locked away: press a Hebrew word and the drag
  // takes Hebrew, press a reading and it takes readings. The reader you are in
  // only sets which one it starts on.
  const pick = (layer) => {
    document.body.classList.toggle("pick-he", layer !== "en");
    document.body.classList.toggle("pick-en", layer === "en");
  };
  pick("he");
  const setMode = (m) => {
    closeHud();
    // a box fixed at one reader's size is not the other reader's box
    document.querySelectorAll(".he-text .wb .g[style]").forEach((g) => { g.style.height = ""; });
    document.body.classList.toggle("en", m === "en");
    btnHe.classList.toggle("on", m !== "en");
    btnEn.classList.toggle("on", m === "en");
    pick(m === "en" ? "en" : "he");
  };
  btnHe.addEventListener("click", () => setMode("he"));
  btnEn.addEventListener("click", () => setMode("en"));
  if (new URLSearchParams(location.search).get("mode") === "en") setMode("en");

  // Copying is the reader's act. There is no control on this page that writes
  // to a clipboard, because a control doing that is the site redistributing on
  // a press, and what is redistributed carries obligations. A reader who
  // selects a verse and presses copy is doing what a reader does on any page.
  //
  // What the page owes them is a clean line, and its own layout works against
  // that: every word is a block so it can carry its reading underneath, and a
  // browser serializing blocks puts a newline between each one. A verse came
  // out of here as a column of single words.
  //
  // So this rewrites the whitespace of the reader's own selection and nothing
  // else. It adds no text — no licence line, no citation, nothing the reader
  // did not select — and it drops none. Take every space out of what it writes
  // and you have exactly what the browser would have written on its own: the
  // words the reader dragged over, in order, in the provider's characters.
  // It collapses a newline only between blocks of one word-block line, which
  // is the newline this page's own layout invented; everywhere else the
  // browser's shape stands.
  const LINE_HOSTS = ".he-text, .c-inline, .title-row, .c-he";
  const nearestBlock = (node) => {
    let el = node.nodeType === 1 ? node : node.parentElement;
    for (; el && el !== document.body; el = el.parentElement) {
      const d = getComputedStyle(el).display;
      if (d !== "inline" && d !== "contents") return el;
    }
    return document.body;
  };
  const selectionAsText = () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    const root = range.commonAncestorContainer;
    const walk = document.createTreeWalker(
      root.nodeType === 1 ? root : root.parentNode, NodeFilter.SHOW_TEXT,
      { acceptNode: (n) => (range.intersectsNode(n) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT) },
    );
    const groups = [];
    for (let n = walk.nextNode(); n; n = walk.nextNode()) {
      const host = n.parentElement;
      if (!host) continue;
      // a run the page has made unselectable is not in the selection, which is
      // how the browser already treats it — the reading under a Hebrew word is
      // not part of a Hebrew verse
      const cs = getComputedStyle(host);
      if ((cs.userSelect || cs.webkitUserSelect) === "none") continue;
      let t = n.data;
      if (n === range.endContainer && range.endContainer.nodeType === 3) t = t.slice(0, range.endOffset);
      if (n === range.startContainer && range.startContainer.nodeType === 3) t = t.slice(range.startOffset);
      if (!t) continue;
      const block = nearestBlock(n);
      const line = host.closest ? host.closest(LINE_HOSTS) : null;
      const last = groups[groups.length - 1];
      if (last && last.block === block) last.text += t;
      else groups.push({ block, line, text: t });
    }
    let out = "";
    let prev = null;
    for (const g of groups) {
      const t = g.text.replace(/\s+/g, " ").trim();
      if (!t) continue;
      if (out) out += prev && g.line && prev.line === g.line ? " " : "\n";
      out += t;
      prev = g;
    }
    return out.trim() || null;
  };
  document.addEventListener("copy", (e) => {
    // a form field copies itself; nothing here has anything to say about it
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    const text = selectionAsText();
    if (!text || !e.clipboardData) return;
    e.clipboardData.setData("text/plain", text);
    e.preventDefault();
  });

  // The drag takes the layer of the word it starts on. Pressing is what says
  // which — before the drag has begun, so the style that governs it is already
  // in force by the first move. A press that lands on neither leaves the last
  // choice standing.
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest) return;
    if (e.target.closest(".wb .g")) pick("en");
    else if (e.target.closest(".wb .w")) pick("he");
  }, true);

  // A reader who wants the whole verse taps three times, the way they would in
  // any document. Because every word here is its own block, the browser's own
  // triple click stops at one word; this gives the gesture the line it asked
  // for. It selects — it does not copy. The reader still presses copy.
  //
  // The range runs from the first selectable run in the line to the last, not
  // from edge to edge: in the English reader the Hebrew is the unselectable
  // side, so a range starting at the line's edge would start on a run the
  // browser refuses to select, and be thrown away whole.
  const selectableRange = (host) => {
    const walk = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
    let first = null, last = null;
    for (let n = walk.nextNode(); n; n = walk.nextNode()) {
      if (!n.data.trim()) continue;
      const el = n.parentElement;
      if (!el) continue;
      const cs = getComputedStyle(el);
      if ((cs.userSelect || cs.webkitUserSelect) === "none") continue;
      if (!first) first = n;
      last = n;
    }
    if (!first) return null;
    const r = document.createRange();
    r.setStart(first, 0); r.setEnd(last, last.data.length);
    return r;
  };
  // Where the first of the three taps landed. The first tap opens the card,
  // and an open card can stand over the word that opened it — so by the third
  // tap the reader is often clicking the card, in the place they meant the
  // text. Three taps in one place means: give me that line.
  let tapLine = null;
  document.addEventListener("click", (e) => {
    if (!e.target.closest) return;
    if (e.detail <= 1) { tapLine = e.target.closest(LINE_HOSTS); return; }
    if (e.detail < 3) return;
    const host = e.target.closest(LINE_HOSTS) || (e.target.closest("#hud") ? tapLine : null);
    if (!host) return;
    const r = selectableRange(host);
    if (!r) return;
    e.stopPropagation();
    closeHud();
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }, true);

  // contents
  // A title is the section's own words, so it renders exactly like the text:
  // word blocks, gloss beneath where that token's route carries one, HUD on
  // tap. Used in the body only — see the contents note below.
  const titleRow = (toks, raw) => {
    const row = document.createElement("div"); row.className = "title-row";
    if (!toks || !toks.length) { row.lang = "he"; row.dir = "rtl"; row.textContent = raw || ""; return row; }
    toks.forEach((t) => {
      const built = wordBlock(t, zone.gloss);
      // A token the ledger carries without a key is not a word of the text —
      // a canonical numeral reuses a letter's identity to name a number. It
      // reads as part of the title and opens nothing, because the catalog has
      // nothing to say about a word nobody wrote here.
      if (t.k) wireWord(built, t, zone, null, null);
      else built.wb.style.cursor = "default";
      row.append(built.wb, document.createTextNode(" "));
    });
    return row;
  };

  // Contents is navigation, not text: one surface, one verb — every tap here
  // jumps. It carries coordinates, not content: a title is corpus text, and
  // corpus text belongs where it can be tapped and defined. The Hebrew name
  // rides as a hover title only, an access aid like the number itself.
  const nodes = zone.nodes || [];
  if (nodes.length) {
    const tocBody = document.getElementById("tocBody");
    const multiPart = new Set(nodes.map((n) => n.part_num || 1)).size > 1;
    let lastPart = null, chs = null;
    nodes.forEach((n, i) => {
      const partKey = n.part_num || 1;
      if (partKey !== lastPart) {
        lastPart = partKey;
        const partDiv = document.createElement("div"); partDiv.className = "part";
        if (multiPart) { const b = document.createElement("b"); b.textContent = `Part ${partKey}`; partDiv.append(b); }
        chs = document.createElement("div"); chs.className = "chs"; partDiv.append(chs);
        tocBody.append(partDiv);
      }
      const a = document.createElement("a"); a.href = `#n${i}`;
      a.textContent = String(n.num || i + 1);
      // the name and the size live on hover and in the label, where they can
      // be read as sentences — the cell itself stays a coordinate
      const named = [n.name_he, n.sections ? `${n.sections} sections` : ""].filter(Boolean).join(" · ");
      if (named) a.title = named;
      a.setAttribute("aria-label", `${n.name_en || `Chapter ${n.num || i + 1}`}${n.sections ? `, ${n.sections} sections` : ""}`);
      chs.append(a);
    });
    const note = document.createElement("p"); note.className = "toc-note";
    const titled = nodes.some((n) => (n.name_tokens && n.name_tokens.length) || n.name_he);
    note.textContent =
      `${MAJOR_C} numbers${multiPart ? " by part" : ""}. ` +
      (titled
        ? `Titles read in the text; hover a number for its title and size.`
        : `Hover a number for its size. This work carries no title in the ledger, so none is shown.`);
    tocBody.append(note);
    document.getElementById("toc").hidden = false;
  }

  // text — the commentary sidecar (if any) must be in hand before word
  // blocks render, so C chips land on first paint.
  await commentaryReady;
  // Say what the commentary is and where it came from — inside the receipts,
  // not across the masthead. Every section now names its own commentary on its
  // own line, so this is the proof of it, not the announcement of it. It also
  // has to go into the receipts element rather than the masthead's textContent:
  // appending to textContent flattens the element tree and would eat the
  // control that opens it.
  if (commentaryStore && commentaryStore.counts && commentaryStore.counts.attached_sections) {
    const cc = commentaryStore.counts;
    const w0 = (commentaryStore.works || [])[0] || {};
    const full = document.querySelector("#meta .receipts-full");
    if (full) full.textContent +=
      ` · ${cc.attached_sections.toLocaleString()} of ${cc.base_sections.toLocaleString()} sections carry ` +
      `${w0.title || "a commentary"} (${w0.license || "license unrecorded"}), served from the same sealed chain and ` +
      `attached by the coordinates both works already carry`;
  }
  const main = document.getElementById("text");
  const frag = document.createDocumentFragment();
  // ?at=7:14 opens the book at that coordinate. A coordinate is a locator, so
  // one work can hand a reader to another at the same place without either of
  // them claiming anything about the other.
  const openAt = (new URLSearchParams(location.search).get("at") || "").trim();
  const byLabel = new Map();
  let curPart = null, curNode = -1, openedNode = false;
  const sectionEls = [];
  let secIdx = 0;
  const wordAnchored = hasWordAnchoredCommentary();
  // A commentary belongs under the section it comments on. There is one way it
  // is drawn — this one — and two surfaces that turn it on: the book-level
  // button turns every section's on at once, a section's own line turns on
  // just its own. It carries its reference, its licence and the basis of its
  // attachment, because a commentary a reader cannot trace is decoration.
  const inlineBuilt = new WeakSet();
  const buildSectionInline = (sec, el) => {
    if (inlineBuilt.has(el)) return;
    const entries = sectionCommentaryFor(sec.unit);
    if (!entries) return;
    inlineBuilt.add(el);
    for (const e of entries) {
      const p = document.createElement("p"); p.className = "c-inline";
      p.lang = "he"; p.dir = "rtl"; p.hidden = true;
      const w = commentaryWorkOf(e);
      const lab = document.createElement("span"); lab.className = "lab";
      lab.append(`${w.family_en || w.title || e.ref} · ${e.ref}${w.b_n ? ` · ${w.b_n}` : ""} `);
      const lic = document.createElement("span"); lic.className = "lic-chip";
      lic.textContent = w.license || "License unrecorded";
      lab.append(lic);
      p.append(lab);
      (e.words || []).forEach((word) => {
        const b = wordBlock(word, commentaryStore.gloss);
        wireWord(b, word, commentaryStore, null, null);
        p.append(b.wb, document.createTextNode(" "));
      });
      if (!(e.words || []).length) { p.dir = "auto"; p.append(e.text || ""); }
      const note = document.createElement("span"); note.className = "c-att";
      note.textContent = e.state === "PROVEN_EDGE"
        ? `Attachment: ${e.basis === "SEALED_UNIT_COORDINATE_IDENTITY"
            ? "both works are units of the sealed chain and carry the same coordinates — nothing renumbered, nothing inferred"
            : e.basis}`
        : `Attachment: suggested reach only — ${e.basis}; not a proven edge`;
      p.append(note);
      (el.querySelector(".c-slot") || el).append(p);
    }
  };
  // Opening a commentary adds text to the page, which moves everything below
  // it. If the reader is already past that point, the whole page jumps under
  // them. So the section the commentary belongs to is pinned: whatever its
  // distance from the top of the window was before, it is that after. The
  // commentary lands where it was asked for, and closing it lands the same way.
  const holdingSection = (el, fn) => {
    const before = el.getBoundingClientRect().top;
    fn();
    const after = el.getBoundingClientRect().top;
    const drift = after - before;
    if (Math.abs(drift) > 0.5) window.scrollBy(0, drift);
  };
  const toggleSectionInline = (sec, el, want) => {
    buildSectionInline(sec, el);
    const ps = [...el.querySelectorAll(".c-inline")];
    if (!ps.length) return false;
    const on = want === undefined ? ps.some((x) => x.hidden) : want;
    // Pin the line the reader pressed, not the top of the section: the text
    // now opens directly beneath it, so that is the thing that must not move.
    holdingSection(el.querySelector(".c-bar") || el, () => {
      ps.forEach((x) => { x.hidden = !on; });
    });
    return on;
  };
  const nodeSections = {};
  const nodeHeads = [];
  zone.sections.forEach((sec) => {
    const n = nodes[sec.node] || {};
    if (sec.node !== curNode) {
      const partKey = n.part_he || n.part_en || "";
      if (partKey !== curPart) {
        curPart = partKey;
        const ph = document.createElement("div"); ph.className = "part-head";
        // Plain English names the structure — a position and a count, never a
        // translation of the title. The title itself is the Hebrew row below.
        if (n.part_num) { const pen = document.createElement("div"); pen.className = "locator"; pen.textContent = `Part ${n.part_num} · part title`; ph.append(pen); }
        ph.append(titleRow(n.part_tokens, n.part_he));
        frag.append(ph);
      }
      curNode = sec.node;
      const nh = document.createElement("div"); nh.className = "node-head"; nh.id = `n${sec.node}`;
      const loc = document.createElement("span"); loc.className = "locator";
      // "chapter title" names the row underneath. Say it only when there is
      // one — a label pointing at nothing reads as a title we failed to load.
      const hasTitle = (n.name_tokens && n.name_tokens.length) || n.name_he;
      loc.textContent = `${n.name_en || `${MAJOR_C} ${n.num || sec.node + 1}`}` +
        (hasTitle ? ` · ${MAJOR} title` : "") +
        (n.sections ? ` · ${n.sections} ${n.sections === 1 ? MINOR : MINOR + "s"}` : "");
      nh.append(loc);
      nh.append(titleRow(n.name_tokens, n.name_he));
      frag.append(nh); openedNode = true; nodeHeads.push({ node: sec.node, el: nh });
    }
    const s = document.createElement("section"); s.className = "seg";
    s.id = `s${secIdx}`;
    (nodeSections[sec.node] = nodeSections[sec.node] || []).push({ label: sec.label || String(secIdx + 1), id: s.id });
    if (sec.label) byLabel.set(sec.label, s.id);
    secIdx += 1;
    const row = document.createElement("div"); row.className = "seg-row";
    const v = document.createElement("span"); v.className = "vnum"; v.textContent = sec.label || "";
    const parts = String(sec.label || "").split(":");
    v.title = parts.length === 2 ? `${MAJOR_C} ${parts[0]}, ${MINOR} ${parts[1]}` : `${MAJOR_C} ${parts[0]}`;
    row.append(v);
    // name the numbering once per chapter, so a reader meets it before
    // scrolling past four hundred of them
    if (openedNode) {
      const vl = document.createElement("span"); vl.className = "vlabel";
      vl.textContent = (parts.length === 2 ? `${MAJOR} · ${MINOR}` : MINOR) +
        (wordAnchored ? " · c on a word opens the commentary there" : "");
      row.append(vl); openedNode = false;
    }
    if (sec.drift) {
      const d = document.createElement("span"); d.className = "drift-chip";
      d.textContent = `drifts from the sealed count · ${sec.drift.sealed_rows} sealed → ${sec.drift.observed_rows} here`;
      row.append(d);
    }
    // A commentary attached to the whole section gets a line of its own, under
    // the number and the width of the column, carrying the name of the work
    // rather than a letter. It is the section's other text; a letter beside a
    // verse number was the wrong size for that.
    const secCm = sectionCommentaryFor(sec.unit);
    let cbar = null;
    if (secCm) {
      cbar = document.createElement("button"); cbar.type = "button"; cbar.className = "c-bar";
      const fam = secCm.map((e) => commentaryWorkOf(e).family_en || "commentary").join(", ");
      // The glyph stays, because the word-anchored chips still use it and one
      // convention should cover both grains; the name beside it says which
      // work, which a letter never could.
      const g = document.createElement("span"); g.className = "c-glyph";
      g.textContent = "C" + (secCm.length > 1 ? secCm.length : "");
      const nm = document.createElement("span"); nm.className = "c-name"; nm.textContent = fam;
      cbar.append(g, nm);
      cbar.setAttribute("aria-expanded", "false");
      cbar.setAttribute("aria-label", `Commentary on ${sec.label}: ${fam}`);
      cbar.title = `${fam} · ${sec.label}`;
      cbar.addEventListener("click", (e) => {
        e.stopPropagation();
        cbar.setAttribute("aria-expanded", String(toggleSectionInline(sec, s)));
      });
    }
    // The text itself. Each word is a block carrying the Hebrew and its
    // reading, and a space stands between the blocks so a selection that runs
    // across the verse comes out as words rather than one long run.
    const he = document.createElement("p"); he.className = "he-text"; he.lang = "he"; he.dir = "rtl";
    let wIdx = 0;
    sec.words.forEach((word) => {
      const built = wordBlock(word, zone.gloss);
      const myIdx = wIdx; wIdx += 1;
      const cm = commentaryFor(sec.unit, myIdx);
      if (cm && cm.length) {
        const chip = document.createElement("span"); chip.className = "c-chip";
        chip.textContent = "C" + (cm.length > 1 ? cm.length : "");
        built.wb.append(chip);
      }
      wireWord(built, word, zone, sec.unit, myIdx);
      he.append(built.wb, document.createTextNode(" "));
    });
    // The commentary line sits at the foot of the section, immediately above
    // the slot its text lands in. It used to sit under the verse number, a
    // whole verse away from what it opened, so pressing it put the commentary
    // somewhere the reader was not looking.
    const cSlot = document.createElement("div"); cSlot.className = "c-slot";
    // The export row sits after the text, not before it: it is the last thing
    // a reader does with a section, and the first press only tells them what
    // it would carry.
    const xpRow = document.createElement("div"); xpRow.className = "xp-row";
    const xpNote = document.createElement("p"); xpNote.className = "xp-note";
    const lab = document.createElement("span"); lab.className = "xp-lab"; lab.textContent = "export";
    xpRow.append(lab);
    for (const kind of ["he", "en", "both"]) {
      xpRow.append(exportButton(
        kind,
        kind === "he" ? "א" : kind === "en" ? "A" : "א + A",
        xpNote,
        async () => ({ bundles: [await gatherSection(sec, s)], title: `${zone.work} ${sec.label || ""}`.trim() }),
        () => `${slug(zone.work)}-${slug(sec.label || String(secIdx))}-${kind}.md`,
      ));
    }
    xpRow.append(xpNote);
    // The number, the text, the section's other text where it opens, and the
    // one act that hands anything over.
    if (cbar) s.append(row, he, cbar, cSlot, xpRow);
    else s.append(row, he, xpRow);
    sectionEls.push({ sec, el: s });
    frag.append(s);
  });
  main.append(frag);

  // One export for the whole work, after the last section. It reads every
  // record the book stands on, which is the honest cost of a book-sized
  // export, and it says so before it does anything.
  {
    const box = document.createElement("div"); box.id = "bookExport";
    const lab = document.createElement("span"); lab.className = "xp-lab";
    lab.textContent = `export the whole of ${zone.work}`;
    const row = document.createElement("div"); row.className = "xp-row";
    const note = document.createElement("p"); note.className = "xp-note";
    const gatherBook = async () => {
      const bundles = [];
      for (const { sec, el } of sectionEls) bundles.push(await gatherSection(sec, el));
      return { bundles, title: zone.work };
    };
    for (const kind of ["he", "en", "both"]) {
      row.append(exportButton(
        kind,
        kind === "he" ? "א  hebrew" : kind === "en" ? "A  english" : "א + A  both",
        note, gatherBook, () => `${slug(zone.work)}-${kind}.md`,
      ));
    }
    row.append(note);
    box.append(lab, row);
    main.append(box);
  }

  // ---- the commentary layer -------------------------------------------
  // A commentary is not a book of its own. It belongs to the sections it
  // comments on, and a reader who wants to read it should read it there,
  // continuously, rather than opening eight hundred cards. Built once on
  // first use, because it is as many word blocks again as the text.
  const cWorks = commentaryStore && commentaryStore.works ? commentaryStore.works : [];
  if (cWorks.length && commentaryStore.counts && commentaryStore.counts.attached_sections) {
    const layerBtn = document.getElementById("layerC");
    const name = cWorks.map((w) => w.family_en || w.title).join(" · ");
    layerBtn.textContent = name;
    layerBtn.title = `Read ${name} beneath each ${MINOR}`;
    layerBtn.hidden = false;
    let on = false;
    layerBtn.addEventListener("click", () => {
      on = !on;
      layerBtn.classList.toggle("on", on);
      // 817 sections opening at once moves the page by the height of a book.
      // Pin whichever section the reader is actually looking at.
      const seen = sectionEls.find(({ el }) => el.getBoundingClientRect().bottom > 0) || sectionEls[0];
      holdingSection(seen.el, () => {
        for (const { sec, el } of sectionEls) {
          buildSectionInline(sec, el);
          el.querySelectorAll(".c-inline").forEach((x) => { x.hidden = !on; });
        }
      });
      document.querySelectorAll(".c-bar").forEach((b) => b.setAttribute("aria-expanded", String(on)));
    });
  }

  // ---- getting around -------------------------------------------------
  // One floating bar rather than controls on every section: at 1,533
  // sections per book, per-section chrome is noise. The bar knows which
  // chapter you are in and stands down whenever the HUD is open, so only
  // one thing ever asks for a tap.
  const nav = document.getElementById("nav");
  const navChapter = document.getElementById("navChapter");
  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");
  // offsets are measured once — nothing reflows after paint, because the
  // Hebrew never moves — so position lookups stay pure arithmetic on a page
  // that can run to millions of pixels
  const heads = nodeHeads.map((h) => ({ node: h.node, el: h.el, top: h.el.offsetTop }));
  let atNode = 0;
  // A book this long runs to millions of pixels; smooth scrolling across
  // that distance stalls, so only short hops animate.
  if (openAt && byLabel.has(openAt)) {
    const target = document.getElementById(byLabel.get(openAt));
    if (target) {
      window.scrollTo(0, target.getBoundingClientRect().top + window.scrollY - 80);
      target.querySelector(".vnum")?.classList.add("at");
    }
  }
  const goTo = (top) => {
    const d = Math.abs(top - window.scrollY);
    window.scrollTo({ top, behavior: d > 2500 ? "auto" : "smooth" });
    setTimeout(paintNav, 0);
  };
  const jump = (el) => { if (el) goTo(el.getBoundingClientRect().top + window.scrollY - 12); };
  const currentIndex = () => {
    const y = window.scrollY + 80;
    let lo = 0;
    for (let i = 0; i < heads.length; i += 1) { if (heads[i].top <= y) lo = i; else break; }
    return lo;
  };
  const paintNav = () => {
    if (!heads.length) return;
    atNode = currentIndex();
    const n = nodes[heads[atNode].node] || {};
    navChapter.textContent = `Chapter ${n.num || heads[atNode].node + 1}`;
    navPrev.disabled = atNode === 0;
    navNext.disabled = atNode >= heads.length - 1;
    nav.hidden = window.scrollY < 200 || !hud.hidden;
  };
  document.getElementById("navTop").addEventListener("click", () => goTo(0));
  navChapter.addEventListener("click", () => jump(heads[atNode].el));
  navPrev.addEventListener("click", () => { if (atNode > 0) jump(heads[atNode - 1].el); });
  navNext.addEventListener("click", () => { if (atNode < heads.length - 1) jump(heads[atNode + 1].el); });
  // a page this size can starve requestAnimationFrame, so the bar repaints
  // on a plain time throttle and on arrival at any anchor
  let lastPaint = 0;
  window.addEventListener("scroll", () => {
    const t = performance.now();
    if (t - lastPaint < 120) return;
    lastPaint = t; paintNav();
  }, { passive: true });
  window.addEventListener("hashchange", () => setTimeout(paintNav, 0));
  paintNav();
  const navSync = new MutationObserver(paintNav);
  navSync.observe(hud, { attributes: true, attributeFilter: ["hidden"] });

  // ---- contents: chapter opens its sections ---------------------------
  // Tap a chapter number for its sections, tap a section number to land —
  // the same book-chapter-verse drill a reader already knows. Each surface
  // still carries exactly one verb.
  const panel = document.getElementById("secPanel");
  const closePanel = () => { panel.hidden = true; document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on")); };
  const openPanel = (i, cell) => {
    const list = nodeSections[i] || [];
    if (!list.length) return;
    document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on"));
    cell.classList.add("on");
    const n = nodes[i] || {};
    panel.replaceChildren();
    const head = document.createElement("div"); head.className = "sp-head";
    const lbl = document.createElement("span");
    lbl.textContent = `${n.name_en || `Chapter ${n.num || i + 1}`} · ${list.length} ${list.length === 1 ? "section" : "sections"}`;
    head.append(lbl);
    if (n.name_he) { const he2 = document.createElement("span"); he2.className = "sp-he"; he2.lang = "he"; he2.dir = "rtl"; he2.textContent = n.name_he; head.append(he2); }
    const x = document.createElement("button"); x.type = "button"; x.className = "sp-x"; x.textContent = "×";
    x.setAttribute("aria-label", "Close"); x.addEventListener("click", closePanel); head.append(x);
    const grid = document.createElement("div"); grid.className = "sp-grid";
    const top = document.createElement("a"); top.href = `#n${i}`; top.className = "sp-top"; top.textContent = "chapter top";
    top.addEventListener("click", () => { closePanel(); setTimeout(paintNav, 0); }); grid.append(top);
    list.forEach((sc) => {
      const a = document.createElement("a"); a.href = `#${sc.id}`; a.textContent = sc.label;
      a.addEventListener("click", () => { closePanel(); setTimeout(paintNav, 0); }); grid.append(a);
    });
    panel.append(head, grid);
    panel.hidden = false;
  };
  document.querySelectorAll("#toc .chs a").forEach((cell, i) => {
    cell.addEventListener("click", (e) => {
      if (!(nodeSections[i] || []).length) return; // nothing to drill into
      e.preventDefault();
      if (cell.classList.contains("on")) { closePanel(); return; }
      openPanel(i, cell);
    });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
})();
</script>
</body>
</html>
