<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone reader · The Tabernacle</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #081018; color: #e8dcc0; font: 16px/1.6 Georgia, serif; }
  header { padding: 1.1rem 1.4rem 0.7rem; border-bottom: 1px solid #1d3347; }
  header h1 { margin: 0; font-size: 1.4rem; color: #f2e7c9; }
  header h1 span { font-size: 1.6rem; margin-inline-start: 0.5rem; }
  header p { margin: 0.3rem 0 0; font-size: 0.85rem; opacity: 0.75; }
  header a { color: #9cc3e5; }
  main { max-width: 46rem; margin: 0 auto; padding: 1.2rem 1.4rem 4rem; }
  section { margin: 0 0 1.4rem; }
  section > .unit { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: #b8a77d; opacity: 0.7; margin-bottom: 0.3rem; direction: ltr; text-align: left; }
  .he { direction: rtl; text-align: right; font-size: 1.45rem; line-height: 2.1; }
  .w { cursor: pointer; border-bottom: 1px dashed transparent; }
  .w:hover { color: #ffe08a; border-bottom-color: #6a5a33; }
  .w.held { opacity: 0.45; cursor: default; }
  .w.active { color: #f0c96a; border-bottom: 1px solid #f0c96a; }
  /* The HUD floats. The Hebrew never moves — law of the house. */
  #hud { position: fixed; z-index: 70; max-width: 22rem; width: min(22rem, 92vw); max-height: 55vh;
    overflow-y: auto; background: #0d1b26; border: 1px solid #2c4a63; border-radius: 0.6rem;
    padding: 0.8rem 1rem; box-shadow: 0 12px 34px rgba(0,0,0,.55); }
  #hud[hidden] { display: none; }
  #hud .head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
  #hud .head b { font-size: 1.5rem; color: #f4ead0; }
  #hud .head button { background: none; border: 0; color: #9cc3e5; font-size: 1.1rem; cursor: pointer; }
  #hud p { margin: 0.4rem 0; }
  #hud .att { opacity: 0.72; font-size: 0.8rem; }
  #hud .att a { color: #9cc3e5; }
  .lic-chip { display: inline-block; margin-inline-start: 0.45rem; padding: 0.02rem 0.45rem;
    border-radius: 999px; background: #12314a; color: #9cc3e5; font-size: 0.72rem; }
  footer { max-width: 46rem; margin: 0 auto; padding: 1rem 1.4rem 2rem; font-size: 0.76rem;
    opacity: 0.6; border-top: 1px solid #1d3347; direction: ltr; text-align: left; }
</style>
</head>
<body>
<header>
  <h1 id="workTitle">Zone reader</h1>
  <p id="meta">Loading the zone…</p>
  <p><a href="genesis-book-reader-v4.html">← Genesis reader</a> · <a href="dictionary.html">Dictionary</a></p>
</header>
<main id="text"></main>
<div id="hud" hidden></div>
<footer id="prov"></footer>
<script>
(async () => {
  const unpack = async (res) =>
    JSON.parse(await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text());
  const licenseName = (posture) => {
    const v = String(posture || "").toLowerCase();
    if (!v) return "License unrecorded";
    if (v.startsWith("cc0")) return "CC0";
    if (/_nc(?:_|$)/u.test(v)) return /_sa(?:_|$)/u.test(v) ? "CC BY-NC-SA" : "CC BY-NC";
    if (v.includes("by_sa") || v.includes("gfdl")) return "CC BY-SA";
    if (v.startsWith("public_domain")) return "Public Domain";
    if (v.startsWith("cc_by") || v.includes("wordnet")) return "CC BY";
    return posture;
  };
  let zone, index;
  try {
    [zone, index] = await Promise.all([
      fetch("data/zones/orot.bin").then(unpack),
      fetch("data/route-store/index.json").then((r) => r.json()),
    ]);
  } catch {
    document.getElementById("meta").textContent =
      "No book is published on this page yet — no walk has landed. The page takes its name from the zone when one arrives; nothing is shown, and nothing is named, that has not come through the pipeline.";
    return;
  }
  document.getElementById("workTitle").textContent = zone.work;
  document.title = `${zone.work} · The Tabernacle`;
  const ac = zone.emitted_from.acquisition, oc = zone.emitted_from.identity_oracle;
  document.getElementById("meta").textContent =
    `${zone.counts.words.toLocaleString()} words · ${zone.counts.sections.toLocaleString()} sections · ` +
    `Hebrew text: ${ac.hebrew_version} via Sefaria, license ${ac.hebrew_license_seen} (seen live on every payload) · ` +
    `${zone.counts.verified_units} of ${zone.counts.sections} sections verified word-for-word in count against the sealed corpus allocation` +
    `${zone.counts.drifted_units ? `; ${zone.counts.drifted_units} drift from it and are marked` : ""} · ` +
    `every word answers from the live route store`;
  document.getElementById("prov").textContent =
    `${zone.rule_id} · route: ${zone.route} · identity oracle ${oc.bridge_sha256.slice(0, 16)}… ` +
    `(416 units, C0 ${oc.first_c0_numeric_id.toLocaleString()}–${oc.last_c0_numeric_id.toLocaleString()}) · ` +
    `payload sha ${ac.payload_sha256_transferred.slice(0, 16)}… · ${zone.emitted_from.license_receipts.work_activation} · ` +
    `the installed terminal reader does not yet carry this span (partial-rebuild gap); this page runs the acquisition route, ` +
    `fetched from the same source and version the corpus receipts name, until a sealed generation includes the book.`;

  const hud = document.getElementById("hud");
  const shardCache = new Map();
  const routesFor = async (key) => {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(key));
    const shard = new Uint8Array(digest)[0].toString(16).padStart(2, "0");
    if (!shardCache.has(shard)) {
      shardCache.set(shard, fetch(`data/route-store/shards/${shard}.bin`).then(unpack).catch(() => null));
    }
    const data = await shardCache.get(shard);
    return data ? data[key] : null;
  };
  let activeEl = null;
  const closeHud = () => { hud.hidden = true; hud.replaceChildren(); activeEl?.classList.remove("active"); activeEl = null; };
  const openHud = async (el, word) => {
    closeHud();
    activeEl = el; el.classList.add("active");
    const rect = el.getBoundingClientRect();
    hud.style.top = Math.min(window.innerHeight - 60, rect.bottom + 8) + "px";
    hud.style.left = Math.max(8, Math.min(window.innerWidth - Math.min(352, window.innerWidth * 0.92) - 8, rect.left - 100)) + "px";
    hud.hidden = false;
    const head = document.createElement("div"); head.className = "head";
    const b = document.createElement("b"); b.lang = "he"; b.dir = "rtl"; b.textContent = word.s;
    const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", "Close"); x.addEventListener("click", closeHud);
    head.append(b, x);
    const status = document.createElement("p"); status.textContent = "Fetching one shard…";
    hud.replaceChildren(head, status);
    const routes = await routesFor(word.k);
    if (!routes) {
      status.textContent = "No exact route in the catalog for this form. Exact spellings only — nothing folded, nothing guessed.";
      return;
    }
    hud.removeChild(status);
    routes.forEach(([rank, routeText, definitionText, mId, year]) => {
      const m = index.m_sources[mId];
      if (!m) return;
      const p = document.createElement("p");
      const rb = document.createElement("b"); rb.textContent = routeText; p.append(rb);
      const lic = document.createElement("span"); lic.className = "lic-chip"; lic.textContent = licenseName(m.licensePosture); p.append(lic);
      if (definitionText && definitionText !== routeText) p.append(` — ${definitionText}`);
      const att = document.createElement("p"); att.className = "att";
      const yearLabel = !year || year === "S_NO_SOURCE_YEAR" ? "source year not supplied" : year;
      att.append(`${m.label} · ${yearLabel} · `);
      if (/^https?:\/\//u.test(m.licensePointer)) {
        const a = document.createElement("a"); a.href = m.licensePointer; a.target = "_blank"; a.rel = "noreferrer"; a.textContent = "License terms"; att.append(a);
      } else att.append(`record: ${m.licensePointer}`);
      hud.append(p, att);
    });
  };
  document.addEventListener("click", (e) => { if (!hud.hidden && !hud.contains(e.target) && !e.target.closest(".w")) closeHud(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeHud(); });

  const main = document.getElementById("text");
  const frag = document.createDocumentFragment();
  zone.sections.forEach((sec) => {
    const s = document.createElement("section");
    const u = document.createElement("div"); u.className = "unit";
    u.textContent = sec.drift
      ? `${sec.unit} · drifts from the sealed count (${sec.drift.sealed_rows} sealed → ${sec.drift.observed_rows} here)`
      : sec.unit;
    const he = document.createElement("p"); he.className = "he"; he.lang = "he"; he.dir = "rtl";
    sec.words.forEach((word, i) => {
      const span = document.createElement("span");
      span.className = word.held ? "w held" : "w";
      span.textContent = word.s;
      if (!word.held) span.addEventListener("click", () => openHud(span, word));
      he.append(span, document.createTextNode(" "));
    });
    s.append(u, he);
    frag.append(s);
  });
  main.append(frag);
})();
</script>
</body>
</html>
