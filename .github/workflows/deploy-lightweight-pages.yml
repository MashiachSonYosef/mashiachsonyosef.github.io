            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in aggadat-bereshit alphabet-of-ben-sira avot-derabbi-natan avot-derabbi-natan-recension-b beur-haradal-on-pirkei-derabbi-eliezer beur-hareem-on-midrash-lekach-tov chafetz-chaim-on-sifra eikhah-rabbah ein-yaakov etz-yosef-on-bamidbar-rabbah etz-yosef-on-bereishit-rabbah etz-yosef-on-devarim-rabbah etz-yosef-on-eichah-rabbah etz-yosef-on-esther-rabbah etz-yosef-on-kohelet-rabbah etz-yosef-on-ruth-rabbah etz-yosef-on-shemot-rabbah etz-yosef-on-shir-hashirim-rabbah etz-yosef-on-vayikra-rabbah kohelet-rabbah maharzu-hakatzar-on-bereshit-rabbah matnot-kehunah-on-bamidbar-rabbah matnot-kehunah-on-bereshit-rabbah matnot-kehunah-on-devarim-rabbah matnot-kehunah-on-eichah-rabbah matnot-kehunah-on-esther-rabbah matnot-kehunah-on-kohelet-rabbah matnot-kehunah-on-ruth-rabbah matnot-kehunah-on-shemot-rabbah matnot-kehunah-on-shir-hashirim-rabbah matnot-kehunah-on-vayikra-rabbah midrash-aggadah midrash-bechiddush-on-pesach-haggadah midrash-haittamari midrash-lekach-tov midrash-lekach-tov-on-ecclesiastes midrash-lekach-tov-on-esther midrash-lekach-tov-on-lamentations midrash-lekach-tov-on-ruth midrash-lekach-tov-on-song-of-songs midrash-pinchas midrash-sekhel-tov midrash-shmuel midrash-shmuel-on-avot midrash-tanchuma midrash-tanchuma-buber midrash-tannaim-on-deuteronomy midrash-tehillim midrash-yelamdenu-selections-from-yalkut-talmud-torah mishnat-derabbi-eliezer-on-eichah-rabbah mishnat-derabbi-eliezer-on-ruth-rabbah mishnat-rabbi-eliezer notes-and-corrections-on-midrash-aggadah notes-and-corrections-on-midrash-lekach-tov notes-and-corrections-on-midrash-lekach-tov-on-esther otzar-midrashim par-echad-on-pirkei-derabbi-eliezer perush-maharzu-on-bamidbar-rabbah perush-maharzu-on-bereshit-rabbah perush-maharzu-on-devarim-rabbah perush-maharzu-on-eichah-rabbah perush-maharzu-on-esther-rabbah perush-maharzu-on-kohelet-rabbah perush-maharzu-on-ruth-rabbah perush-maharzu-on-shemot-rabbah perush-maharzu-on-shir-hashirim-rabbah perush-maharzu-on-vayikra-rabbah pesikta-derav-kahana pesikta-rabbati pirkei-avot pirkei-derabbi-eliezer raavad-on-sifra rashi-on-bereshit-rabbah ruth-rabbah seder-olam-rabbah seder-olam-zutta sefer-hayashar-midrash shir-hashirim-rabbah sifrei-aggadah-on-esther sifrei-bamidbar sifrei-devarim tanna-debei-eliyahu-rabbah tanna-debei-eliyahu-zuta tractate-derekh-eretz-rabbah tractate-derekh-eretz-zuta tractate-kallah tractate-semachot tractate-soferim yedei-moshe-on-bereshit-rabbah yedei-moshe-on-devarim-rabbah yedei-moshe-on-kohelet-rabbah yedei-moshe-on-shemot-rabbah yedei-moshe-on-shir-hashirim-rabbah yedei-moshe-on-vayikra-rabbah yefeh-anaf-on-eichah-rabbah yefeh-anaf-on-esther-rabbah yefeh-anaf-on-ruth-rabbah yefeh-kol-on-shir-hashirim-rabbah yefeh-toar-on-bamidbar-rabbah yefeh-toar-on-bereshit-rabbah yefeh-toar-on-devarim-rabbah yefeh-toar-on-shemot-rabbah yefeh-toar-on-vayikra-rabbah; do
            mkdir -p ".site/midrash/$work"
            cp -a "midrash/$work/index.html" ".site/midrash/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          cp -a data/lexical/orot.manifest.json .site/data/lexical/
          cp -a data/lexical/orot-chunks .site/data/lexical/
          cp -a data/lexical/occurrences/orot.json .site/data/lexical/occurrences/
          cp -a data/lexical/source-layers .site/data/lexical/
          cp -a data/definitions/hud-route-lookup .site/data/definitions/
          cp -a data/definitions/hud-route-lookup-daniel .site/data/definitions/
          cp -a data/public-lexical/by-work/daniel-token-claims-min60.csv .site/data/public-lexical/by-work/
          cp -a data/public-hud/orot .site/data/public-hud/
          du -sh .site
          find .site -type f -printf '%s %p\n' | sort -nr | head -20
          find .site -type f -print
          if find .site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 grep -n -E 'Clicked Hebrew form|Best actual hit|data-hud-renderings|data-hud-breakdown|Potential options|No lexical entry yet\.|lexical-fields'; then
            echo "Old HUD marker found in Pages artifact; refusing deployment." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
