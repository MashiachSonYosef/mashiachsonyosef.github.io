            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in bartenura-on-pirkei-avot boaz-on-mishnah-arakhin boaz-on-mishnah-bava-metzia boaz-on-mishnah-beitzah boaz-on-mishnah-bekhorot boaz-on-mishnah-berakhot boaz-on-mishnah-bikkurim boaz-on-mishnah-chullin boaz-on-mishnah-demai boaz-on-mishnah-eduyot boaz-on-mishnah-eruvin boaz-on-mishnah-gittin boaz-on-mishnah-kelim boaz-on-mishnah-keritot boaz-on-mishnah-kiddushin boaz-on-mishnah-kilayim boaz-on-mishnah-kinnim boaz-on-mishnah-maaser-sheni boaz-on-mishnah-makkot boaz-on-mishnah-megillah boaz-on-mishnah-meilah boaz-on-mishnah-middot boaz-on-mishnah-mikvaot boaz-on-mishnah-moed-katan boaz-on-mishnah-negaim boaz-on-mishnah-niddah boaz-on-mishnah-oholot boaz-on-mishnah-orlah boaz-on-mishnah-parah boaz-on-mishnah-peah boaz-on-mishnah-pesachim boaz-on-mishnah-rosh-hashanah boaz-on-mishnah-shabbat boaz-on-mishnah-sheviit boaz-on-mishnah-taanit boaz-on-mishnah-tahorot boaz-on-mishnah-tamid boaz-on-mishnah-temurah boaz-on-mishnah-terumot boaz-on-mishnah-yoma boaz-on-mishnah-zevachim boaz-on-pirkei-avot mishnah-arakhin mishnah-avodah-zarah mishnah-bava-batra mishnah-bava-kamma mishnah-bava-metzia mishnah-beitzah mishnah-bekhorot mishnah-berakhot mishnah-bikkurim mishnah-chagigah mishnah-challah mishnah-chullin mishnah-demai mishnah-eduyot mishnah-eruvin mishnah-gittin mishnah-horayot mishnah-kelim mishnah-keritot mishnah-ketubot mishnah-kiddushin mishnah-kilayim mishnah-kinnim mishnah-maaser-sheni mishnah-maasrot mishnah-makhshirin mishnah-makkot mishnah-megillah mishnah-meilah mishnah-menachot mishnah-middot mishnah-mikvaot mishnah-moed-katan mishnah-nazir mishnah-nedarim mishnah-negaim mishnah-niddah mishnah-oholot mishnah-orlah mishnah-parah mishnah-peah mishnah-pesachim mishnah-rosh-hashanah mishnah-sanhedrin mishnah-shabbat mishnah-shekalim mishnah-sheviit mishnah-shevuot mishnah-sotah mishnah-sukkah mishnah-taanit mishnah-tahorot mishnah-tamid mishnah-temurah mishnah-terumot mishnah-tevul-yom mishnah-yadayim mishnah-yevamot mishnah-yoma mishnah-zavim mi