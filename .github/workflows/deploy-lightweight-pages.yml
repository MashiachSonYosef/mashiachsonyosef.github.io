name: Deploy Lightweight Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lightweight-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight artifact
        run: |
          rm -rf .site
          mkdir -p .site/orot \
            .site/halakhah \
            .site/tanakh/amos \
            .site/tanakh/daniel \
            .site/tanakh/deuteronomy \
            .site/tanakh/ecclesiastes \
            .site/tanakh/esther \
            .site/tanakh/exodus \
            .site/tanakh/ezra \
            .site/tanakh/genesis \
            .site/tanakh/habakkuk \
            .site/tanakh/haggai \
            .site/tanakh/hosea \
            .site/tanakh/i-chronicles \
            .site/tanakh/i-kings \
            .site/tanakh/i-samuel \
            .site/tanakh/ibn-ezra-on-deuteronomy \
            .site/tanakh/ibn-ezra-on-exodus \
            .site/tanakh/ii-chronicles \
            .site/tanakh/ii-kings \
            .site/tanakh/ii-samuel \
            .site/tanakh/isaiah \
            .site/tanakh/jeremiah \
            .site/tanakh/jonah \
            .site/tanakh/joel \
            .site/tanakh/joshua \
            .site/tanakh/judges \
            .site/tanakh/job \
            .site/tanakh/lamentations \
            .site/tanakh/leviticus \
            .site/tanakh/malachi \
            .site/tanakh/micah \
            .site/tanakh/nahum \
            .site/tanakh/nehemiah \
            .site/tanakh/numbers \
            .site/tanakh/obadiah \
            .site/tanakh/proverbs \
            .site/tanakh/psalms \
            .site/tanakh/ruth \
            .site/tanakh/song-of-songs \
            .site/tanakh/zechariah \
            .site/tanakh/zephaniah \
            .site/assets/css \
            .site/assets/js \
            .site/data/definitions \
            .site/data/lexical \
            .site/data/lexical/crossmatches \
            .site/data/lexical/occurrences \
            .site/data/lexical/reader-hints \
            .site/data/public-lexical/by-work \
            .site/data/public-hud
          cp -a .nojekyll 404.html index.html .site/
          cp -a assets/css/reader-workbench.css .site/assets/css/
          cp -a assets/js/reader-workbench.js .site/assets/js/
          cp -a orot/index.html .site/orot/
          for work in maamar-hador midbar-shur musar-avikha orot-ha-torah; do
            mkdir -p ".site/rav-kook/$work"
            cp -a "rav-kook/$work/index.html" ".site/rav-kook/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in against-apion ben-sira book-of-jubilees book-of-judith book-of-tobit letter-of-aristeas megillat-taanit the-book-of-maccabees-i the-book-of-maccabees-ii the-book-of-susanna the-testaments-of-the-twelve-patriarchs the-war-of-the-jews the-wisdom-of-solomon; do
            mkdir -p ".site/second-temple/$work"
            cp -a "second-temple/$work/index.html" ".site/second-temple/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in jerusalem-talmud-taanit; do
            mkdir -p ".site/talmud/$work"
            cp -a "talmud/$work/index.html" ".site/talmud/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in aramaic-targum-to-ecclesiastes aramaic-targum-to-esther aramaic-targum-to-job aramaic-targum-to-lamentations aramaic-targum-to-proverbs aramaic-targum-to-psalms aramaic-targum-to-ruth aramaic-targum-to-song-of-songs targum-jerusalem targum-jonathan-on-amos targum-jonathan-on-deuteronomy targum-jonathan-on-exodus targum-jonathan-on-ezekiel targum-jonathan-on-genesis targum-jonathan-on-habakkuk targum-jonathan-on-haggai targum-jonathan-on-hosea targum-jonathan-on-i-kings targum-jonathan-on-i-samuel targum-jonathan-on-ii-kings targum-jonathan-on-ii-samuel targum-jonathan-on-isaiah targum-jonathan-on-jeremiah targum-jonathan-on-joel targum-jonathan-on-jonah targum-jonathan-on-joshua targum-jonathan-on-judges targum-jonathan-on-leviticus targum-jonathan-on-malachi targum-jonathan-on-micah targum-jonathan-on-nahum targum-jonathan-on-numbers targum-jonathan-on-obadiah targum-jonathan-on-zechariah targum-jonathan-on-zephaniah targum-of-i-chronicles targum-of-ii-chronicles; do
