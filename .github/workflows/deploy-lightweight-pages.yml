name: Deploy Lightweight Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nojekyll
            /404.html
            /index.html
            /tanakh/daniel/index.html
            /data/public-lexical/by-work/daniel-token-claims-min60.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight artifact
        run: |
          rm -rf .site
          mkdir -p .site/tanakh/daniel \
            .site/data/public-lexical/by-work
          cp -a .nojekyll 404.html index.html .site/
          cp -a tanakh/daniel/index.html .site/tanakh/daniel/
          cp -a data/public-lexical/by-work/daniel-token-claims-min60.csv .site/data/public-lexical/by-work/
          du -sh .site
          find .site -type f -printf '%s %p\n' | sort -nr | head -20
          find .site -type f -print
          if find .site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 grep -n -E 'Clicked Hebrew form|Best actual hit|data-hud-renderings|data-hud-breakdown|Potential options|No lexical entry yet\.|lexical-fields'; then
            echo "Old HUD marker found in Pages artifact; refusing deployment." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
