name: Deploy Lightweight Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nojekyll
            /404.html
            /index.html
            /assets/css/reader-workbench.css
            /assets/js/reader-workbench.js
            /orot/index.html
            /tanakh/amos/index.html
            /tanakh/daniel/index.html
            /tanakh/deuteronomy/index.html
            /tanakh/esther/index.html
            /tanakh/exodus/index.html
            /tanakh/ezra/index.html
            /tanakh/genesis/index.html
            /tanakh/hosea/index.html
            /tanakh/i-kings/index.html
            /tanakh/i-samuel/index.html
            /tanakh/ii-kings/index.html
            /tanakh/ii-samuel/index.html
            /tanakh/isaiah/index.html
            /tanakh/jeremiah/index.html
            /tanakh/jonah/index.html
            /tanakh/joel/index.html
            /tanakh/joshua/index.html
            /tanakh/judges/index.html
            /tanakh/leviticus/index.html
            /tanakh/malachi/index.html
            /tanakh/nehemiah/index.html
            /tanakh/numbers/index.html
            /tanakh/obadiah/index.html
            /tanakh/ruth/index.html
            /tanakh/zechariah/index.html
            /tanakh/zephaniah/index.html
            /data/definitions/hud-route-lookup
            /data/definitions/hud-route-lookup-daniel
            /data/lexical/amos.manifest.json
            /data/lexical/amos-chunks
            /data/lexical/daniel.manifest.json
            /data/lexical/daniel-chunks
            /data/lexical/deuteronomy.manifest.json
            /data/lexical/deuteronomy-chunks
            /data/lexical/esther.manifest.json
            /data/lexical/esther-chunks
            /data/lexical/exodus.manifest.json
            /data/lexical/exodus-chunks
            /data/lexical/ezra.manifest.json
            /data/lexical/ezra-chunks
            /data/lexical/genesis.manifest.json
            /data/lexical/genesis-chunks
            /data/lexical/hosea.manifest.json
            /data/lexical/hosea-chunks
            /data/lexical/i-kings.manifest.json
            /data/lexical/i-kings-chunks
            /data/lexical/i-samuel.manifest.json
            /data/lexical/i-samuel-chunks
            /data/lexical/ii-kings.manifest.json
            /data/lexical/ii-kings-chunks
            /data/lexical/ii-samuel.manifest.json
            /data/lexical/ii-samuel-chunks
            /data/lexical/isaiah.manifest.json
            /data/lexical/isaiah-chunks
            /data/lexical/jeremiah.manifest.json
            /data/lexical/jeremiah-chunks
            /data/lexical/jonah.manifest.json
            /data/lexical/jonah-chunks
            /data/lexical/joel.manifest.json
            /data/lexical/joel-chunks
            /data/lexical/joshua.manifest.json
            /data/lexical/joshua-chunks
            /data/lexical/judges.manifest.json
            /data/lexical/judges-chunks
            /data/lexical/leviticus.manifest.json
            /data/lexical/leviticus-chunks
            /data/lexical/malachi.manifest.json
            /data/lexical/malachi-chunks
            /data/lexical/nehemiah.manifest.json
            /data/lexical/nehemiah-chunks
            /data/lexical/numbers.manifest.json
            /data/lexical/numbers-chunks
            /data/lexical/obadiah.manifest.json
            /data/lexical/obadiah-chunks
            /data/lexical/orot.manifest.json
            /data/lexical/orot-chunks
            /data/lexical/ruth.manifest.json
            /data/lexical/ruth-chunks
            /data/lexical/zechariah.manifest.json
            /data/lexical/zechariah-chunks
            /data/lexical/zephaniah.manifest.json
            /data/lexical/zephaniah-chunks
            /data/lexical/occurrences/amos.json
            /data/lexical/occurrences/daniel.json
            /data/lexical/occurrences/deuteronomy.json
            /data/lexical/occurrences/esther.json
            /data/lexical/occurrences/exodus.json
            /data/lexical/occurrences/ezra.json
            /data/lexical/occurrences/genesis.json
            /data/lexical/occurrences/hosea.json
            /data/lexical/occurrences/i-kings.json
            /data/lexical/occurrences/i-samuel.json
            /data/lexical/occurrences/ii-kings.json
            /data/lexical/occurrences/ii-samuel.json
            /data/lexical/occurrences/isaiah.json
            /data/lexical/occurrences/jeremiah.json
            /data/lexical/occurrences/jonah.json
            /data/lexical/occurrences/joel.json
            /data/lexical/occurrences/joshua.json
            /data/lexical/occurrences/judges.json
            /data/lexical/occurrences/leviticus.json
            /data/lexical/occurrences/malachi.json
            /data/lexical/occurrences/nehemiah.json
            /data/lexical/occurrences/numbers.json
            /data/lexical/occurrences/obadiah.json
            /data/lexical/occurrences/orot.json
            /data/lexical/occurrences/ruth.json
            /data/lexical/occurrences/zechariah.json
            /data/lexical/occurrences/zephaniah.json
            /data/lexical/reader-hints
            /data/lexical/crossmatches/daniel.json
            /data/public-lexical/by-work/daniel-token-claims-min60.csv
            /data/lexical/source-layers
            /data/public-hud/amos
            /data/public-hud/deuteronomy
            /data/public-hud/exodus
            /data/public-hud/genesis
            /data/public-hud/jonah
            /data/public-hud/leviticus
            /data/public-hud/numbers
            /data/public-hud/orot
            /data/public-hud/ruth
            /data/public-hud/zechariah
            /data/public-hud/zephaniah

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight artifact
        run: |
          rm -rf .site
          mkdir -p .site/orot \
            .site/tanakh/amos \
            .site/tanakh/daniel \
            .site/tanakh/deuteronomy \
            .site/tanakh/esther \
            .site/tanakh/exodus \
            .site/tanakh/ezra \
            .site/tanakh/genesis \
            .site/tanakh/hosea \
            .site/tanakh/i-kings \
            .site/tanakh/i-samuel \
            .site/tanakh/ii-kings \
            .site/tanakh/ii-samuel \
            .site/tanakh/isaiah \
            .site/tanakh/jeremiah \
            .site/tanakh/jonah \
            .site/tanakh/joel \
            .site/tanakh/joshua \
            .site/tanakh/judges \
            .site/tanakh/leviticus \
            .site/tanakh/malachi \
            .site/tanakh/nehemiah \
            .site/tanakh/numbers \
            .site/tanakh/obadiah \
            .site/tanakh/ruth \
            .site/tanakh/zechariah \
            .site/tanakh/zephaniah \
            .site/assets/css \
            .site/assets/js \
            .site/data/definitions \
            .site/data/lexical \
            .site/data/lexical/crossmatches \
            .site/data/lexical/occurrences \
            .site/data/lexical/reader-hints \
            .site/data/public-lexical/by-work \
            .site/data/public-hud
          cp -a .nojekyll 404.html index.html .site/
          cp -a assets/css/reader-workbench.css .site/assets/css/
          cp -a assets/js/reader-workbench.js .site/assets/js/
          cp -a orot/index.html .site/orot/
          for work in amos daniel deuteronomy esther exodus ezra genesis hosea i-kings i-samuel ii-kings ii-samuel isaiah jeremiah jonah joel joshua judges leviticus malachi nehemiah numbers obadiah ruth zechariah zephaniah; do
            cp -a "tanakh/$work/index.html" ".site/tanakh/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          cp -a data/lexical/orot.manifest.json .site/data/lexical/
          cp -a data/lexical/orot-chunks .site/data/lexical/
          cp -a data/lexical/occurrences/orot.json .site/data/lexical/occurrences/
          cp -a data/lexical/source-layers .site/data/lexical/
          cp -a data/definitions/hud-route-lookup .site/data/definitions/
          cp -a data/definitions/hud-route-lookup-daniel .site/data/definitions/
          cp -a data/public-lexical/by-work/daniel-token-claims-min60.csv .site/data/public-lexical/by-work/
          cp -a data/public-hud/orot .site/data/public-hud/
          du -sh .site
          find .site -type f -printf '%s %p\n' | sort -nr | head -20
          find .site -type f -print
          if find .site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 grep -n -E 'Clicked Hebrew form|Best actual hit|data-hud-renderings|data-hud-breakdown|Potential options|No lexical entry yet\.|lexical-fields'; then
            echo "Old HUD marker found in Pages artifact; refusing deployment." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
