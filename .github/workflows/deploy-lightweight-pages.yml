name: Deploy Lightweight Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nojekyll
            /index.html
            /tanakh/deuteronomy/index.html
            /assets/css/reader-workbench.css
            /assets/js/reader-workbench.js
            /data/public-hud/deuteronomy/**

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight artifact
        run: |
          rm -rf .site
          mkdir -p .site/tanakh/deuteronomy \
            .site/assets/css \
            .site/assets/js \
            .site/data/public-hud
          cp -a .nojekyll index.html .site/
          cp -a tanakh/deuteronomy/index.html .site/tanakh/deuteronomy/
          cp -a assets/css/reader-workbench.css .site/assets/css/
          cp -a assets/js/reader-workbench.js .site/assets/js/
          cp -a data/public-hud/deuteronomy .site/data/public-hud/
          du -sh .site
          find .site -type f -printf '%s %p\n' | sort -nr | head -20
          find .site/data/public-hud/deuteronomy -maxdepth 4 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
