      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build lightweight artifact
        run: |
          rm -rf .site
          mkdir -p .site/orot \
            .site/halakhah \
            .site/tanakh/amos \
            .site/tanakh/daniel \
            .site/tanakh/deuteronomy \
            .site/tanakh/ecclesiastes \
            .site/tanakh/esther \
            .site/tanakh/exodus \
            .site/tanakh/ezra \
            .site/tanakh/genesis \
            .site/tanakh/habakkuk \
            .site/tanakh/haggai \
            .site/tanakh/hosea \
            .site/tanakh/i-chronicles \
            .site/tanakh/i-kings \
            .site/tanakh/i-samuel \
            .site/tanakh/ibn-ezra-on-deuteronomy \
            .site/tanakh/ibn-ezra-on-exodus \
            .site/tanakh/ii-chronicles \
            .site/tanakh/ii-kings \
            .site/tanakh/ii-samuel \
            .site/tanakh/isaiah \
            .site/tanakh/jeremiah \
            .site/tanakh/jonah \
            .site/tanakh/joel \
            .site/tanakh/joshua \
            .site/tanakh/judges \
            .site/tanakh/job \
            .site/tanakh/lamentations \
            .site/tanakh/leviticus \
            .site/tanakh/malachi \
            .site/tanakh/micah \
            .site/tanakh/nahum \
            .site/tanakh/nehemiah \
            .site/tanakh/numbers \
            .site/tanakh/obadiah \
            .site/tanakh/proverbs \
            .site/tanakh/psalms \
            .site/tanakh/ruth \
            .site/tanakh/song-of-songs \
            .site/tanakh/zechariah \
            .site/tanakh/zephaniah \
            .site/assets/css \
            .site/assets/js \
            .site/data/definitions \
            .site/data/lexical \
            .site/data/lexical/crossmatches \
            .site/data/lexical/occurrences \
            .site/data/lexical/reader-hints \
            .site/data/public-lexical/by-work \
            .site/data/public-hud
          cp -a .nojekyll 404.html index.html .site/
          cp -a assets/css/reader-workbench.css .site/assets/css/
          cp -a assets/js/reader-workbench.js .site/assets/js/
          cp -a orot/index.html .site/orot/
          for work in amos daniel deuteronomy ecclesiastes esther ezekiel exodus ezra genesis habakkuk haggai hosea i-chronicles i-kings i-samuel ibn-ezra-on-deuteronomy ibn-ezra-on-exodus ibn-ezra-on-genesis ibn-ezra-on-leviticus ibn-ezra-on-numbers ibn-ezra-on-zechariah ii-chronicles ii-kings ii-samuel isaiah jeremiah jonah joel joshua judges job lamentations leviticus malachi micah nahum nehemiah numbers obadiah proverbs psalms rashi-on-deuteronomy rashi-on-genesis rashi-on-leviticus rashi-on-numbers ruth song-of-songs zechariah zephaniah; do
            mkdir -p ".site/tanakh/$work"
            cp -a "tanakh/$work/index.html" ".site/tanakh/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          for work in abudarham ahavat-chesed annotations-of-maharatz-chajes-on-mishneh-torah-foreign-worship-and-customs-of-the-nations annotations-of-maharatz-chajes-on-mishneh-torah-mourning annotations-of-maharatz-chajes-on-mishneh-torah-repentance annotations-of-minchat-chinukh-on-mishneh-torah-daily-offerings-and-additional-offerings annotations-of-minchat-chinukh-on-mishneh-torah-diverse-species annotations-of-minchat-chinukh-on-mishneh-torah-fasts annotations-of-minchat-chinukh-on-mishneh-torah-paschal-offering annotations-of-r-yeshaya-berlin-on-mishneh-torah-sabbath annotations-of-r-zalman-of-vilna-on-mishneh-torah-repentance arukh-hashulchan arukh-hashulchan-heatid ateret-zekenim-on-shulchan-arukh-orach-chayim avodat-hakodesh avodat-hamelekh-on-mishneh-torah-foreign-worship-and-customs-of-the-nations avodat-hamelekh-on-mishneh-torah-foundations-of-the-torah avodat-hamelekh-on-mishneh-torah-human-dispositions avodat-hamelekh-on-mishneh-torah-repentance avodat-hamelekh-on-mishneh-torah-torah-study avodat-hamelekh-on-mishneh-torah-transmission-of-the-oral-law baalei-hanefesh baer-hetev-on-shulchan-arukh-choshen-mishpat baer-hetev-on-shulchan-arukh-even-haezer baer-hetev-on-shulchan-arukh-orach-chayim baer-hetev-on-shulchan-arukh-yoreh-deah bedikat-hasakin beer-hagolah-on-shulchan-arukh-choshen-mishpat beer-hagolah-on-shulchan-arukh-even-haezer beer-hagolah-on-shulchan-arukh-orach-chayim beer-hagolah-on-shulchan-arukh-yoreh-deah beit-meir-on-shulchan-arukh-even-haezer beit-shmuel beit-yosef ben-aryeh-on-mishneh-torah-festival-offering ben-aryeh-on-mishneh-torah-mourning ben-aryeh-on-mishneh-torah-paschal-offering ben-aryeh-on-mishneh-torah-repentance ben-ish-hai benei-binyamin-on-mishneh-torah-blessings benei-binyamin-on-mishneh-torah-circumcision benei-binyamin-on-mishneh-torah-fasts benei-binyamin-on-mishneh-torah-fringes benei-binyamin-on-mishneh-torah-prayer-and-the-priestly-blessing benei-binyamin-on-mishneh-torah-reading-the-shema benei-binyamin-on-mishneh-torah-repentance benei-binyamin-on-mishneh-torah-sabbath benei-binyamin-on-mishneh-torah-sanctification-of-the-new-month benei-binyamin-on-mishneh-torah-scroll-of-esther-and-hanukkah benei-binyamin-on-mishneh-torah-sheqel-dues benei-binyamin-on-mishneh-torah-shofar-sukkah-and-lulav binat-adam biur-halacha brit-moshe brit-olam-on-sefer-chasidim chafetz-chaim chatam-sofer-on-shulchan-arukh-orach-chayim chayyei-adam chelkat-mechokek chidushim-of-machaneh-ephraim-on-mishneh-torah-mourning chokhmat-adam chokhmat-shlomo-on-shulchan-arukh-even-haezer chokhmat-shlomo-on-shulchan-arukh-orach-chayim commentary-of-mahari-kurkus-and-radbaz-on-mishneh-torah-admission-into-the-sanctuary commentary-of-mahari-kurkus-and-radbaz-on-mishneh-torah-the-chosen-temple commentary-of-mahari-kurkus-and-radbaz-on-mishneh-torah-vessels-of-the-sanctuary-and-those-who-serve-therein dagul-merevava-on-shulchan-arukh-orach-chayim darkhei-moshe dina-degarmei divrei-shaul-edut-beyosef-on-mishneh-torah-testimony divrei-yirmiyahu-on-mishneh-torah-blessings; do
            mkdir -p ".site/halakhah/$work"
            cp -a "halakhah/$work/index.html" ".site/halakhah/$work/"
            cp -a "data/lexical/$work.manifest.json" .site/data/lexical/
            cp -a "data/lexical/$work-chunks" .site/data/lexical/
            cp -a "data/lexical/occurrences/$work.json" .site/data/lexical/occurrences/
            if [ -f "data/lexical/crossmatches/$work.json" ]; then
              cp -a "data/lexical/crossmatches/$work.json" .site/data/lexical/crossmatches/
            fi
            if [ -f "data/lexical/reader-hints/$work.json" ]; then
              cp -a "data/lexical/reader-hints/$work.json" .site/data/lexical/reader-hints/
            fi
            if [ -d "data/public-hud/$work" ]; then
              cp -a "data/public-hud/$work" .site/data/public-hud/
            fi
          done
          cp -a data/lexical/orot.manifest.json .site/data/lexical/
          cp -a data/lexical/orot-chunks .site/data/lexical/
          cp -a data/lexical/occurrences/orot.json .site/data/lexical/occurrences/
          cp -a data/lexical/source-layers .site/data/lexical/
          cp -a data/definitions/hud-route-lookup .site/data/definitions/
          cp -a data/definitions/hud-route-lookup-daniel .site/data/definitions/
          cp -a data/public-lexical/by-work/daniel-token-claims-min60.csv .site/data/public-lexical/by-work/
          cp -a data/public-hud/orot .site/data/public-hud/
          du -sh .site
          find .site -type f -printf '%s %p\n' | sort -nr | head -20
          find .site -type f -print
          if find .site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 grep -n -E 'Clicked Hebrew form|Best actual hit|data-hud-renderings|data-hud-breakdown|Potential options|No lexical entry yet\.|lexical-fields'; then
            echo "Old HUD marker found in Pages artifact; refusing deployment." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    needs: build
