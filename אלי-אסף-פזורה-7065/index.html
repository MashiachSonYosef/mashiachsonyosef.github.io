                { covers: item.runFor(e), scope: item.scopeFor(e),
                  runFor: item.runFor, scopeFor: item.scopeFor,
                  on: { book: zone.work, label: sec.label, words: (sec.words || []).length } });
              placeLineHandles(sectionEl);
            });
          });
          list.append(btn);
          // The rest are reached by a press rather than named and withheld:
          // fifty-one buttons open at once is a wall, and fifty-one a reader
          // cannot reach is a limit. Neither is acceptable.
          //
          // FIRST_SCREEN is twelve, and twelve is ours. Nothing records it,
          // nothing measured it, and no rule produces it: it is the number of
          // buttons that fit a phone at this size before the list runs under
          // the fold. A number with no ledger behind it is fine as long as it
          // is a number somebody owns and nothing is lost to it — so the press
          // says how many are behind it, brings every one of them, and names
          // the twelve as this page's doing rather than the chain's.
          if (j >= FIRST_SCREEN - 1 && works.length > FIRST_SCREEN && !box.__all) {
            const more = document.createElement("button"); more.type = "button"; more.className = "c-more";
            more.textContent = `show the other ${works.length - FIRST_SCREEN} works on this word` +
              ` · ${FIRST_SCREEN} shown first, a number this page chose`;
            more.addEventListener("click", (ev) => {
              ev.stopPropagation();
              holdingSection(sectionEl, () => {
                const fresh = cmChooser(line, sectionEl, true);
                box.replaceWith(fresh);
              });
            });
            list.append(more);
            break;
          }
        }
      }
      box.append(list);
      return box;
    };

    // Group the verse's commentary-bearing words by the line they render on,
    // and give each such line one handle, after its last word. Placing a handle
    // changes where the words wrap, which changes the lines — so it settles by
    // looking again at what it just made, the same way the card's bands do.
    const placeLineHandles = (sectionEl) => {
      const para = sectionEl.querySelector(".he-text");
      if (!para) return;
      for (let pass = 0; pass < 3; pass += 1) {
        para.querySelectorAll(".c-mark-row, .c-choose").forEach((x) => x.remove());
        // the verse's own words. A commentary's words are blocks too, and they
        // stand inside an open panel — they are its text, not this verse's, and
        // a handle must never be placed among them.
        const verseOnly = [...para.querySelectorAll(".wb")].filter((w) => !w.closest(".c-mark-slot"));
        const marked = verseOnly.filter((wb) => wb.__cm && wb.__cm.length);
        if (!marked.length) return;
        const all = verseOnly;
        const lines = [];
        // Which words an entry covers is the span it was placed at, read from
        // the word it is attached to. The run is taken from the
        // words as they stand in the paragraph, so it survives the line
        // rewrapping around whatever is already open.
        const runFor = (wb) => (e) => {
          const n = coveredRun(e, sec, wb.__cmAt || 0);
          const live = [...para.querySelectorAll(".wb")].filter((z) => !z.closest(".c-mark-slot"));
          const i = live.indexOf(wb);
          return i < 0 ? [wb] : live.slice(i, i + n);
        };
        const scopeFor = (wb) => (e) => scopeOf(e, sec, wb.__cmAt || 0);
        for (const wb of marked) {
          const top = Math.round(wb.getBoundingClientRect().top);
          const item = { wb, entries: wb.__cm, runFor: runFor(wb), scopeFor: scopeFor(wb) };
          const line = lines.find((l) => Math.abs(l.top - top) < 6);
          if (line) line.items.push(item);
          else lines.push({ top, items: [item], last: null });
        }
        // the handle goes under the whole line, so it is anchored to the line's
        // last word rather than to its last commented one — anchoring it to the
        // commented word would break the line early and shove the words after
        // it down for no reason the reader can see
        for (const line of lines) {
          line.last = all.filter((w) => Math.abs(Math.round(w.getBoundingClientRect().top) - line.top) < 6).pop();
        }
        for (const line of lines) {
          const last = line.last || line.items[line.items.length - 1].wb;
          const units = line.items.reduce((n, x) => n + x.entries.length, 0);
          const fams = [...new Set(line.items.flatMap((x) =>
            x.entries.map((e) => commentaryWorkOf(e).family_en || "commentary")))];
          const pill = document.createElement("button"); pill.type = "button"; pill.className = "c-mark";
          const g = document.createElement("span"); g.className = "c-glyph";
          g.textContent = "C" + (units > 1 ? units : "");
          // The handle says what it is, not who is in it. Which works, which
          // units and which word each sits on is what the press is for, and
          // naming five commentators on a pill only makes the line noisy.
          const nm = document.createElement("span"); nm.className = "c-name";
          nm.textContent = "Commentary";
          pill.append(g, document.createTextNode(" "), nm);
          pill.setAttribute("aria-expanded", "false");
          pill.setAttribute("aria-label",
            `${units} commentary unit${units === 1 ? "" : "s"} on this line — ${fams.join(", ")}`);
          // Opening the chooser does not re-place the handles: the placer
          // clears them to rebuild them, and it would clear the chooser it had
          // just been asked to open. Handles are re-placed when a commentary
          // opens or closes, which is when words actually change lines.
          pill.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const already = para.querySelector(".c-choose");
            const mine = already && already.previousElementSibling === row;
            holdingSection(sectionEl, () => {
              para.querySelectorAll(".c-mark[aria-expanded='true']")
                .forEach((x) => x.setAttribute("aria-expanded", "false"));
              if (already) already.remove();
              if (!mine) {

                pill.setAttribute("aria-expanded", "true");
              }
            });
          });
          // A row of its own, under the line: block-level, so it takes the line
          // it is on and the words that follow start after it. Inline, it
          // wrapped onto the next line and sat among words it had nothing to do
          // with.
          const row = document.createElement("span"); row.className = "c-mark-row";
          row.append(pill);
          last.after(row);
        }
      }
    };
    sectionHandlePlacers.push(placeLineHandles);
    // the index opens a commentary through the same door the handle does, so
    // there is one way a commentary opens and not two
    sectionOpeners.push((wb, which) => {
      if (!wb.__cm || !wb.__cm.length) return;
      const e = wb.__cm[which || 0];
      // the verse's own words, computed at the moment they are needed — a
      // commentary's words are blocks too, and they are not the verse's
      const runFor = (x) => {
        const all = [...s.querySelectorAll(".he-text .wb")].filter((z) => !z.closest(".c-mark-slot"));
        const i = all.indexOf(wb);
        const n = coveredRun(x, sec, wb.__cmAt || 0);
        return i < 0 ? [wb] : all.slice(i, i + n);
      };
      const scopeFor = (x) => scopeOf(x, sec, wb.__cmAt || 0);
      cmPanel(wb.__cm, which || 0, s, wb,
        { covers: runFor(e), scope: scopeFor(e), runFor, scopeFor,
          on: { book: zone.work, label: sec.label, words: (sec.words || []).length } });

    });

    // The text itself. Each word is a block carrying the Hebrew and its

    // across the verse comes out as words rather than one long run.
    //

    // and building all of it up front is the whole of the wait before the
    // first word exists.
    const buildBody = () => {
    const he = document.createElement("p"); he.className = "he-text"; he.lang = "he"; he.dir = "rtl";
    let wIdx = 0;
    sec.words.forEach((word) => {
      const built = wordBlock(word, zone.gloss);
      const myIdx = wIdx; wIdx += 1;
      wireWord(built, word, zone, sec.unit, myIdx);
      appendWord(he, built, word);
      // A commentary attached at this word gets its handle here, standing in
      // the line right after the words it covers, and it opens here too — a
      // reader should not have to look anywhere else to find what they pressed.
      // Opening it puts the rest of the verse underneath: what is above the

    // waits for the reader to come near.

  // ---- one box for every commentary in the book ------------------------

    const head = document.createElement("button"); head.type = "button"; head.className = "ci-head";
    const byWork = new Map();
    for (const r of rows) {

      byWork.set(k, (byWork.get(k) || 0) + 1);

    // of them. Nothing is hidden by dropping it: the count says how many there
    // are, the search finds any of them by name, and the verse's own bar names
    // the ones standing on it.
    const summary = `from ${byWork.size.toLocaleString()} work${byWork.size === 1 ? "" : "s"} · ` +
      `${byWork.size === 1 ? "every unit of it is" : "any one of them is"} findable below`;
    // The handle says what it is and how much of it there is; which works those

    head.append(Object.assign(document.createElement("b"),

    head.setAttribute("aria-expanded", "false");
    const body = document.createElement("div"); body.className = "ci-body"; body.hidden = true;
    const works = document.createElement("p"); works.className = "ci-sum"; works.textContent = summary;

    bar.append(q, count);
    const list = document.createElement("div"); list.className = "ci-list";

    const SHOW = 40;
    const hay = (r) => `${r.work.family_en || ""} ${r.work.title || ""} ${r.e.title || ""} ${r.e.ref || ""} ${r.e.he_ref || ""} ${r.label} ${r.word || ""} ${r.e.text || ""}`.toLowerCase();
    rows.forEach((r) => { r.hay = hay(r); });
    const paint = () => {
      const term = q.value.trim().toLowerCase();
      const hits = term ? rows.filter((r) => r.hay.includes(term)) : rows;
      count.textContent = term
        ? `${hits.length.toLocaleString()} of ${rows.length.toLocaleString()}`
        : `${rows.length.toLocaleString()} in all`;
      list.replaceChildren();
      hits.slice(0, SHOW).forEach((r) => {
        const b2 = document.createElement("button"); b2.type = "button"; b2.className = "ci-hit";
        const w = document.createElement("span"); w.className = "ci-where";
        w.textContent = r.label + (r.word ? " · " : "");
        if (r.word) {
          const hw = document.createElement("span"); hw.lang = "he"; hw.dir = "rtl"; hw.textContent = r.word;
          w.append(hw);
        }
        const nm = document.createElement("span"); nm.className = "ci-what";
        nm.textContent = `${r.work.family_en || r.work.title || r.e.ref}${r.e.title ? ` · ${r.e.title}` : ""}`;
        const lic = document.createElement("span"); lic.className = "lic-chip";
        lic.textContent = r.work.license || r.e.license || "License unrecorded";
        b2.append(w, nm, lic);
        b2.addEventListener("click", () => openFromIndex(r));
        list.append(b2);
      });
      if (hits.length > SHOW) {
        const more = document.createElement("p"); more.className = "ci-more";
        more.textContent = `${(hits.length - SHOW).toLocaleString()} more — narrow the search to reach them`;
        list.append(more);
      }
      if (!hits.length) {
        const none = document.createElement("p"); none.className = "ci-more";
        none.textContent = "nothing here matches that";
        list.append(none);
      }
    };
    let t = null;
    q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(paint, 120); });
    head.addEventListener("click", () => {
      const open = body.hidden;
      body.hidden = !open;
      head.setAttribute("aria-expanded", String(open));
      if (open) { paint(); q.focus(); }
    });
    box.append(head, body);
    return box;
  };

  // Going to a commentary from the index: the verse, then the commentary
  // itself, opened where it lives rather than copied into the box.
  const openFromIndex = (r) => {
    const target = sectionEls[r.secIdx];
    if (!target) return;
    materialise(target.el);
    target.el.scrollIntoView({ block: "start" });
    if (r.pos == null) {
      toggleSectionInline(target.sec, target.el, true);
      const bar2 = target.el.querySelector(".c-bar");
      if (bar2) bar2.setAttribute("aria-expanded", "true");
      return;
    }
    const wb = [...target.el.querySelectorAll(".he-text .wb")][r.pos];
    if (!wb || !wb.__cm) return;

    para.querySelectorAll(".c-choose").forEach((x) => x.remove());
    para.querySelectorAll(".c-mark-slot:not(.c-choose)").forEach((x) => x.remove());
    const open = sectionOpeners[r.secIdx];
    if (open) holdingSection(target.el, () => open(wb, r.j));
  };

  main.append(frag);
  {
    const ci = buildCommentaryIndex();
    if (ci) main.prepend(ci);
  }
  // The census, on the page's own face. Shapes 1 to 3 are drawn; 4 and 5 are
  // declared and not yet drawn; 6 is anything the reader does not recognise.
  // A number in the last three is a book asking for a rule, not a bug to find.
  {
    const t = scopeCensus();
    window.__scopeCensus = t;
    const full = document.querySelector("#meta .receipts-full");
    if (full && t.total) {
      const named = t[1] + t[2] + t[3];
      full.textContent += ` · ${t.total.toLocaleString()} commentary attachments, ` +
        `${named.toLocaleString()} at a shape the reader draws ` +
        `(${t[1].toLocaleString()} on a section, ${t[2].toLocaleString()} on the span they were placed at, ` +
        `${t[3].toLocaleString()} on the word they are attached to)` +
        (t[4] + t[5] + t[6]
          ? `, and ${(t[4] + t[5] + t[6]).toLocaleString()} at a shape not yet declared, shown at the coordinate the chain gives them`
          : ", and none at a shape it does not know") +
        (t.quoted_differs
          ? ` · on ${t.quoted_differs.toLocaleString()} of them the placement and a strict count of the opening quotation come to different lengths; each says so on its face and the mark follows the placement`
          : "");
    }
  }

  // ---- the book arrives a screen at a time ------------------------------
  //
  // Genesis is 1,533 sections and 17,807 words. Built in one pass that is
  // some 78,000 nodes and about four seconds before the first word exists —
  // longer on a phone, and almost none of it on screen. So a section arrives
  // as its number and a reserved height, and fills in as it comes within
  // reach of the window.
  //
  // The reservation is measured, not guessed. The sections that are on screen
  // at the start get built for real, and what they actually cost per word
  // sets the reservation for the rest. A guess here is not free: it is the
  // length of the scrollbar and where an anchor lands.
  let io = null;
  // Reading the commentary beneath every section is a state of the book, not
  // of the sections that happened to be built when it was turned on — a
  // section arriving later arrives into it.
  let commentaryLayerOn = false;
  const materialise = (el) => {
    const build = el && el.__body;
    if (!build) return false;
    el.__body = null;
    build();
    el.classList.remove("seg-wait");
    el.style.minHeight = "";
    if (io) io.unobserve(el);
    if (commentaryLayerOn && el.__sec) {
      buildSectionInline(el.__sec, el);
      el.querySelectorAll(".c-inline").forEach((x) => { x.hidden = false; });
      const bar = el.querySelector(".c-bar");
      if (bar) bar.setAttribute("aria-expanded", "true");
    }

    return true;
  };

    for (const e of entries) if (e.isIntersecting) materialise(e.target);
  }, { rootMargin: "1400px 0px" });

  // reads the readings off the page, and an anchor has to land on the section
  // at the height it is going to be, not the height it was reserved.
  const materialiseAll = () => { sectionEls.forEach(({ el }) => materialise(el)); };
  {
    const fold = window.innerHeight * 2.5;
    const built = [];
    for (const { el } of sectionEls) {
      if (built.length >= 6 && el.getBoundingClientRect().top > fold) break;
      if (materialise(el)) built.push(el);
    }
    let px = 0, words = 0;
    for (const el of built) { px += el.getBoundingClientRect().height; words += el.__words || 0; }
    // If the first sections carried no words to measure, fall back to a row of
    // text per few words rather than pretending to know.
    const perWord = words > 20 ? px / words : 26;
    let waiting = 0;
    for (const { el } of sectionEls) {
      if (!el.__body) continue;
      el.classList.add("seg-wait");
      el.style.minHeight = `${Math.max(34, Math.round((el.__words || 1) * perWord))}px`;
      io.observe(el);
      waiting += 1;
    }
    console.log(`[zone] ${built.length} sections built, ${waiting} reserved at ${perWord.toFixed(1)}px per word`);
  }
  // An in-page link has to find its section standing at its real height, so
  // the target is built before the browser goes there rather than after.
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');

    const id = decodeURIComponent(location.hash.slice(1));
    const el = id && document.getElementById(id);
    if (el && materialise(el)) el.scrollIntoView({ block: "start" });
  });

  // now that the verses have a width and know where they wrap
  const placeAllHandles = () => {
    for (let i = 0; i < sectionHandlePlacers.length; i += 1) {
      const el = sectionEls[i] && sectionEls[i].el;

      if (el && !el.__body) sectionHandlePlacers[i](el);

  };
  placeAllHandles();
  let handleTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(handleTimer);
    handleTimer = setTimeout(placeAllHandles, 120);
  });

  // One export for the whole work, after the last section. It reads every
  // record the book stands on, which is the honest cost of a book-sized
  // export, and it says so before it does anything.
  {
    const box = document.createElement("div"); box.id = "bookExport";
    const lab = document.createElement("span"); lab.className = "xp-lab";
    lab.textContent = `export the whole of ${zone.work}`;
    const row = document.createElement("div"); row.className = "xp-row";
    const note = document.createElement("p"); note.className = "xp-note";
    const gatherBook = async () => {
      // every section, so every section has to exist
      materialiseAll();
      const bundles = [];
      for (const { sec, el } of sectionEls) bundles.push(await gatherSection(sec, el));
      return { bundles, title: zone.work };
    };
    for (const kind of ["he", "en", "both"]) {
      row.append(exportButton(
        kind,
        kind === "he" ? "hebrew" : kind === "en" ? "english" : "hebrew + english",
        note, gatherBook, () => `${slug(zone.work)}-${kind}.md`,
      ));
    }
    row.append(note);
    box.append(lab, row);
    main.append(box);
  }

  // ---- the commentary layer -------------------------------------------
  // A commentary is not a book of its own. It belongs to the sections it
  // comments on, and a reader who wants to read it should read it there,
  // continuously, rather than opening eight hundred cards. Built once on
  // first use, because it is as many word blocks again as the text.
  const cWorks = commentaryStore && commentaryStore.works ? commentaryStore.works : [];
  if (cWorks.length && commentaryStore.counts && commentaryStore.counts.attached_sections) {
    const layerBtn = document.getElementById("layerC");
    const name = cWorks.map((w) => w.family_en || w.title).join(" · ");
    layerBtn.textContent = name;
    layerBtn.title = `Read ${name} beneath each ${MINOR}`;
    layerBtn.hidden = false;
    layerBtn.addEventListener("click", () => {
      commentaryLayerOn = !commentaryLayerOn;
      const on = commentaryLayerOn;
      layerBtn.classList.toggle("on", on);
      // 817 sections opening at once moves the page by the height of a book.
      // Pin whichever section the reader is actually looking at.
      const seen = sectionEls.find(({ el }) => el.getBoundingClientRect().bottom > 0) || sectionEls[0];
      holdingSection(seen.el, () => {
        // only what has been built — a section still waiting has no slot to
        // open into, and will open itself when it arrives
        for (const { sec, el } of sectionEls) {
          if (el.__body) continue;
          buildSectionInline(sec, el);
          el.querySelectorAll(".c-inline").forEach((x) => { x.hidden = !on; });
        }
      });
      document.querySelectorAll(".c-bar").forEach((b) => b.setAttribute("aria-expanded", String(on)));
    });
  }

  // ---- getting around -------------------------------------------------
  // One floating bar rather than controls on every section: at 1,533
  // sections per book, per-section chrome is noise. The bar knows which
  // chapter you are in and stands down whenever the HUD is open, so only
  // one thing ever asks for a tap.
  const nav = document.getElementById("nav");
  const navChapter = document.getElementById("navChapter");
  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");
  // offsets are measured once — nothing reflows after paint, because the
  // Hebrew never moves — so position lookups stay pure arithmetic on a page
  // that can run to millions of pixels
  // Read live: a section that fills in changes every offset below it, so a
  // top measured once would name the wrong chapter within a screen of reading.
  const heads = nodeHeads.map((h) => ({ node: h.node, el: h.el,
    get top() { return h.el.offsetTop; } }));
  let atNode = 0;
  // A book this long runs to millions of pixels; smooth scrolling across
  // that distance stalls, so only short hops animate.
  if (openAt && byLabel.has(openAt)) {
    const target = document.getElementById(byLabel.get(openAt));
    if (target) {
      materialise(target);
      window.scrollTo(0, target.getBoundingClientRect().top + window.scrollY - 80);
      target.querySelector(".vnum")?.classList.add("at");
    }
  }
  // front-door-rule-v1 · ?c=open lands the reader inside a commentary.
  //
  // The door offers "Commentary on Genesis" as a way in of its own, and a way
  // in that drops a reader at the top of a book with every commentary still
  // shut is not one — they arrive at the thing they asked for and have to go
  // find it.
  //
  // It presses what a finger would press, in order: the first mark the book
  // carries, then the first work behind it. Nothing here knows how a
  // commentary opens; there is one path and this uses it, so the two cannot
  // drift apart. The marks are placed after layout, so it waits for one to
  // exist rather than assuming the page is finished.
  // front-door-rule-v2 · ?t=open lands the reader inside the title's own record.
  //
  // The door shows a book's Hebrew name to readers who cannot read it —
  // "gibberish", as its owner puts it — and the answer to gibberish in this
  // project is never the force-read: it is the word's own record. Pressing
  // the title on the door arrives here with that word already open, its
  // readings sorted oldest source first, exactly as any word in the text
  // opens. It presses what a finger would press — the first openable title
  // token — and waits for it to exist rather than assuming the page is done.
  if (QUERY.get("t") === "open") {
    let waitedT = 0;
    const pressTitle = () => {
      const tok = document.querySelector("#workTitle .he-t .wb");
      if (!tok) { if (waitedT < 4000) { waitedT += 60; setTimeout(pressTitle, 60); } return; }
      tok.click();
    };
    pressTitle();
  }
  if (QUERY.get("c") === "open") {
    let waited = 0;
    const press = () => {
      const first = document.querySelector("section.seg .c-mark, section.seg .c-bar");
      if (!first) { if (waited < 4000) { waited += 60; setTimeout(press, 60); } return; }
      first.scrollIntoView({ block: "center" });
      first.click();
      // a word's mark opens a chooser of works; a section's bar opens the text
      setTimeout(() => { document.querySelector(".c-choose .c-choice")?.click(); }, 0);
    };
    press();
  }
  const goTo = (top) => {
    const d = Math.abs(top - window.scrollY);
    window.scrollTo({ top, behavior: d > 2500 ? "auto" : "smooth" });
    setTimeout(paintNav, 0);
  };
  const jump = (el) => { if (el) goTo(el.getBoundingClientRect().top + window.scrollY - 12); };
  const currentIndex = () => {
    const y = window.scrollY + 80;
    let lo = 0;
    for (let i = 0; i < heads.length; i += 1) { if (heads[i].top <= y) lo = i; else break; }
    return lo;
  };
  const paintNav = () => {
    if (!heads.length) return;
    atNode = currentIndex();
    const n = nodes[heads[atNode].node] || {};
    navChapter.textContent = `Chapter ${n.num || heads[atNode].node + 1}`;
    navPrev.disabled = atNode === 0;
    navNext.disabled = atNode >= heads.length - 1;
    nav.hidden = window.scrollY < 200 || !hud.hidden;
  };
  document.getElementById("navTop").addEventListener("click", () => goTo(0));
  navChapter.addEventListener("click", () => jump(heads[atNode].el));
  navPrev.addEventListener("click", () => { if (atNode > 0) jump(heads[atNode - 1].el); });
  navNext.addEventListener("click", () => { if (atNode < heads.length - 1) jump(heads[atNode + 1].el); });
  // a page this size can starve requestAnimationFrame, so the bar repaints
  // on a plain time throttle and on arrival at any anchor
  let lastPaint = 0;
  window.addEventListener("scroll", () => {
    const t = performance.now();
    if (t - lastPaint < 120) return;
    lastPaint = t; paintNav();
  }, { passive: true });
  window.addEventListener("hashchange", () => setTimeout(paintNav, 0));
  paintNav();
  const navSync = new MutationObserver(paintNav);
  navSync.observe(hud, { attributes: true, attributeFilter: ["hidden"] });

  // ---- contents: chapter opens its sections ---------------------------
  // Tap a chapter number for its sections, tap a section number to land —
  // the same book-chapter-verse drill a reader already knows. Each surface
  // still carries exactly one verb.
  const panel = document.getElementById("secPanel");
  const closePanel = () => { panel.hidden = true; document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on")); };
  const openPanel = (i, cell) => {
    const list = nodeSections[i] || [];
    if (!list.length) return;
    document.querySelectorAll("#toc .chs a.on").forEach((a) => a.classList.remove("on"));
    cell.classList.add("on");
    const n = nodes[i] || {};
    panel.replaceChildren();
    const head = document.createElement("div"); head.className = "sp-head";
    const lbl = document.createElement("span");
    lbl.textContent = `${n.name_en || `Chapter ${n.num || i + 1}`} · ${list.length} ${list.length === 1 ? "section" : "sections"}`;
    head.append(lbl);
    if (n.name_he) { const he2 = document.createElement("span"); he2.className = "sp-he"; he2.lang = "he"; he2.dir = "rtl"; he2.textContent = n.name_he; head.append(he2); }
    const x = document.createElement("button"); x.type = "button"; x.className = "sp-x"; x.textContent = "×";
    x.setAttribute("aria-label", "Close"); x.addEventListener("click", closePanel); head.append(x);
    const grid = document.createElement("div"); grid.className = "sp-grid";
    const top = document.createElement("a"); top.href = `#n${i}`; top.className = "sp-top"; top.textContent = "chapter top";
    top.addEventListener("click", () => { closePanel(); setTimeout(paintNav, 0); }); grid.append(top);
    list.forEach((sc) => {
      const a = document.createElement("a"); a.href = `#${sc.id}`; a.textContent = sc.label;
      a.addEventListener("click", () => { closePanel(); setTimeout(paintNav, 0); }); grid.append(a);
    });
    panel.append(head, grid);
    panel.hidden = false;
  };
  document.querySelectorAll("#toc .chs a").forEach((cell, i) => {
    cell.addEventListener("click", (e) => {
      if (!(nodeSections[i] || []).length) return; // nothing to drill into
      e.preventDefault();
      if (cell.classList.contains("on")) { closePanel(); return; }
      openPanel(i, cell);
    });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
})();
</script>
</body>
</html>
