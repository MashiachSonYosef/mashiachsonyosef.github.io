<title>Zone reader · The Tabernacle</title>
<script>
// The tabernacle has two faces and both are the record's: linen hangings in
// daylight, the tent dark under its coverings by night. The device's own
// preference decides until the reader chooses; a choice is the device's to
// remember, and it is remembered on the device and nowhere else.
(() => {
  const root = document.documentElement;
  let held = null;
  try { held = localStorage.getItem("scheme"); } catch { /* a device that remembers nothing still reads */ }
  const sys = matchMedia("(prefers-color-scheme: light)");
  const apply = () => { root.dataset.scheme = held === "day" || held === "night" ? held : (sys.matches ? "day" : "night"); };
  apply();
  if (sys.addEventListener) sys.addEventListener("change", apply);
  window.__face = { set(v) { held = v; try { localStorage.setItem("scheme", v); } catch { /* still reads */ } apply(); } };
})();
</script>
<style>
  :root {
    color-scheme: dark;
    /* colour-role-rule-v1-the-roles-are-the-ledgers-and-the-values-are-ours
       ===================================================================

       There is a colour contract, and it is recorded. Y-GENESIS-NAVIGATION-V1
       carries it, generated 2026-07-18, status PASS:

         structure             gold
         reader_selection      electric blue
         commentary_attachment crimson
         base_surface          purple
         commentary_surface    brown

       This page had been painting three of those five and inventing its own
       scheme over the top of them. Gold was on structure, which the contract
       says — and also on every selection the reader made, which the contract
       gives to blue. So one colour was doing two jobs and the second job had
       no colour at all: nothing on the page looked different because you had
       chosen it, and gold, spread across both, stopped meaning either. The two
       surfaces were not painted at all, so a commentary and the text it is
       about sat on the same ground with nothing but a border between them.

       Meanwhile a note here assigned the Tabernacle materials to roles by
       itself — tekhelet to structure, most of all — which is the same fault
       this project exists to catch: deciding a thing the record had already
       decided, and then citing the decision as though it came from somewhere.

       So: the five roles below are the ledger's, named as it names them. The
       hex values are this page's, and always were. Exodus lists tekhelet,
       argaman, tola'at shani and shesh over and over and never once says what
       any of them looked like; every colour ever put to them is a tradition,
       and the traditions disagree. No reader should come away thinking a hex
       code is attested — only that a role is.

       Where the two speak of the same thing they agree by name: the contract's
       purple is argaman, its crimson is tola'at shani, and the linen the whole
       page is written in is shesh. */
    --bg: #0d0a14; --panel: #171021; --panel2: #120d1a;
    --nav-veil: rgba(21, 18, 13, 0.94);
    --line: #2b2039; --wash: #1c1428;
    /* the commentary's own surface, so a comment is never mistaken for text */
    --surface-c: #17100a; --panel-c: #201709; --line-c: #332513;
    /* shesh — the reading surface, and the neutrals taken down from it, so a
       reading is the same cloth as the word it belongs to, only dimmer */
    --ink: #efe6cf; --ink-strong: #f8f0da; --muted: #b2a489; --faint: #8b7f69;
    --shesh: #ddcda9; --shesh-bright: #eee0c2;
    /* structure — the spine the ledger records: titles, coordinates, the names
       of parts and chapters. Never a state. */
    --gold: #eac86f; --gold-dim: #a98c4b; --amber: #d9a441;
    /* reader_selection — and only that: what this reader has opened, chosen,
       pressed or armed. Nothing wears it at rest. */
    /* deepened from a pastel sky toward dyed thread — the same family the
       ledger names, valued to look dipped rather than emitted; the contrast
       judge holds it at 7:1 on the tent's ground */
    --sel: #5f9fe8; --sel-dim: #3a6a9a; --sel-ink: #081221;
    /* commentary_attachment — a commentary's mark, and by the same token what
       the page will not vouch for: a placement that is ours, a reach it is
       told is only suggested. It never marks something as wrong. */
    --shani: #c65b42; --shani-dim: #8a3d2c;
    /* argaman is the base surface above; tekhelet has no role in the contract
       and is kept named, and unused, so the day it appears is a decision
       somebody made and not a colour that crept in. */
    --argaman: #6b3f6e; --tekhelet: #2b4a6f;
    --link: var(--shesh);
    /* no anchor ever wears the browser's default purple — every link is
       the page's own linen, both faces */
    /* the working tones and washes, named so the day face can revalue them */
    --c-word: #c8bda0; --en-word: #b3a077;
    --hover-ink: #ffe08a; --hover-line: #6a5a33;
    --chip-bg: rgba(216, 199, 164, 0.12); --chip-line: rgba(216, 199, 164, 0.3);
    --wash-open: rgba(85, 150, 228, 0.15); --wash-chosen: rgba(85, 150, 228, 0.07);
    --wash-active: rgba(85, 150, 228, 0.18); --wash-copen: rgba(85, 150, 228, 0.12);
    --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.5);
    --shadow-card: 0 14px 40px rgba(0, 0, 0, 0.6);
    --shadow-hud: 0 18px 48px rgba(4, 2, 8, 0.55), 0 2px 8px rgba(4, 2, 8, 0.35);
  }
  /* The day face — the courtyard: linen hangings in daylight. The same five
     roles, valued for light, and linen is not glare: the ground sits well
     below paper white and the ink is warm, not black. Chosen by the device's
     preference until the reader presses the face button in the header. */
  :root[data-scheme="day"] {
    color-scheme: light;
    --bg: #f1e9d8; --panel: #f8f2e5; --panel2: #ebe2cd;
    --nav-veil: rgba(248, 242, 229, 0.94);
    --line: #d5c8ab; --wash: #e8dec7;
    --surface-c: #ece0c6; --panel-c: #e4d5b4; --line-c: #c6b189;
    --ink: #2b2519; --ink-strong: #1c180f; --muted: #5f5645; --faint: #7b7058;
    --shesh: #6b5a35; --shesh-bright: #4f421d;
    --gold: #8a6b26; --gold-dim: #b0955c; --amber: #8f6a1c;
    --sel: #275fa6; --sel-dim: #a3bdd9; --sel-ink: #f5f9fe;
    --shani: #9c3a26; --shani-dim: #bd8672;
    /* the scripture's own ink, darkened to the AAA floor the contrast judge
       holds body text to — still warm, never black; linen is not glare and
       ink is not tar, but thin niqqud marks need 7:1 to stay marks */
    --c-word: #453b25; --en-word: #6f6042;
    --hover-ink: #6b4f0e; --hover-line: #bda15c;
    --chip-bg: rgba(107, 90, 53, 0.10); --chip-line: rgba(107, 90, 53, 0.32);
    --wash-open: rgba(39, 95, 166, 0.14); --wash-chosen: rgba(39, 95, 166, 0.08);
    --wash-active: rgba(39, 95, 166, 0.20); --wash-copen: rgba(39, 95, 166, 0.12);
    --shadow-pop: 0 8px 24px rgba(96, 80, 48, 0.28);
    --shadow-card: 0 14px 40px rgba(96, 80, 48, 0.30);
    --shadow-hud: 0 18px 48px rgba(96, 80, 48, 0.32), 0 2px 8px rgba(96, 80, 48, 0.20);
  }
  * { box-sizing: border-box; }
  /* text-size-adjust: a phone browser that decides a block is "main content"
     inflates its font after layout has already been computed. Every box on this
     page that was sized from a measurement — the reading line held at the height
     it painted at, a band cut to a whole row — is sized against the font that
     was there when it was measured, and a font that grows afterwards spills out
     of all of them. The page sets its own sizes; it does not want them adjusted
     underneath it. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Georgia, "Times New Roman", serif;
    overflow-x: hidden; }

  /* The header holds the way out in its top corner, and the book's own title
     below it. On a narrow screen the two stack rather than fight. */
  #home { display: flex; align-items: baseline; gap: 0.45rem; justify-content: flex-end;
    margin: 0 0 0.9rem; font-size: 0.85rem; }
  #home .nav-lab { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint); }
  #home a.home { border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem 0.95rem; background: var(--panel2); color: var(--shesh);
    text-decoration: none; white-space: nowrap; }
  #home a.home:hover { color: var(--gold); border-color: var(--gold-dim); }
  /* the other face, one press away — the button names where it takes you */
  #home button.face { border: 1px solid var(--line); border-radius: 999px; background: none;
    color: var(--muted); font: inherit; font-size: 0.72rem; padding: 0.1rem 0.7rem; cursor: pointer; }
  #home button.face:hover { color: var(--gold); border-color: var(--gold-dim); }
  header.top { padding: 1.4rem 1.5rem 1rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg) 100%); }
  header.top h1 { margin: 0; font-size: 1.9rem; color: var(--ink-strong); letter-spacing: 0.01em; }
  /* The title is the book's own, from the ledger. The English beside it is
     not a translation of it and must not be able to be read as one — it is how
     a reader who does not read Hebrew finds and refers to the book. So each
     line says which of the two it is, in plain English, before the thing
     itself. The labels are ours; only the title is the corpus's. */
  header.top h1 { display: flex; flex-direction: column; gap: 0.1rem; }
  header.top h1 .t-row { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; }
  header.top h1 .t-lab { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--faint); font-variant: normal; flex: 0 0 auto; min-width: 6.4rem; }
  header.top h1 .he-t { font-size: 2.1rem; }
  /* The book's own title is a word of the corpus like any other: it opens, it
     carries records, it carries licenses. Rendered through the same row the
     chapter titles use, so there is one way a title is drawn. */
  header.top h1 .he-t .title-row { display: inline-block; text-align: right; }
  header.top h1 .he-t .title-row .wb { margin-bottom: 0; }
  header.top h1 .he-t .title-row .w { font-size: 2.1rem; }
  header.top h1 .he-t .title-row .g { font-size: 0.62rem; max-width: 12em; }
  header.top h1 .t-note { font-size: 0.6rem; letter-spacing: 0.06em; color: var(--muted);
    font-variant: normal; text-transform: none; }
  /* The third register: a machine's guess, named by its author. The chip is
     an attribution, never a license, and dresses differently — dashed where
     a license chip is solid — so no reader and no gate can mistake the one
     for the other. */
  header.top h1 .t-sug { display: block; font-size: 0.62rem; color: var(--muted);
    letter-spacing: 0.04em; margin-top: 0.18rem; font-variant: normal; text-transform: none; }
  header.top h1 .sug-chip { border: 1px dashed var(--line); border-radius: 0.6rem;
    padding: 0 0.4rem; font-size: 0.58rem; color: var(--muted); }
  /* the interval's words inside the register: the work's own, pressable,
     scaled to the register they stand in — a pointer, not the masthead */
  header.top h1 .t-sug .title-row { display: inline-block; vertical-align: middle; }
  header.top h1 .t-sug .title-row .w { font-size: 1.05rem; }
  header.top h1 .t-sug .title-row .g { font-size: 0.56rem; max-width: 8em; }
  /* The drawer for a guess that coexists with a witness: the surface is the
     witness's, and the guess waits one level down behind a press that names
     what it holds. */
  header.top h1 .sug-fold { display: block; margin-top: 0.18rem; padding: 0;
    border: none; background: none; cursor: pointer; font: inherit;
    font-size: 0.58rem; letter-spacing: 0.04em; color: var(--muted);
    text-decoration: underline dotted; font-variant: normal; text-transform: none; }
  header.top h1 .en-t { color: var(--gold); font-size: 1.15rem; font-variant: small-caps; letter-spacing: 0.14em; }
  header.top p.byline { margin: 0.25rem 0 0; font-size: 0.85rem; color: var(--muted); }
  #basisLine, #holdsLine, #rightsLine { margin: 0.3rem 0 0; font-size: 0.8rem; color: var(--muted); font-style: italic; max-width: 62rem; }
  header.top p#meta { margin: 0.55rem 0 0; font-size: 0.8rem; color: var(--muted); max-width: 60rem; }
  .receipts-btn { background: none; border: 0; border-bottom: 1px dotted var(--gold-dim);
    color: var(--link); font: inherit; font-size: 0.8rem; cursor: pointer; padding: 0; }
  .receipts-btn:hover { color: var(--gold); }
  .receipts-full { display: block; margin-top: 0.4rem; color: var(--faint); }
  .receipts-full[hidden] { display: none; }
  /* A work the ledger has not named in Hebrew keeps its English locator, but
     the locator does not get to look like a title. */
  header.top h1 .he-t.unnamed { color: var(--muted); font-size: 0.92rem; font-style: italic; }
  /* the name slot's absence, same voice as the title slot's */
  header.top h1 .en-t.unnamed { color: var(--muted); font-size: 0.92rem; font-style: italic;
    font-variant: normal; letter-spacing: normal; }
  a { color: var(--link); }
  header.top a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--chip-line); }
  header.top #home a.home { border-bottom: 1px solid var(--line); }
  header.top a:hover { color: var(--gold); border-bottom-color: var(--gold); }

  /* contents */
  #toc { max-width: 48rem; margin: 1.3rem auto 0; padding: 0 1.5rem; }
  /* Fifty chapters is the whole screen on a phone before a word of the book has
     been reached, so the grid arrives shut and says how much is behind it. */
  /* Shut, this used to be a faint grey line the width of two words, and a
     reader who knew it was there took twenty seconds to find it. A control
     that has to be hunted for is not a control. It is now the same object as
     every other thing on this page that can be pressed — a bordered pill in
     linen — and it carries the count, so the press is worth making before it
     is made. */
  #toc #tocHead { display: flex; align-items: center; gap: 0.55rem; text-align: left;
    background: var(--panel2); border: 1px solid var(--line);
    border-inline-start: 3px solid var(--gold-dim); border-radius: 0.5rem;
    padding: 0.5rem 0.85rem; margin: 0 0 0.4rem; cursor: pointer;
    font: inherit; color: var(--shesh); }
  #toc #tocHead .toc-t { font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; }
  #toc #tocHead .toc-n { font-size: 0.78rem; color: var(--muted); }
  #toc #tocHead::after { content: "\25be"; margin-inline-start: auto; font-size: 0.9rem;
    color: var(--gold-dim); transform: rotate(-90deg); transition: transform 140ms; }
  #toc #tocHead[aria-expanded="true"] { color: var(--sel); border-inline-start-color: var(--sel); }
  #toc #tocHead[aria-expanded="true"]::after { transform: none; color: var(--sel); }
  #toc #tocHead:hover { color: var(--gold); border-color: var(--gold-dim); }
  #tocBody[hidden] { display: none; }
  /* Contents is a coordinate grid: positions, not content. Plain English
     names the structure ("Part 2", "Chapter 7") — describing a thing is not
     translating it, and an English reader should never be locked out of
     navigation. The words themselves live in the text, where they can be
     tapped. */
  #toc .chs { display: grid; gap: 0.28rem; margin-top: 0.3rem;
    grid-template-columns: repeat(auto-fill, minmax(2.35rem, 1fr)); }
  #toc .chs a { display: flex; align-items: center; justify-content: center; min-height: 2.05rem;
    border: 1px solid var(--line); border-radius: 0.35rem; background: var(--panel2);
    text-decoration: none; font: 0.92rem/1 Georgia, serif; color: var(--gold);
    font-variant-numeric: tabular-nums; transition: border-color 120ms, background 120ms; }
  #toc .chs a:hover { border-color: var(--gold); background: var(--wash); }
  #toc .chs a.on { border-color: var(--sel); background: var(--sel); color: var(--sel-ink); font-weight: bold; }
  /* the sections of one chapter, opened in place under the grid */
  #secPanel { margin-top: 0.7rem; border: 1px solid var(--line); border-radius: 0.5rem;
    background: var(--panel2); padding: 0.6rem 0.7rem; }
  #secPanel[hidden] { display: none; }
  #secPanel .sp-head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.5rem;
    font-size: 0.74rem; letter-spacing: 0.14em; font-variant: small-caps; color: var(--faint); }
  #secPanel .sp-he { font-variant: normal; letter-spacing: 0; font-size: 1rem; color: var(--gold); }
  #secPanel .sp-x { margin-inline-start: auto; background: none; border: 0; color: var(--muted);
    font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 0 0.2rem; }
  #secPanel .sp-grid { display: grid; gap: 0.26rem;
    grid-template-columns: repeat(auto-fill, minmax(2.9rem, 1fr)); }
  #secPanel .sp-grid a { display: flex; align-items: center; justify-content: center; min-height: 1.85rem;
    border: 1px solid var(--line); border-radius: 0.32rem; background: var(--panel);
    color: var(--muted); text-decoration: none; font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  #secPanel .sp-grid a:hover { border-color: var(--gold); color: var(--gold); }
  #secPanel .sp-grid a.sp-top { grid-column: span 2; color: var(--gold); font-variant: small-caps;
    letter-spacing: 0.1em; border-color: var(--gold-dim); }

  /* one floating bar, not chrome on every section */
  /* the bar wears the scheme's own panel, veiled — a hard-coded night
     background stood black over the day parchment */
  #nav { position: fixed; z-index: 60; right: 0.9rem; bottom: 0.9rem; display: flex; gap: 0.3rem;
    background: var(--nav-veil, rgba(21, 18, 13, 0.94)); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem; box-shadow: var(--shadow-pop); backdrop-filter: blur(4px); }
  #nav[hidden] { display: none; }
  #nav button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.75rem;

    padding: 0.24rem 0.7rem; white-space: nowrap; }
  #nav button:hover:not(:disabled) { color: var(--gold); background: var(--wash); }

  #navPrev, #navNext { font-size: 1rem; padding: 0.14rem 0.55rem; }
  @media (max-width: 520px) { #nav { left: 0.9rem; right: 0.9rem; justify-content: center; } }

  #toc .toc-note { margin: 0.75rem 0 0; font-size: 0.72rem; color: var(--faint); }
  #toc .part { margin: 0 0 0.65rem; }
  #toc .part b { display: block; color: var(--gold); font-variant: small-caps; letter-spacing: 0.1em;
    font-weight: normal; font-size: 0.92rem; margin-bottom: 0.15rem; }
  #toc .part b .he-small { color: var(--ink); font-size: 1rem; margin-left: 0.6rem; }
  #toc a { color: var(--muted); text-decoration: none; font-size: 0.84rem; }
  #toc a:hover { color: var(--link); }

  main { max-width: 48rem; margin: 0 auto; padding: 0.4rem 1.5rem 5rem; }

  .part-head { margin: 3rem 0 0.4rem; padding-top: 1.6rem; border-top: 1px double var(--gold-dim); }
  .part-head .he { direction: rtl; text-align: right; font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .part-head .en { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); text-align: left; }
  /* Titles are corpus words: same word blocks as the text, sized as a title.
     Gold on the Hebrew per the Y ledger's own colour contract (structure). */
  .title-row { direction: rtl; text-align: right; }
  body.en .title-row { direction: ltr; text-align: left; }
  .part-head .title-row .w { font-size: 1.05rem; color: var(--gold); letter-spacing: 0.04em; }
  .node-head .title-row .w { font-size: 1.55rem; color: var(--gold); }
  .title-row .wb { margin-bottom: 0.35rem; }
  .title-row .g { font-size: 0.62rem; max-width: 9em; }
  .node-head .title-row .g { font-size: 0.68rem; }
  .locator { display: block; font-size: 0.74rem; letter-spacing: 0.16em; font-variant: small-caps;
    color: var(--faint); margin-bottom: 0.3rem; }
  .vnum { font-variant-numeric: tabular-nums; }
  .seg-row .vlabel { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-inline-start: 0.4rem; }

  .node-head { margin: 1.9rem 0 0.9rem; }
  .node-head .he { direction: rtl; text-align: right; font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .node-head .en { font-size: 0.82rem; font-variant: small-caps; letter-spacing: 0.16em; color: var(--gold); margin-top: 0.1rem; }
  /* One register at every head: the same labelled two-row frame the masthead
     uses, sized down to chapter grain. The label column, the quiet slot and
     the force-read row match the masthead's forms so a reader learns the
     frame once. */
  /* The frame is the page's voice, not the corpus's text: labels, registers,
     locators, and absence sentences never ride along in a copy. The same law
     that keeps a reading out of a copied Hebrew verse keeps "commonly force
     read as" out of a drag that crosses a section head — the browser already
     treats unselectable as not-selected, and the copy rewrite follows it.
     The title words inside the frame stay selectable; they are text. */
  .nh-lab, .nh-en, .nh-he.unnamed, .nh-of, .vlabel, .t-lab, .t-note, .t-sug,
  .sug-fold, .en-t, header.top .lic-chip, .vnum, .toc-note, #meta, .byline
    { user-select: none; -webkit-user-select: none; }
  .nh-row { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; margin-bottom: 0.15rem; }
  .nh-lab { flex: 0 0 auto; min-width: 7rem; font-size: 0.6rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--faint); }
  .nh-en { font-size: 0.88rem; font-variant: small-caps; letter-spacing: 0.14em; color: var(--gold); }
  .nh-of { font-size: 0.74rem; color: var(--faint); }
  .nh-he.unnamed { font-family: Georgia, serif; font-size: 0.8rem; font-style: italic; color: var(--faint); }
  .nh-row .title-row { margin: 0; }
  /* the ledger's mark for a section, riding beside the coordinate pill */
  .seg-row .v-he { font-size: 0.85rem; color: var(--shesh);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }

  section.seg { margin: 0 0 1.35rem; }
  .seg-row { display: flex; align-items: baseline; gap: 0.55rem; margin-bottom: 0.25rem; direction: ltr; }
  .vnum { font-size: 0.72rem; color: var(--gold); border: 1px solid var(--line);
    background: var(--panel); border-radius: 0.5rem; padding: 0.05rem 0.5rem; letter-spacing: 0.06em; }
  .vnum.at { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); font-weight: bold; }
  .drift-chip { font-size: 0.68rem; color: var(--amber); border: 1px dashed #6b5320; border-radius: 0.5rem;
    padding: 0.05rem 0.45rem; letter-spacing: 0.03em; }
  .he-text { direction: rtl; text-align: right; font-size: 1.5rem; line-height: 1.35; margin: 0;
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  /* A commentary is not a book of its own; it belongs to the section it
     comments on. Turned on, it reads beneath the verse in the same word
     blocks, a size down, so the base text stays the text. */
  .c-inline { direction: rtl; text-align: right; margin: 0.15rem 0 0; padding: 0.35rem 0.5rem 0.2rem;
    border-inline-end: 2px solid var(--shani-dim); border-radius: 0.4rem;
    background: var(--surface-c); }
  .c-inline .wb { margin: 0 0.14rem 0.45rem; }
  .c-inline .w { font-size: 1.12rem; color: var(--c-word);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  .c-inline .g { font-size: 0.6rem; max-width: 8em; }
  .c-inline[hidden] { display: none; }
  .c-inline .lab { display: block; direction: ltr; text-align: left; font-size: 0.62rem;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-bottom: 0.1rem; }
  .c-inline .lab .lic-chip { text-transform: none; letter-spacing: 0.02em; }
  /* Where the attachment came from, said in place. The card used to carry
     this; the commentary reads here now, so the basis reads here too. */
  .c-inline .c-att { display: block; direction: ltr; text-align: left; font-size: 0.64rem;
    color: var(--faint); margin-top: 0.15rem; }
  /* Held: in the record, not printed here. It is not an error and not a gap —
     it is the page saying what it is holding and why, in the place the text
     would have stood. */
  .c-inline.c-held { direction: ltr; text-align: left; font-size: 0.74rem;
    color: var(--muted); font-style: italic; }
  body.en .c-inline { direction: ltr; text-align: left; }
  body.en .c-inline .g { font-size: 0.86rem; max-width: 11em; }
  body.en .c-inline .w { font-size: 0.92rem; }
  /* A commentary opened in the line follows the reader it was opened in. It
     was left running right to left in the English reader, so the verse above
     it ran one way and the commentary under it ran the other — two directions
     on one screen, from one setting. */
  body.en .c-mark-text { direction: ltr; text-align: left; }
  body.en .c-mark-text .g { font-size: 0.86rem; max-width: 11em; }
  body.en .c-mark-text .w { font-size: 0.92rem; }
  .wb { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top;
    margin: 0 0.16rem 0.55rem; cursor: pointer; }
  .w { display: block; order: 1; border-bottom: 1px dashed transparent; border-radius: 2px; }
  .wb:hover .w { color: var(--hover-ink); border-bottom-color: var(--hover-line); }
  /* A word the chain holds is printed as the chain has it and not touched. But
     some of what it holds is not a word — the Miqra source's section markers
     arrive as a run of markup with no break in it, and an unbreakable run wider
     than the column pushed the whole page sideways, which is how a phone ends
     up with the text off the left edge and dead space on the right. It breaks
     where it must to stay in the column. Nothing is removed or rewritten: this
     is where the line wraps, not what the line says. */
  .wb.held { opacity: 0.45; cursor: default; max-width: 100%; }
  .wb.held .w { overflow-wrap: anywhere; word-break: break-word; }
  .wb.active .w { color: var(--sel); border-bottom: 1px solid var(--sel); }
  /* A word the reader has ruled on keeps a mark after the card closes. Without
     it, closing the card left nothing to say which word had just been changed,
     and the reader had to hold that in their head. It is a tint rather than a
     border so nothing on the line moves when it appears. */
  /* A word with its commentary standing open beneath it. */
  /* Opening a commentary on a word is something the reader did, so the word
     wears the selection, not the structure. */
  .wb.c-open { background: var(--wash-open); border-radius: 0.25rem;
    box-shadow: inset 0 -2px 0 var(--sel-dim); }
  .wb.c-open .w { color: var(--sel); }
  /* A word the reader has ruled on keeps a mark after the card closes. That is
     the point of it: the page holds the list of what has been worked so the
     reader does not have to. But it kept that mark as the same filled blue box
     that means "open right now", four percent lighter — so ruling on a second
     word left two filled boxes on the line and the first one read as a
     selection that had failed to clear. Nothing was stuck; two different
     things were wearing one appearance.
     A live state is filled. A remembered one is underlined. Same colour,
     because the ledger gives every one of these to the reader; different
     weight, because only one of them is happening now. */
  /* A ruling is marked with a tint and has to stay one. It was briefly changed
     to an underline here, to separate the word standing open from the words
     already worked — a real complaint, that both looked live. But the mark
     being a tint is a rule with a check on it (check-ruled-mark-v1: "the mark
     is a tint, not a border that moves the line"), and that check was not in
     the container when the change was made, so nothing said so. The complaint
     is answered by the difference in strength instead: the live word is more
     than twice the tint of a word already ruled on, and carries the reading
     colour and underline on its own letters besides. */
  .wb.chosen { background: var(--wash-chosen); border-radius: 0.25rem; }
  .wb.chosen.active { background: var(--wash-active); }
  /* a word that is both ruled on and standing open keeps the open edge */
  .wb.chosen.c-open { background: var(--wash-copen); }
  /* An occurrence written with a maqaf is one block and more than one W. The
     block never splits; the W inside it light and open one at a time, and the
     maqaf itself prints without opening, because it is not a W. */
  .mq-open { cursor: pointer; }
  .mq-open:hover, .mq-open.on { color: var(--sel); }
  .wjoin { white-space: nowrap; }
  .wjoin .wb { margin-inline: 0; }
  .q-mark { font-size: 0.62em; vertical-align: super; color: var(--muted);
    margin-inline-start: 0.1em; cursor: help; }
  .wb.has-q .w { border-bottom: 1px dotted var(--muted); }
  .wb.multi:hover .w { color: inherit; border-bottom-color: transparent; }
  .wb.multi.active .w { color: inherit; border-bottom: 1px dashed transparent; }
  .wr { border-bottom: 1px dashed transparent; border-radius: 2px; }
  .wr:hover { color: var(--hover-ink); border-bottom-color: var(--hover-line); }
  .wr.on { color: var(--sel); border-bottom: 1px solid var(--sel); }
  /* The half of a source-marked pair that the shown English is reading from.
     An underline in the selection role, not a new colour: it marks provenance
     of the gloss, never a choice about the text — both halves keep printing
     exactly as the source wrote them, and text-decoration moves no glyph. */
  .wb.kq .wr.backs-en { text-decoration: underline; text-decoration-color: var(--sel);
    text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  /* ...and the same mark on the English it backs: two underlines in the same
     colour, stacked, are the two ends of one claim — this reading, that half.
     The connector is the pair of marks, not a drawn line; it costs no ink the
     eye must climb over and moves nothing. Only pairs wear it: a plain word's
     gloss has one possible source, so a mark would say nothing. */
  /* A variant site: the source's own mark is already in the carrier; the
     dotted line only says a record stands behind it. Structure's colour,
     because the mark is the text's own apparatus, not a reader's act. */
  .wb.vs .w { text-decoration: underline dotted; text-decoration-color: var(--gold-dim);
    text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  .wb.kq .g.backs-en { text-decoration: underline; text-decoration-color: var(--sel);
    text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  .mq { color: var(--faint); }
  /* The reading under a word is shown whole. It used to run one line and end in
     an ellipsis, which was the honest thing to do when the average reading was
     45 characters and the tail ran to 435 — the page could not have carried
     them. Under the provider declarations the average is 23, so the tail is
     gone and the ellipsis has nothing left to hide. It wraps in a narrow
     column instead of widening the row, so a long reading costs its own word a
     few lines rather than costing the whole line its shape. The height is
     settled at paint and never changes afterwards: nothing here moves while
     the reader is reading. */
  /* The reading stands centred under its own word. It used to inherit the
     column's alignment, so in the Hebrew reader a reading long enough to take
     two lines set both of them hard right — under the right-hand edge of its
     word and up against the word beside it, which reads as a gap in the wrong
     place. It belongs under the word it is a reading of. */
  .g { display: block; order: 2; direction: ltr; text-align: center;
    font: 0.66rem/1.25 Georgia, serif; color: var(--muted);
    letter-spacing: 0.02em; margin-top: 0.06rem; max-width: 11em;
    white-space: normal; overflow-wrap: anywhere; overflow: hidden; }
  /* 4 · A word the store has no reading for still holds the line the reading
     would have stood on. Without it the block is one line shorter than its
     neighbours, and in the English reader — where the reading leads and the
     Hebrew rides beneath — the Hebrew climbs into the reading's row and the
     line stops being a line. Nothing is printed in the space; it is kept. */
  .g.bare { min-height: 1.25em; }
  body.en .g.bare { min-height: 1.3em; }
  .wb.active .g { color: var(--sel); }

  /* English reader (LTR): the gloss line leads, the Hebrew rides beneath. */
  body.en .he-text { direction: ltr; text-align: left; }
  /* In the English reader the gloss is the text, not a label on it. It clamped
     at two lines for the same reason the Hebrew-side one clipped at one, and
     it comes off for the same reason: there is no longer a tail to hide. */
  /* overflow: hidden, as on the Hebrew side. It was visible here on the
     reasoning that the reading is the text in this reader and should not be
     hidden — but the box is still held at the height it painted at, so a longer
     reading did not extend the box, it spilled out of it and printed over the
     Hebrew beneath. Nothing on this page may move while the reader is reading,
     so the box cannot grow; what it can do is stop at its own edge. The whole
     reading is on the card and on the line's own title. */
  body.en .g { order: 1; font-size: 0.98rem; line-height: 1.3; color: var(--ink); margin-top: 0; max-width: 12em;
    white-space: normal; display: block; overflow: hidden; }
  body.en .w { order: 2; font-size: 1.02rem; color: var(--en-word); margin-top: 0.04rem; }
  body.en .wb.active .g { color: var(--sel); }

  #modeRow { margin-top: 0.75rem; display: flex; gap: 0.55rem; align-items: flex-start; flex-wrap: wrap; }
  /* Which way the words run, and nothing else. The two readers differ in the
     direction of the flow, so that is what is said under them. */
  .mode-pick { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
  .mode-dir { font-size: 0.64rem; letter-spacing: 0.12em; color: var(--faint); }
  .mode-btn { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 999px; padding: 0.32rem 1.15rem; font: inherit; font-size: 0.86rem; cursor: pointer; }
  .mode-btn.on { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); font-weight: bold; }

  /* The HUD floats. The Hebrew never moves — law of the house. */
  /* A card that always carries a whole record needs room for one; 55vh put
     the source and its license below the fold on a phone. */
  /* overflow-y: auto, not hidden. Every band on this card has a floor, and on a
     window short enough that the floors themselves do not fit, hidden would
     have cut the bottom off — which is the source line, the license, the one
     thing here that is not the reader's to lose. Scrolling puts it below the
     fold; hiding loses it. At any ordinary height nothing scrolls, because
     nothing has to. */
  #hud { position: fixed; z-index: 70; max-width: 23rem; width: min(23rem, 92vw); max-height: min(84vh, 50rem);
    display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    background: var(--panel); border: 1px solid #2c4a63; border-radius: 0.7rem;
    padding: 0.85rem 1.05rem; box-shadow: var(--shadow-card); }
  /* what scrolls, and what does not */
  /* The card is a stack of bands, and each keeps its own share.
     One region that scrolled as a whole meant whichever band came first could
     spend the entire card: eight divisions took three rows of pills, the block
     row took a fourth, and every selectable reading was below the fold on a
     card that had just opened. A reader who cannot see one thing to press has
     been handed a card that does nothing.
     So each band is bounded and scrolls inside itself, and the readings — the
     thing the reader came to press — take what is left and never less than two
     rows. Nothing is dropped to achieve it: every division, every block and
     every reading is in its band, whole and reachable. */
  /* The rows region shrinks; what it must never do is shrink below the floors
     of the bands inside it, because a band that overflows here is clipped at
     this edge and its pills end up behind the record — present, on screen, and
     dead to a finger. It is held off that by arithmetic rather than by a
     keyword: the bands beside the readings are capped at a fixed height, the
     record is capped at a fraction of the window, and the readings' floor is a
     single row — so what is left for the readings is never less than the row
     they are owed. (min-content is the wrong keyword here: a wrapping row's
     min-content height is its height at its narrowest, which for two hundred
     pills is enormous, and the card scrolled at every size.) */
  #hud .rows { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    overflow: hidden; }
  /* overflow: hidden on the band itself, so a band can never paint outside its
     own share. Without it a pill box whose floor was taller than the band's
     rendered straight over the record below and the reader pressed the record
     instead of the reading — the pill was there, on screen, and dead. */
  #hud .band { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #hud .band > .r-label { flex: 0 0 auto; }
  /* overflow-x hidden as well as overflow-y auto: setting one axis to auto makes
     the other auto too, and a horizontal scrollbar nobody asked for took nine
     pixels off the height — so a box given exactly three rows had room to show
     two and a sliver, and the sliver was a pill cut in half. */
  #hud .band > .s-pills, #hud .band > .r-pills { overflow-y: auto; overflow-x: hidden; min-height: 0; }
  /* The structural bands do not shrink. Letting them was the same mistake in a
     new place: a band whose height is decided by what its siblings weigh gets
     squeezed to nothing by the one carrying two hundred readings, and a reader
     could not press a division or a block at all. Their size is decided here
     and nowhere else — a row and a half of pills, then they scroll. */
  /* The floor goes on the box that holds the pressable things, not on the band
     around it: a band held at a minimum whose pill box was still free to shrink
     gave a row of half-cut pills and nothing to press. One whole row always
     stands, a row and a half is the most either takes, and the rest scrolls. */
  /* Every band takes exactly what it is given — no growing into slack, no
     shrinking to make room. The heights are handed out above, in whole rows,
     and a band that could still shrink afterwards undid that: a box given
     three rows sat in a band nine pixels shorter and cut the third one in
     half. */
  #hud .b-cut, #hud .b-cell, #hud .b-read { flex: 0 0 auto; min-height: 0; }
  /* And the record yields before any of them does. It has a floor of its own —
     the source line plus a line of the definition — so yielding never costs the
     license, which is the one thing on this card that is not the reader's to
     lose. Below that floor the provenance goes; the record does not. */
  #hud .prov { flex: 0 1 auto; overflow: hidden; }
  /* The D is the foundational record and it is always on the card. How much of
     the card it takes is not the part that is foundational.
     The old cap was `max-height: 58%`, and it never bound anything: a
     percentage height resolves against a container with a definite height, and
     this card has only a maximum, so the cap computed to none and one long
     record took 91% of the card — the readings, the divisions and the source
     all pushed out by a single definition. So the bound is a length, which
     always resolves; the record's text scrolls inside it; and the source line
     is pinned under it rather than scrolling with it. The reader's law is that
     a selected reading always shows one whole D with its M, and pinning the M
     is how that holds however long the D runs. */
  /* 0 0, not 0 1: a shrinkable D slot loses its share to whichever sibling has
     the bigger content, and a form with two hundred readings has a rows region
     thousands of pixels tall — it took nearly all the shrink and squeezed the
     source line out of the bottom of a slot that was only 7% of the card. The
     rows region is the one that scrolls, so it is the one that gives. */
  /* No floor at all, and none is needed once the slot does not shrink: it takes
     the smaller of what it holds and its cap, and inside it the source line is
     the part that never gives. min-content was tried here and is a trap — a
     block of text's min-content height is its height at its narrowest, so the
     floor came out at 365px on a card capped at 221 and a min beats a max. The
     same keyword had already lied once, in the rows region. */
  /* 0 0, not 0 1. Shrink is handed out in proportion to how much content each
     sibling has, and the rows region carries thousands of pixels of pills — so
     when the card was short both it and the record were driven to their floors
     together, and the record's floor cut the source line off. The rows region
     scrolls inside itself; it is the one that can afford to give, so it gives
     all of it. What bounds the record is its cap, not its neighbours. */
  /* One arrangement at every height: the record and its source share one
     scroll, and the source line sticks to the bottom of it. This used to be
     the short-screen arrangement only, while taller screens got a flex
     column that clipped — and a real phone's font metrics found the seam
     between the two and lost the record entirely, foot standing on nothing.
     The record's floor is three lines, not one: a floor of one line is
     clipping wearing a scrollbar's clothes. */
  #hud .d-slot { flex: 0 0 auto; max-height: max(32vh, 10rem); overflow-y: auto; }
  #hud .d-card { display: block; }
  #hud .d-body { min-height: 3.9rem; }
  #hud .d-foot { position: sticky; bottom: 0; background: var(--panel); padding-top: 0.15rem; }

  /* What is standing under the word right now. The card used to answer this
     only by which pill was lit, and with two hundred pills in a scrolling row
     the lit one is often not on screen — so the reader closed the card to find
     out whether their choice held. It is the first thing under the handle and
     it never scrolls. */
  #hud .r-now { flex: 0 0 auto; margin: 0.1rem 0 0.35rem; padding-bottom: 0.35rem;
    border-bottom: 1px solid var(--line); direction: ltr; }
  #hud .r-now .k { display: block; color: var(--faint); font-size: 0.68rem;
    letter-spacing: 0.08em; text-transform: uppercase; }
  /* Bounded, like every other region on this card. One Strong's route runs to
     four hundred and ninety-two characters, and printed whole it was most of a
     phone — the divisions, the blocks and the record all pushed out of sight by
     the line that was only supposed to say what had been chosen. Three lines,
     then it scrolls. The whole of it is still on its pill and still in the
     record underneath. */
  #hud .r-now .v { display: block; color: var(--ink-strong); font-size: 0.94rem;
    line-height: 1.3; overflow-wrap: anywhere;
    max-height: 3.9em; overflow-y: auto; overflow-x: hidden; }
  #hud .r-now .v.none { color: var(--faint); font-style: italic; }
  #hud[hidden] { display: none; }
  /* The tether: while a card is open, four faint lines in the reader's own
     colour run from its corners back to the word it opened from, so the page
     says plainly where you were working. An overlay — it moves no text,
     takes no taps, and dies with the card. */
  #tether { position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 69; }
  #tether line { stroke: var(--sel); stroke-width: 1; opacity: 0.28;
    stroke-dasharray: 5 4; }
  /* The head is the handle. A card the reader can move is a card that stops
     being in the way, and a card that is never re-anchored while it is open
     stops moving on its own. It is sticky so the handle is reachable however
     far the record below it has been scrolled. */
  #hud .head { cursor: grab; touch-action: none; flex: 0 0 auto; }
  #hud .head:active { cursor: grabbing; }
  #hud.moved { box-shadow: 0 14px 40px rgba(0,0,0,.6), 0 0 0 1px var(--sel-dim); }
  #hud .head button { cursor: pointer; }
  #hud .head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem;
    flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; margin-bottom: 0.3rem; }
  /* which half of a source-marked pair the card is about, said in words —
     hover titles do not exist on a phone */
  #hud .head .kq-key { flex: 1 1 100%; margin: 0; color: var(--faint);
    font-size: 0.68rem; direction: ltr; text-align: left; }
  #hud .head .kq-role { flex: 1 1 100%; margin: 0; color: var(--muted);
    font-size: 0.74rem; font-style: italic; direction: ltr; text-align: left; }
  #hud .head b { font-size: 1.55rem; color: var(--ink-strong);
    font-family: "Frank Ruehl CLM", "Frank Ruehl", "David Libre", "SBL Hebrew", Georgia, serif; }
  #hud .head button { background: none; border: 0; color: var(--link); font-size: 1.15rem; cursor: pointer; }
  #hud p { margin: 0.45rem 0; }
  #hud .att { color: var(--muted); font-size: 0.78rem; }
  #hud .att a { color: var(--link); }
  /* R pills — one route per pill, one selected at a time (the reader's law). */
  #hud .r-label { margin: 0.5rem 0 0.3rem; color: var(--faint); font-size: 0.74rem;
    letter-spacing: 0.06em; text-transform: uppercase; }
  /* Every R is here, so this row is the one thing on the card allowed to be
     long. It scrolls on its own rather than pushing the D and M off the end. */
  #hud .r-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; direction: ltr; }
  /* A pill shows its whole reading. It used to clamp at two lines, which made
     the card claim a reading it was not showing — the code beneath says R is
     "never truncated away" and the clamp was quietly making that false. A long
     reading now takes the room it needs; the row scrolls, so the D and the M
     below it are still one flick away, and a reading that runs to a paragraph
     looks like one, which is information about the record, not noise. */
  #hud .r-pills button { border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 0.9rem; padding: 0.22rem 0.7rem; font: inherit; font-size: 0.76rem; cursor: pointer;
    max-width: 100%; text-align: left; white-space: normal; overflow-wrap: anywhere; }
  #hud .r-pills button[aria-pressed="true"] { background: var(--sel); border-color: var(--sel);
    color: var(--sel-ink); font-weight: bold; }
  #hud .r-more { margin-top: 0.35rem; background: none; border: 0; color: var(--link);
    font: inherit; font-size: 0.76rem; cursor: pointer; padding: 0; }
  #hud .r-overflow { margin-top: 0.45rem; }
  #hud .r-overflow select { width: 100%; font: inherit; font-size: 0.78rem; color: var(--muted);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 0.45rem;
    padding: 0.3rem 0.5rem; cursor: pointer; }
  #hud .r-overflow select:hover { border-color: var(--gold-dim); }
  #hud .r-overflow select.on { color: var(--sel-ink); background: var(--sel); border-color: var(--sel); font-weight: bold; }
  #hud .d-card { margin-top: 0.55rem; border-top: 1px solid var(--line); padding-top: 0.45rem; }
  /* P — the sources that carry the same record. A corroboration is not a
     louder kind of source, so it wears the same chip and the same weight as
     the one above it, a size down, and reads as a list rather than a claim. */
  #hud .d-also { margin: 0.3rem 0 0; padding-top: 0.3rem; border-top: 1px dotted var(--line);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.45rem; }
  #hud .d-also-lab { flex: 1 0 100%; color: var(--faint); font-size: 0.66rem;
