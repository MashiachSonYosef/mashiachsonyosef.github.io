     over, and it obeys the license of every record it would carry. */
  .xp-row { display: flex; gap: 0.4rem; margin: 0.55rem 0 0.2rem; direction: ltr;
    flex-wrap: wrap; align-items: center; }
  .xp { font-size: 0.68rem; color: var(--muted); border: 1px solid var(--line);
    background: var(--panel2); border-radius: 0.5rem; padding: 0.12rem 0.5rem;
    letter-spacing: 0.04em; cursor: pointer; font-family: inherit; }
  .xp:hover { border-color: var(--gold-dim); color: var(--shesh); }
  .xp.armed { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); font-weight: bold; }
  .xp.busy { opacity: 0.6; cursor: progress; }
  .xp-note { font-size: 0.66rem; color: var(--faint); direction: ltr; flex: 1 1 100%; margin: 0.1rem 0 0; }
  .xp-note b { color: var(--shesh); font-weight: normal; }
  .xp-note .held { color: var(--amber); }
  .xp-lab { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-inline-end: 0.15rem; }
  #bookExport { max-width: 48rem; margin: 2.2rem auto 0; padding: 0 1.5rem; direction: ltr; }
  #bookExport .xp-lab { display: block; margin-bottom: 0.35rem; }
  #prov a { color: var(--shesh); }

  footer { max-width: 48rem; margin: 0 auto; padding: 1.1rem 1.5rem 2.2rem; font-size: 0.76rem;
    color: var(--faint); border-top: 1px solid var(--line); direction: ltr; text-align: left; }

  @media (max-width: 640px) {
    .he-text { font-size: 1.32rem; line-height: 2.05; }
    header.top h1 { font-size: 1.5rem; } header.top h1 .he-t { font-size: 1.7rem; }
  }
</style>
</head>
<body>
<header class="top">
  <!-- The way out, where the eye goes first and in the same corner on every
       page. It used to be one link inside a row that also offered the other
       books, which put two different jobs in one line and made the way home
       the least noticeable thing in it. A book offers its own text; the door
       offers the books. -->
  <nav id="home"><span class="nav-lab">home:</span><a href="/" class="home">The Tabernacle</a><button id="face" class="face" type="button" title="the other face of the page">day</button></nav>
  <h1 id="workTitle">
    <span class="t-row"><span class="t-lab">book title</span><span class="he-t" lang="he" dir="rtl"></span></span>
    <span class="t-row"><span class="t-lab" id="enLab">listed in the catalog as</span><span class="en-t">Zone reader</span><span class="lic-chip" id="workLic" hidden></span></span>
  </h1>
  <p class="byline" id="byline"></p>
  <p id="meta">Loading the zone…</p>
  <!-- What this build stands on, and which slots stand open. A sealed work
       and a typed-basis work used to wear the same face here, and Y's held
       commentaries appeared nowhere at all. These lines are filled from
       data/work-basis-v1.json, which a tool derives from the build plan and
       the hold ledgers; nothing here is typed into this file, and nothing
       here is an alarm — a slot is named quietly and fills when its record
       lands, the same way the title line already works. -->
  <p id="basisLine" hidden></p>
  <p id="holdsLine" hidden></p>
  <p id="rightsLine" hidden></p>
  <!-- Navigation carries coordinates, not corpus text. A book's title is corpus
       text and belongs where it can be tapped and defined — the masthead, out
       of the ledger, with its records behind it. The Hebrew that stood here was
       a copy I typed: it matched, but a copy is not a source, and a copy is the
       one thing on the page nothing stands behind. -->

  <div id="modeRow">
    <span class="mode-pick"><button type="button" class="mode-btn on" id="modeHe" aria-describedby="dirHe">Hebrew reader</button><span class="mode-dir" id="dirHe">right to left</span></span>
    <span class="mode-pick"><button type="button" class="mode-btn" id="modeEn" aria-describedby="dirEn">English reader</button><span class="mode-dir" id="dirEn">left to right</span></span>
    <button type="button" class="mode-btn" id="layerC" hidden></button>
  </div>
</header>
<div id="toc" hidden><button type="button" id="tocHead" aria-expanded="false" aria-controls="tocBody"><span class="toc-t">Contents</span><span class="toc-n"></span></button><div id="tocBody" hidden></div><div id="secPanel" hidden></div></div>
<div id="nav" hidden>
  <button id="navTop" type="button" title="Back to the top of the page">Top</button>
  <button id="navChapter" type="button" title="Back to the top of this chapter">Chapter</button>
  <button id="navPrev" type="button" aria-label="Previous chapter" title="Previous chapter">&lsaquo;</button>
  <button id="navNext" type="button" aria-label="Next chapter" title="Next chapter">&rsaquo;</button>
</div>
<main id="text"></main>
<div id="hud" hidden></div>
<footer id="prov"></footer>
<script>
(async () => {
  // Every ?param this page reads, taken once and here. The rewrite a few lines
  // down empties location.search, so anything read after it sees nothing — and
  // ?at= reached through a clean address was already arriving empty for exactly
  // that reason. One read, before the address changes, and nothing downstream
  // has to know the order.
  const QUERY = new URLSearchParams(location.search);
  // Which work this page is, and where the reader's own files live. A work's
  // address serves the reader itself, and the build wrote both facts into
  // this page's head — nothing here guesses, and the address in the bar is
  // the work's own from the first byte, never rewritten. The bare instrument
  // zone.html carries no metas: it still answers ?b= for the checks, locates
  // its files beside itself, and with no book named it says so rather than
  // assuming one.
  const META = (name) => document.querySelector(`meta[name="${name}"]`)?.content || "";
  // The slug alphabet is letters in any script, digits, and hyphens — most
  // of this shelf's recorded ids are the works' own Hebrew opening words,
  // and an ASCII-only scrub here turned every one of those books into a
  // dark page. What the scrub actually guards is the fetch path, so what it
  // strips is everything that is not a letter, a digit, or a hyphen: no
  // dots, no slashes, no percent tricks survive.
  const BOOK = (META("reader-book") || QUERY.get("b") || "").replace(/[^\p{L}\p{N}-]/gu, "");
  const ROOT = META("reader-home") || location.pathname.replace(/[^/]*$/, "");
  // What the house calls itself. The door builder injects it, derived from the
  // address the site answers at; a bare reader carries no meta and keeps the
  // project's working name. Typed in one place, shown in two.
  const SITE = META("site-name") || "The Tabernacle";
  { const h = document.querySelector("#home a.home"); if (h) h.textContent = SITE; }
  // the face button carries the name of the face it would turn to
  {
    const face = document.getElementById("face");
    const nameOther = () => { face.textContent = document.documentElement.dataset.scheme === "day" ? "night" : "day"; };
    nameOther();
    face.addEventListener("click", () => {
      window.__face.set(document.documentElement.dataset.scheme === "day" ? "night" : "day");
      nameOther();
    });
  }
  const unpack = async (res) =>
    JSON.parse(await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text());
  // The door keeps the seals; the shelf keeps the weight. A zone bin may be
  // served from another host — the store record beside this reader names it —
  // and a bin that crosses a host boundary is past a border, which is where
  // a hash does its work. The pins live in this repository, published with
  // the door; the bin is hashed as it arrives and refused on a mismatch, so
  // moving the shelf can never move the text. A remote bin with no pin at
  // home is a border crossing with no seal to check, and is refused the same
  // way. A local bin with no pin still shows: the repository itself is its
  // custody, the same custody this page has always stood on.
  const ZONE_STORE_RULE = "zone-store-rule-v1-the-door-keeps-the-seals-the-shelf-keeps-the-weight";
  let ZSTORE = null;
  try {
    ZSTORE = await fetch(`${ROOT}data/zone-store-v1.json`, { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : null));
  } catch { ZSTORE = null; }
  const binUrl = (name) => (ZSTORE && ZSTORE.base
    ? `${String(ZSTORE.base).replace(/\/$/, "")}/${name}.bin`
    : `${ROOT}data/zones/${name}.bin`);
  const hexOf = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  const fetchBin = async (name) => {
    const res = await fetch(binUrl(name));
    if (!res.ok) throw new Error(`${name}.bin: ${res.status}`);
    const buf = await res.arrayBuffer();
    const pin = ZSTORE && ZSTORE.pins && ZSTORE.pins[`${name}.bin`];
    if (pin && crypto.subtle) {
      const got = hexOf(await crypto.subtle.digest("SHA-256", buf));
      if (got !== pin.sha256)
        throw new Error(`REFUSED: ${name}.bin arrived not matching its pin — the store record expects sha256 ${pin.sha256.slice(0, 16)}… and this fetch carried ${got.slice(0, 16)}…. Nothing that fails its seal is shown. (${ZONE_STORE_RULE})`);
      window.__binShas = window.__binShas || {};
      window.__binShas[`${name}.bin`] = got;
    } else if (ZSTORE && ZSTORE.base) {
      throw new Error(`REFUSED: ${name}.bin is served from another host and carries no pin in the store record — a border crossing with no seal to check. Nothing is shown. (${ZONE_STORE_RULE})`);
    }
    return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  };
  // A record packs senses with ";" — but only the semicolons the provider wrote
  // between senses. One inside its own parentheses is part of what the
  // parenthesis says: "belonging to you (plural; more owners)" is one reading,
  // and cutting it there hands the reader "belonging to you (plural" — a run
  // with a bracket that never closes, which the provider never wrote.
  //
  // Same clause as the comma rule one layer down: the mark separates at
  // parenthesis depth zero and nowhere else, and the pieces rejoin, character
  // for character, into the text they came from.
  // A sense divides into readings at the commas outside the provider's own
  // parentheses — sense-split-rule-v2, mirrored from tools/sense-split-v1.mjs
  // so the pill that comes up pressed is the reading already printed under
  // the word. A text whose parentheses do not balance is damaged: something
  // already edited it, and it is held whole, neither printed nor pooled.
  const readingSplit = (text) => {
    const s = String(text);
    let depth = 0;
    for (let i = 0; i < s.length; i += 1) {
      if (s[i] === "(") depth += 1;
      else if (s[i] === ")") { depth -= 1; if (depth < 0) return { readings: [s], damaged: true }; }
    }
    if (depth !== 0) return { readings: [s], damaged: true };
    const raw = []; let start = 0; depth = 0;
    for (let i = 0; i < s.length; i += 1) {
      const c = s[i];
      if (c === "(") depth += 1;
      else if (c === ")") depth -= 1;
      else if (c === "," && depth === 0) { raw.push(s.slice(start, i)); start = i + 1; }
    }
    raw.push(s.slice(start));
    return { readings: raw.map((piece) => piece.trim()).filter(Boolean), damaged: false };
  };
  // P · two D records are one record when they carry the same set of
  // readings, however each provider packed them — ";" between senses, ","
  // inside a sense at parenthesis depth zero, "/" between spans — folded by
  // case exactly as the pool folds readings. The bytes each source wrote
  // stay its own and print verbatim; P only says who is carrying the same
  // record. Byte-identity was the old test, and it kept "Most High" and
  // "most high" — one record by this law — from ever corroborating.
  const pKey = (text) => {
    const set = new Set();
    for (const sense of senseSplit(text)) {
      const r = readingSplit(sense);
      for (const piece of (r.damaged ? [sense] : r.readings))
        for (const span of piece.split("/")) {
          const t = span.trim().toLowerCase();
          if (t) set.add(t);
        }
    }
    return [...set].sort().join("\u0001");
  };
  const senseSplit = (text) => {
    const t = String(text || "");
    const out = []; let start = 0, d = 0;
    for (let i = 0; i < t.length; i += 1) {
      const c = t[i];
      if (c === "(") d += 1;
      else if (c === ")") { if (d > 0) d -= 1; }
      else if (c === ";" && d === 0) { out.push(t.slice(start, i)); start = i + 1; }
    }
    out.push(t.slice(start));
    // if they do not rejoin they are not its pieces, and it stays whole
    if (out.join(";") !== t) return [t.trim()].filter(Boolean);
    return out.map((x) => x.trim()).filter(Boolean);
  };

  // The chip prints the name the declarations record carries for the posture,
  // never one re-derived from the letters of its key: a dual offer is named
  // as a dual, and a posture the record does not declare is named by its key,
  // verbatim — the visible cue that a declaration is missing.
  let POSTURES = null;
  const licenseName = (posture) => {
    const p = String(posture || "");
    if (!p) return "License unrecorded";
    const row = POSTURES && POSTURES.postures && POSTURES.postures[p];
    return (row && row.name) || p;
  };
  let zone, index;
  try {
    [zone, index, POSTURES] = await Promise.all([
      fetchBin(BOOK),
      // The index names the store's version, and every shard URL carries it.
      // So this one small file is the only thing that must never be stale:
      // revalidated on each load (a 304 when nothing moved), and everything
      // downstream is then addressed by content rather than by name.
      fetch(`${ROOT}data/route-store/index.json`, { cache: "no-cache" }).then((r) => r.json()),
      // The posture record: names, export permission and obligations, one
      // projection of tools/declarations-v1.json. Its absence does not stop
      // the page — the chips fall back to keys verbatim and every export is
      // refused, which is the record's own default for the undeclared.
      fetch(`${ROOT}data/license-postures-v1.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    // The zone as it arrived, by the same rule the commentary sidecar is
    // exposed under: a check should be able to ask the record what it says
    // rather than ask the page what it decided. A check that reads its answer
    // off the page it is checking proves only that the page is consistent
    // with itself.
    window.__zone = zone;
  } catch (e) {
    // a refusal is not an absence: a bin that failed its seal says so in the
    // refusal's own words, and a page with no book keeps the honest silence
    document.getElementById("meta").textContent =
      String((e && e.message) || "").startsWith("REFUSED")
        ? e.message
        : "No book is published on this page yet — no walk has landed. The page takes its name from the zone when one arrives; nothing is shown, and nothing is named, that has not come through the pipeline.";
    return;
  }
  // A fixture is a test instrument, not a work. It carries no license identity,
  // so it may not be served as one — the refusal is structural rather than a
  // matter of nobody linking to it. Every Hebrew string in a fixture is
  // invented for the test; none of it is corpus, and none of it is published.
  if (String(zone.schema_version || "").includes("FIXTURE")
      && QUERY.get("fixture") !== "1") {
    document.getElementById("meta").textContent =
      "This zone is a test instrument, not a published work. It carries no license identity and is not served. Nothing is shown.";
    return;
  }
  // The book is named in Hebrew where the Y ledger promoted a name for it, and
  // in English only where it did not. The English is a locator, not the title,
  // so it is not dressed up as one — and no Hebrew name is typed in here that
  // did not come through the ledger.
  // The Hebrew title and the English name are one thing, always shown together:
  // the Hebrew is the book's own name and the English is how a reader who does
  // not read it knows what they are looking at. Neither is decoration for the
  // other, so neither appears without it.
  const heT = document.querySelector("#workTitle .he-t");
  // A mark in the text that transmits an assertion must open the record of
  // that assertion. Two targum parenthesis sites stood in the live zones as
  // typography to guess at — as written, so not the markup-leak class, but
  // apparatus with no record saying what the wrapping asserts. Under this
  // rule a zone carries each such site as a record on the word (vs: the
  // source's own sentence, and where it is read from); the carrier prints
  // exactly as the source wrote it, the word opens the record, and the gate
  // refuses a zone that declares the rule and ships a marked site bare.
  // Declared here, above the masthead that names it.
  const VS_RULE = "variant-site-rule-v1-the-mark-opens-a-record-or-the-zone-does-not-board";
  const enT = document.querySelector("#workTitle .en-t");
  heT.textContent = zone.work_he || "";
  // Until a licensed record is found to back the ledger's English (checked
  // just below), the line reads the work's own address plainly — hyphens as
  // spaces — which asserts nothing beyond the address itself.
  const ADDR_PLAIN = (BOOK || location.pathname.split("/").filter(Boolean).pop() || "")
    .replace(/[-_]+/g, " ");
  // A name slot never dresses a record as prose — the owner's ruling. The
  // recorded id prints plainly only when what results is plain Latin text;
  // an id in another script or shape (2,933 of the bridge's ids are works'
  // own Hebrew titles with a catalog number) is not shown as a name. The
  // slot says the absence in words and the raw id rides in the hover.
  const nameCandidate = ADDR_PLAIN || zone.work || "";
  if (/^[a-z0-9 ]+$/i.test(nameCandidate) && /[a-z]/i.test(nameCandidate)) {
    enT.textContent = nameCandidate;
  } else {
    enT.textContent = "none is recorded in plain letters";
    enT.classList.add("unnamed");
    if (nameCandidate) enT.title = nameCandidate;
  }
  if (!zone.work_he) {
    // Say what is missing rather than letting the common name slide into the
    // place of the title. An empty line under "book title" reads as a title
    // that failed to load; this says the ledger has not named one.
    const y = zone.emitted_from.y_ledger || {};
    heT.classList.add("unnamed");
    heT.textContent = "no name is on record";
    if (y.status) heT.title = y.status;
  }
  document.title = `${zone.work_he ? `${zone.work_he} · ` : ""}${zone.work} · ${SITE}`;
  document.getElementById("byline").textContent = zone.byline || "";
  const ac = zone.emitted_from.acquisition, wk = zone.emitted_from.walk, oc = zone.emitted_from.identity_oracle;
  // What this is, in one line. Everything the zone can prove about itself used
  // to print here, because when this page was first written there was nowhere
  // else for a receipt to live. There is now: the card carries the license of
  // every reading, each section names its own commentary, the export writes
  // the whole record into the file, and the footer has carried the hashes all
  // along. So the proof moves down to join them and stops standing between the
  // reader and the text. Nothing is dropped — the same sentence is one press
  // away, and the footer block is unchanged.
  const renderedWordTotal = (zone.sections || []).reduce((t, s) => t + (s.words || []).length, 0);
  const receiptsText =
    `${renderedWordTotal.toLocaleString()} words · ${zone.counts.sections.toLocaleString()} sections · ` +
    `${renderedWordTotal !== zone.counts.words
      ? `the artifact\u2019s counts field says ${zone.counts.words.toLocaleString()} \u2014 it counts the chain\u2019s c0 rows where the words stand at W grain; its word-grain receipts await the corpus-side rebuild \u00b7 `
      : ""}` +
    (wk ? (/RESIDENT_SERVE/.test(wk.route || "")
      ? `served id-by-id from the seal-verified terminal reader artifacts (${(wk.found_exact ?? wk.ids_walked).toLocaleString()} of ${wk.ids_walked.toLocaleString()} ids FOUND_EXACT${wk.found_exact !== undefined && wk.found_exact !== wk.ids_walked ? `, the rest held from the Hebrew reader by the chain\u2019s own rights and script axes` : ""}; the installed sealed reader re-answered ${wk.sealed_oracle.report.sampled} sampled ids ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact) · rights ride per occurrence from the chain · `
      : `walked word-by-word through the installed sealed terminal reader (${(wk.found_exact ?? wk.ids_walked).toLocaleString()} of ${wk.ids_walked.toLocaleString()} ids FOUND_EXACT) · rights ride per occurrence from the chain · `) : `Hebrew text: ${ac.hebrew_version}${ac.hebrew_source ? ` via ${ac.hebrew_source}` : ""}, license ${ac.hebrew_license_seen} (seen live on every payload) · `) +
    `${zone.counts.verified_units} of ${zone.counts.sections} sections verified word-for-word in count against the sealed corpus allocation` +
    `${zone.counts.drifted_units ? `; ${zone.counts.drifted_units} drift from it and are marked` : ""} · ` +
    `${zone.counts.glossed_words ? zone.counts.glossed_words.toLocaleString() + " words carry their oldest-sourced catalog route as an English gloss (exact spellings only — unmatched forms stay bare) · " : ""}` +
    // The bracket convention is the source's own notation, taught once per
    // book rather than decorated per occurrence: apparatus at the grain
    // where it varies, instruction once per witness.
    `${(() => { const n = (zone.sections || []).reduce((a, s) => a + ((s.words || []).filter((w) => w.kq).length), 0);
      return n ? `${n.toLocaleString()} places carry a source-marked pair, printed exactly as the source writes it — the ketiv, as written, in parentheses; the qere, as read, in brackets; either half opens its own record, and the half the shown English reads from is underlined · ` : ""; })()}` +
    `${(() => { const n = (zone.sections || []).reduce((a, s) => a + ((s.words || []).filter((w) => w.vs).length), 0);
      return n ? `${n.toLocaleString()} place${n === 1 ? " carries" : "s carry"} a source-marked variant site, printed exactly as the source writes it, with its record one tap away (${VS_RULE}) · ` : ""; })()}` +
    `${zone.counts.w_regions_with_a_component_system
      ? `${zone.counts.occurrences_holding_more_than_one_w
          ? `${zone.counts.occurrences_holding_more_than_one_w.toLocaleString()} of those occurrences are written with a maqaf and hold two words each, ${zone.counts.w_regions.toLocaleString()} words in all; `
          : ""}` +
        `${zone.counts.w_regions_with_a_component_system.toLocaleString()} words carry a component system, so every complete division of a word and every block inside one opens on its own · `
      : ""}` +
    `tap any word for all routes, sources, and licenses`;
  {
    const meta = document.getElementById("meta");
    meta.replaceChildren();
    // The count printed is the count rendered — summed from the sections this
    // page is about to draw, never read off a receipt field. Where the
    // artifact's own counts field disagrees (the chain counts c0 rows where
    // the words stand at W grain), the receipts drawer says so; the masthead
    // never asserts a number the page does not show.
    const renderedWords = (zone.sections || []).reduce((t, s) => t + (s.words || []).length, 0);
    meta.append(`${renderedWords.toLocaleString()} words in ${zone.counts.sections.toLocaleString()} ${zone.counts.sections === 1 ? "section" : "sections"}, served from the sealed chain. `);
    const more = document.createElement("button");
    more.type = "button"; more.className = "receipts-btn";
    more.textContent = "receipts";
    more.setAttribute("aria-expanded", "false");
    const full = document.createElement("span");
    full.className = "receipts-full"; full.hidden = true; full.textContent = receiptsText;
    more.addEventListener("click", () => {
      const on = full.hidden;
      full.hidden = !on;
      more.setAttribute("aria-expanded", String(on));
      more.textContent = on ? "hide receipts" : "receipts";
    });
    meta.append(more, full);
  }
  // What this build stands on, and which slots stand open — said in the same
  // quiet register as the rest of the masthead. The frame is recorded as "a
  // thing a check may look for and report · never grounds to declare a work
  // deficient", so nothing here shouts: an open slot is named, in the voice
  // of "no name is on record", and it fills when its record lands.
  // Every value is read from data/work-basis-v1.json, derived from the plan
  // and the hold ledgers; nothing on these lines is typed into this page.
  (async () => {
    let wb = null;
    try { wb = await fetch(`${ROOT}data/work-basis-v1.json`).then((r) => (r.ok ? r.json() : null)); } catch { wb = null; }
    const entry = wb && wb.works && wb.works[BOOK];
    if (!entry) return;
    const basisEl = document.getElementById("basisLine");
    if (entry.basis === "TYPED_AWAITING_LEDGER") {
      basisEl.append(`No record has been issued yet that names this book or numbers its chapters. It is shown anyway: its place in the sealed text store (${Number(entry.unit_count).toLocaleString()} passages) was entered by hand and is marked as such. Once the record is issued, the hand-entered numbers must be removed before this book will build again.`);
      basisEl.hidden = false;
    } else if (entry.basis === "SEALED_Y_LEDGER") {
      basisEl.append(`chapter names and order are read from this book\u2019s issued navigation record \u2014 ${entry.y_fixture || "record"}${zone.emitted_from.y_ledger?.status ? ` \u00b7 ${zone.emitted_from.y_ledger.status}` : ""}`);
      basisEl.hidden = false;
    }
    if (entry.held_commentaries > 0) {
      const holdsEl = document.getElementById("holdsLine");
      holdsEl.append(`${Number(entry.held_commentaries).toLocaleString()} commentary slots stand open \u2014 `
        + entry.holds.map((h) => h.title).join(", ")
        + ` \u2014 each fills when its exact work id, body, and attachment are proven (${entry.holds_source}).`);
      holdsEl.hidden = false;
    }
    if (entry.entries_without_own_licence > 0) {
      const el = document.getElementById("rightsLine");
      el.append(`${Number(entry.entries_without_own_licence).toLocaleString()} of ${Number(entry.printed_commentary_entries).toLocaleString()} printed commentary entries await their own license receipts from the commentary build \u2014 the work-level license shown for them is real, and the per-entry grain fills when that build runs.`);
      el.hidden = false;
    }
  })();
  document.getElementById("prov").textContent =
    `${zone.work_receipts && zone.work_receipts.b_n ? `${zone.work_receipts.b_n} · ` : ""}` +
    `${zone.rule_id} · route: ${zone.route} · identity oracle ${oc.bridge_sha256.slice(0, 16)}… ` +
    `(${oc.sealed_units.toLocaleString()} units, C0 ${oc.first_c0_numeric_id.toLocaleString()}–${oc.last_c0_numeric_id.toLocaleString()}) · ` +
    (wk ? `${/RESIDENT_SERVE/.test(wk.route || "") ? `serve rule ${wk.walker_rule}; sealed-reader oracle ${wk.sealed_oracle.report.field_exact}/${wk.sealed_oracle.report.sampled} field-exact; ` : `walk: `}module ${wk.module.sha256.slice(0, 12)}…, pointer ${wk.pointer.sha256.slice(0, 12)}… · ${zone.emitted_from.license_receipts.per_occurrence} · ` : `payload sha ${ac.payload_sha256_transferred.slice(0, 16)}… · ${zone.emitted_from.license_receipts.work_activation} · `) +
    `${zone.emitted_from.gloss_layer ? `glosses: ${zone.emitted_from.gloss_layer.rule} (table sha ${zone.emitted_from.gloss_layer.gloss_table_sha256.slice(0, 12)}…; ${zone.emitted_from.gloss_layer.attribution}) · ` : ""}` +
    `${zone.emitted_from.span_layer && zone.emitted_from.span_layer.rule
      ? `components: ${zone.emitted_from.span_layer.rule} from ${zone.emitted_from.span_layer.source.path} (sha ${zone.emitted_from.span_layer.source.sha256.slice(0, 12)}…), ` +
        `${zone.emitted_from.span_layer.forms_with_a_component_system.toLocaleString()} forms, ` +
        `${zone.emitted_from.span_layer.derived_cells.toLocaleString()} blocks and ${zone.emitted_from.span_layer.derived_complete_covers.toLocaleString()} complete divisions derived from the component lists alone · `
      : ""}` +
    `${zone.emitted_from.y_ledger?.consequence || zone.emitted_from.y_ledger?.status || ""}${zone.emitted_from.y_ledger ? " · " : ""}` +
    (zone.emitted_from.sealed_chain_status
      ? `the installed terminal reader does not yet carry this span (partial-rebuild gap); this page runs the acquisition route until a sealed generation includes the book.`
      : (wk && /RESIDENT_SERVE/.test(wk.route || "")
        ? `this zone was served from the sealed chain's own artifacts, seal-verified once, with the installed terminal reader re-answering sampled ids as oracle — the pipeline route, end to end.`
        : `this zone came through the installed terminal reader itself — the pipeline route, end to end.`));
  // explicit license links, from the zone's own receipts
  if (zone.emitted_from.license_links && zone.emitted_from.license_links.length) {
    const provEl = document.getElementById("prov");
    const linkRow = document.createElement("p");
    zone.emitted_from.license_links.forEach((l, i) => {
      if (i) linkRow.append(" · ");
      const a = document.createElement("a"); a.href = l.url; a.target = "_blank"; a.rel = "noreferrer";
      a.textContent = l.label; linkRow.append(a);
    });
    provEl.append(linkRow);
  }

  // Plain English for the two levels of the coordinate — "chapter · verse"
  // for a book of the Tanakh, "section · paragraph" for a work numbered that
  // way. These name the structure; they translate nothing.
  const COORD = zone.emitted_from.coordinate_labels || { major: "section", minor: "paragraph" };
  const MAJOR = COORD.major, MINOR = COORD.minor;
  const MAJOR_C = MAJOR.charAt(0).toUpperCase() + MAJOR.slice(1);
  // U+05BE HEBREW PUNCTUATION MAQAF, named by its codepoint and kept as a
  // capture so that whatever this file splits a word on is the same character
  // it draws back between the pieces. No character of the text is typed here.
  const MAQAF_SPLIT = /(\u05be)/;

  const hud = document.getElementById("hud");
  // The reader's display law: route texts pack morpheme spans with "/"; the
  // page never shows the raw packing — spans join with " + ", exactly the
  // reader's own cell join. One route on display at a time, everywhere.
  const spanJoin = (t) => String(t).split("/").map((x) => x.trim()).filter(Boolean).join(" + ");
  const shardCache = new Map();
  // A shard is addressed by which store it belongs to. Without this a reader
  // whose browser already holds yesterday's shard keeps being answered from it
  // while the page prints today's reading — the two disagreeing on screen.
  const storeVersion = index.store_version || "";
  const routesFor = async (key) => {
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(key));
    const shard = new Uint8Array(digest)[0].toString(16).padStart(2, "0");
    if (!shardCache.has(shard)) {
      const url = `${ROOT}data/route-store/shards/${shard}.bin${storeVersion ? `?v=${storeVersion}` : ""}`;
      shardCache.set(shard, fetch(url).then(unpack).catch(() => null));
    }
    const data = await shardCache.get(shard);
    return data ? data[key] : null;
  };
  let activeEl = null;
  // release=false means the card is being rebuilt for another word, not shut.
  // Only shutting it ends the reader's hold on where it sits — otherwise a
  // card parked out of the way would jump back the moment the next word was
  // tapped, which is the whole thing being fixed.
  const closeHud = (release = true) => {
    hud.hidden = true; hud.replaceChildren();
    activeEl = null; hudAnchor = null;
    if (release) { hudMoved = false; hud.classList.remove("moved"); }
    // a card may have been opened from a whole block or from one W inside it,
    // so both marks are cleared rather than the one we happen to remember
    document.querySelectorAll(".wb.active").forEach((w) => w.classList.remove("active"));
    document.querySelectorAll(".wr.on").forEach((r) => r.classList.remove("on"));
  };
  // Anchor the HUD to whatever was tapped. Three surfaces open it now — a
  // word, a commentary word, and a section's commentary handle — and a
  // commentary card is tall, so "just below" is not always on screen.
  // Below if it fits, above if that fits, clamped into view otherwise; the
  // HUD is never left hanging off the bottom edge with a strip showing.
  let hudAnchor = null;
  // Once a card is open it holds still. Anchoring is for opening; while the
  // reader is working inside a card — switching reading, opening the records
  // drawer — the card is only pulled back into view if it has grown past the
  // edge. Re-anchoring on every internal change is what made it feel shifty:
  // the card was being placed for a height it no longer had.
  // What the reader has settled on: which division of the form they are
  // reading it under, and which reading they chose for each block of it.
  // Both used to live inside the open and died with the card; then they were
  // remembered, but by the occurrence that was tapped, so the same form asked
  // the same question at every place it stood. The catalog's record is the
  // form's, not the occurrence's — every place the same form stands offers
  // the same divisions and the same routes — so the ruling is remembered by
  // the form's own key, and a reading ruled at one place is the reading at
  // all of them.
  const pickedByForm = new Map();       // form key -> { cells: Map(surface -> reading), cut: key }
  const memoryOf = (formKey) => {
    let m = pickedByForm.get(formKey);
    if (!m) { m = { cells: new Map(), cut: null }; pickedByForm.set(formKey, m); }
    return m;
  };
  const cutKey = (c) => c.map((x) => x.surface).join("+");
  // Every place a form stands, recorded as the words are built. A ruling
  // repaints the places already standing; a section built later asks the
  // memory itself, so the ruling reaches it too.
  const standsOf = new Map();           // form key -> [{ wb, glossEl, glossParts, partIndex }]
  const standAt = (k, entry) => {
    if (!k) return;
    let list = standsOf.get(k);
    if (!list) { list = []; standsOf.set(k, list); }
    list.push(entry);
  };
  // The line a ruling composes for one form: the remembered division, each
  // block read from the remembered choice, and a block the reader has not
  // ruled on read from the catalog's own table. Null when nothing was ruled.
  const ruledLine = (k, table) => {
    const m = pickedByForm.get(k);
    if (!m || (!m.cut && !m.cells.size)) return null;
    const surfaces = m.cut ? m.cut.split("+") : [k];
    return surfaces.map((s) => {
      const p = m.cells.get(s);
      if (p) return spanJoin(p.text);
      const g = table ? table[s] : null;
      return g ? spanJoin(g) : "—";
    }).join(" + ");
  };

  // ---- the exporter ---------------------------------------------------
  // An export is the final stop: the thing that leaves the page and is read
  // somewhere else, by someone who will never see this reader. So it carries
  // the license of every record it stands on, and a license that forbids
  // redistribution stops it — per reading, not per file.
  //
  // The Hebrew is the sealed text of the work and rides on the work's own
  // license. A refused reading never removes a Hebrew word; it removes the
  // English beside it, and says so where it stood.
  //
  // licence-wording-rule-v1-the-summary-is-ours-and-the-licence-governs
  //
  // Every obligation line this reader prints is plain English written here. A
  // license is a document; a one-sentence summary of it is not that document
  // and must never be able to stand in for it. Two earlier code paths each
  // carried their own wording for the same letter, so the same license read
  // one way in an export and another way in the pill. Both are replaced by the
  // one table below, and wherever a line from it prints, it prints named as
  // ours, beside the license it summarises and the record that license was
  // released under. The license governs. The sentence only makes the chip
  // readable.
  const LICENCE_RULES = {
    rule: "licence-wording-rule-v1-the-summary-is-ours-and-the-licence-governs",
    whose: "The obligation lines below are plain English written in this reader. They are summaries, not license text, and no license is quoted here. The license named beside each one is what governs, and the record it was released under is linked.",
    by: "Attribution required.",
    nc: "Noncommercial use only — this text may not be used commercially.",
    sa: "Share-alike: anything derived from this must be shared under the same license.",
    nd: "NoDerivatives: this text may be copied and shared whole; nothing changed or adapted from it may be shared.",
  };
  // The letters a family or a posture carries, read in one place so a license
  // cannot be summarised two different ways by two different callers.
  const summarise = (text) => {
    const t = String(text || "");
    const out = [];
    if (/(^|[^a-z])by([^a-z]|$)/i.test(t)) out.push(LICENCE_RULES.by);
    if (/(^|[^a-z])nc([^a-z]|$)/i.test(t) || /noncommercial/i.test(t)) out.push(LICENCE_RULES.nc);
    if (/(^|[^a-z])sa([^a-z]|$)/i.test(t) || /share.?alike/i.test(t)) out.push(LICENCE_RULES.sa);
    if (/(^|[^a-z])nd([^a-z]|$)/i.test(t) || /noderiv/i.test(t)) out.push(LICENCE_RULES.nd);
    return out;
  };
  const postureOf = (mId) => {
    const m = index.m_sources[mId];
    return m ? String(m.licensePosture || "") : "";
  };
  // Refusals are decided here and nowhere else, and they are read from the
  // declarations record rather than re-derived from the letters of the key.
  // A posture the record has not declared is not exported: no license is as
  // absolute as a forbidding one, and the undeclared is treated as forbidding.
  const exportPosture = (posture) => {
    const p = String(posture || "");
    if (!p) return { ok: false, why: "the record carries no license posture" };
    const row = POSTURES && POSTURES.postures && POSTURES.postures[p];
    if (!row) return { ok: false, why: `undeclared posture (${p}) — a posture with no declaration is not exported` };
    if (!row.export) return { ok: false, why: `${row.name} (${p}) — the declarations record refuses export for this posture` };
    return { ok: true, why: null, obligations: row.obligations || [] };
  };

  // What reading is standing under a word right now, and which record it is
  // standing on. The zone bakes the reading as text with no M attached, so the
  // record is recovered by asking the store what it attests for that form and
  // matching the text the page is showing. A reading nobody can trace is not
  // exported — it is named as untraceable, which is the honest refusal.
  // A route stands on one or more records. Which of them leads is one decision,
  // and it is made here so the card and the file cannot drift apart: the
  // earliest attestation the store carries. They had drifted — the card sorted
  // by year and showed Davidson 1855, the export took the store's first row and
  // named a 2023 dictionary, for the same word. A file that cites a different
  // record than the page it came from is worse than one that cites none.
  const EARLIEST_FIRST = (a, c) => {
    const ya = Number.parseInt(a[4], 10), yc = Number.parseInt(c[4], 10);
    return (Number.isInteger(ya) ? ya : 9e9) - (Number.isInteger(yc) ? yc : 9e9);
  };
  const leadRecord = (route) => [...route.records].sort(EARLIEST_FIRST)[0];

  const attributionFor = async (surface, shownText) => {
    const pool = await poolFor(surface);
    if (!pool || !pool.length) return { ok: false, why: "no record in the catalog for this form" };
    const hit = pool.find((r) => spanJoin(r.text) === shownText) ||
                pool.find((r) => r.text === shownText);
    if (!hit) return { ok: false, why: "the reading on the page does not match any record in the store" };
    const lead = leadRecord(hit);
    const mId = lead[3];
    const also = [...hit.records].sort(EARLIEST_FIRST).slice(1)
      .map((r) => index.m_sources[r[3]]).filter(Boolean);
    const m = index.m_sources[mId] || {};
    const post = exportPosture(m.licensePosture);
    // the record's own text, not the page's rendering of it: the page joins a
    // "/"-packed span with " + " for reading, and a file that leaves the
    // building must carry what the source wrote, not how we drew it
    return post.ok
      ? { ok: true, text: hit.text, label: m.label, posture: m.licensePosture,
          pointer: m.licensePointer, year: m.sourceYear, obligations: post.obligations,
          also: also.map((x) => `${x.label} · ${x.sourceYear || "year not supplied"} · ${x.licensePosture}`) }
      : { ok: false, why: post.why, label: m.label };
  };

  const EXPORT_RULE = "export-rule-v2-numbered-citation-per-reading-hebrew-on-the-work";
  // The border is where a hash does its work. On the page a word carries its
  // ids and the seal stays in the colophon — a hash on a card was asked for
  // and refused, because on the page the chain is a click away. A file that
  // has left the page is past the border: whoever holds it holds neither the
  // page nor the chain, so the file itself says where its text stood and
  // which sealed artifacts answer for it, hashes whole, because a truncated
  // hash verifies nothing.
  const CUSTODY_RULE = "export-custody-rule-v1-what-leaves-carries-its-own-way-back";

  /** Gather one section. Returns everything the writer and the confirm need. */
  const gatherSection = async (sec, el) => {
    const words = [];
    const wbs = [...el.querySelectorAll(".he-text .wb")];
    for (let i = 0; i < sec.words.length; i += 1) {
      const w = sec.words[i];
      const wb = wbs[i];
      const shown = wb ? (() => {
        // the reading as shown, without its frame: the license chip rides
        // inside .g for display, but it is frame, not text — an export that
        // read it as part of the reading matched nothing in the store and
        // withheld every word (the 2026-08-30 all-[withheld] regression)
        const g = wb.querySelector(".g");
        if (!g) return "";
        const c = g.cloneNode(true);
        c.querySelectorAll(".g-lic").forEach((x) => x.remove());
        return (c.textContent || "").trim();
      })() : "";
      const rec = { he: w.s, en: null, held: null, source: null };
      if (w.k && shown && shown !== "—") {
        const a = await attributionFor(w.k, shown);
        if (a.ok) { rec.en = a.text; rec.source = a; }
        else { rec.held = a.why; }
      } else if (!w.k) rec.held = "held by the ledger; no reading is offered";
      // A word that carries a key and shows no reading is the ordinary case —
      // 677 of Targum Ruth's 2,139 — and it had no branch here. It fell
      // through with held null and source null, and the tally below skips only
      // what is held, so the first one of them read .label off null and the
      // export died. Every work has words like this, so no export has ever
      // been produced. Naming the reason is also the honest thing: the file
      // says why a word carries no English rather than passing over it.
      else rec.held = "no reading is shown for this word";
      words.push(rec);
    }
    const sources = new Map();
    const obligations = new Set();
    let held = 0;
    for (const w of words) {
      if (w.held) { held += 1; continue; }
      const s = w.source;
      if (!sources.has(s.label)) sources.set(s.label, s);
      (s.obligations || []).forEach((o) => obligations.add(o));
    }
    return { sec, words, sources: [...sources.values()], obligations: [...obligations], held };
  };

  // The license of the work itself — the Hebrew. This is the largest thing any
  // export carries and it is not public domain: 1 Kings' own rights record
  // reads CC-BY-NC, ALLOW_WITH_OBLIGATIONS. An earlier build printed the work
  // RECEIPT here, which is a B/N id and a unit count, and called that the
  // license. It was not. A receipt says which rows were served; it says
  // nothing about what may be done with them.
  const workRights = () => {
    const wr = zone.work_receipts || {};
    const receipt = typeof wr === "string" ? wr : (wr.b_n || "");
    const rec = (zone.emitted_from && zone.emitted_from.license_receipts) || {};
    const per = String(rec.per_occurrence || "");
    // the rights record leads with the family and the posture
    const m = per.match(/([A-Z0-9][A-Z0-9._-]*(?:-[A-Z0-9._-]+)*)\s*·\s*([A-Z_]+)\s*·\s*([A-Z_]+)/);
    const family = m ? m[1] : null;
    const posture = m ? m[3] : null;
    const links = (zone.emitted_from && zone.emitted_from.license_links) || [];
    const obligations = family ? summarise(family) : [];
    // A posture is a machine token, not a sentence. An earlier build turned
    // ALLOW_WITH_OBLIGATIONS into "the chain records this text as allowed with
    // obligations", which reads as the chain having said a thing it never
    // said, and named no obligation while sitting in a list of them. What is
    // true is narrower: the token is there, and what it obliges is not written
    // in anything this reader holds.
    // Any gated posture, not one typed token: the canonical rights resolution
    // speaks its own vocabulary (ALLOW_WITH_PROVENANCE_GATE arrived with it),
    // and this page honors whatever gate the record names without pretending
    // to read its terms.
    if (posture && posture !== "ALLOW" && !obligations.length)
      obligations.push(`The rights record carries the posture ${posture}. What that posture obliges is not written in anything held here; the record linked below is where it is written.`);
    return { receipt, family, posture, links, obligations, attribution: rec.attribution || zone.byline || "", raw: per };
  };

  /** The file itself. One shape for all three kinds; the kind decides columns.
   *
   * Every run of text in the file carries a citation mark, and every mark has
   * an entry under Sources naming the license it was released under. A file
   * that listed six sources at the foot and left the reader to guess which of
   * them stood behind which word was naming licenses without attaching them,
   * which is most of the way to not naming them at all.
   *
   * [H] is the Hebrew — one work, one license, every Hebrew word in the file.
   * [1] [2] … are the readings, numbered by where they first appear, so the
   * numbers climb as the reader reads. A source used by four words carries the
   * same number in all four, because it is one source, cited four times. */
  const renderExport = (bundles, kind, title) => {
    const L = [];
    // label -> { n, source }. Order of first appearance, not alphabetical: the
    // point of the number is that the reader can walk it back from the word.
    const cited = new Map();
    const cite = (s) => {
      let e = cited.get(s.label);
      if (!e) { e = { n: cited.size + 1, s }; cited.set(s.label, e); }
      return e.n;
    };
    L.push(`# ${title}`);
    L.push("");
    const wr = workRights();
    L.push(`${zone.work}${zone.work_he ? ` · ${zone.work_he}` : ""}`);
    if (zone.byline) L.push(zone.byline);
    L.push("");
    L.push(`Hebrew text [H] · license: ${wr.family || "NOT ESTABLISHED"}${wr.posture ? ` · ${wr.posture}` : ""}`);
    if (wr.attribution) L.push(`Hebrew text [H] · attribution: ${wr.attribution}`);
    wr.links.forEach((l) => L.push(`Hebrew text [H] · ${l.label}${l.url ? ` — ${l.url}` : ""}`));
    L.push(`Work receipt: ${wr.receipt}`);
    L.push(`Store: ${index.rule_id} · ${index.store_version}`);
    if (index.reading_rule) L.push(`Reading: ${index.reading_rule}`);
    L.push(`Export: ${EXPORT_RULE}`);
    L.push(`Custody: ${CUSTODY_RULE}`);
    L.push("");
    L.push(kind === "he"
      ? "Citations: [H] marks the Hebrew. Its entry under Sources names the license it is released under."
      : "Citations: [H] marks the Hebrew; [1] [2] … mark each reading. Every mark has an entry under Sources naming the license that reading is released under, and the entry is the record the reading is cited from — the earliest attestation the store carries, the same one the reader sees on the card. The same source keeps the same number wherever it appears. Where a reading is attested by further records, they are named under the entry; they are not what it was cited from.");
    L.push("");
    const allObl = new Set(); let held = 0;
    for (const b of bundles) {
      L.push(`## ${b.sec.label || ""}`);
      L.push("");
      // the section's own address in the chain — the unit it was served from
      // and the c0 rows it stands on, which is what a checker walks back along
      if (b.sec.unit) {
        L.push(`unit: ${b.sec.unit}${b.sec.c0_first != null && b.sec.c0_last != null ? ` · c0 rows ${b.sec.c0_first}–${b.sec.c0_last}` : ""}`);
        L.push("");
      }
      // The Hebrew is marked on its label rather than on each word: it is one
      // work under one license, and threading Latin digits through a right-to-
      // left run would rearrange the text on the page it is pasted into.
      if (kind !== "en") { if (kind === "both") L.push("Hebrew [H]"); L.push(b.words.map((w) => w.he).join(" ")); }
      if (kind === "both") { L.push(""); L.push("Readings"); }
      if (kind !== "he") {
        const line = b.words.map((w) => (w.held ? "[withheld]" : `${w.en}[${cite(w.source)}]`)).join(" ");
        L.push(line);
      }
      L.push("");
      for (const w of b.words) if (w.held) held += 1;
      b.obligations.forEach((o) => allObl.add(o));
    }
    L.push("---");
    L.push("");
    L.push("## Sources");
    L.push("");
    // Whose words the obligation lines are, said before any of them is read.
    L.push(`_${LICENCE_RULES.whose}_`);
    L.push(`_(${LICENCE_RULES.rule})_`);
    L.push("");
    // [H] first, because it stands under every Hebrew word in the file.
    L.push(`- [H] ${wr.family || "LICENCE NOT ESTABLISHED"}${wr.posture ? ` · ${wr.posture}` : ""} — the Hebrew of ${
      kind === "he" ? "this file" : "every section here"}: the sealed text of ${zone.work}${
      wr.attribution ? `, ${wr.attribution}` : ""}`);
    wr.obligations.forEach((o) => L.push(`    obligation, in our words: ${o}`));
    wr.links.forEach((l) => L.push(`    record: ${l.label}${l.url ? ` — ${l.url}` : ""}`));
    L.push(`    receipt: ${wr.receipt}`);
    if (kind !== "he") {
      if (!cited.size) {
        L.push("");
        L.push("No reading in this export could be traced to a record.");
      } else {
        // in number order, which is the order the reader meets them
        for (const { n, s } of [...cited.values()].sort((a, b) => a.n - b.n)) {
          L.push("");
          L.push(`- [${n}] ${s.posture} — ${s.label}${s.year ? ` · ${s.year}` : ""}`);
          (s.obligations || []).forEach((o) => L.push(`    obligation, in our words: ${o}`));
          if (s.pointer) L.push(`    record: ${s.pointer}`);
          (s.also || []).forEach((x) => L.push(`    also attested by: ${x}`));
        }
      }
    }
    wr.obligations.forEach((o) => allObl.add(`The Hebrew text: ${o}`));
    if (allObl.size) {
      L.push("");
      L.push("## Obligations carried by this file");
      L.push("");
      L.push(`_${LICENCE_RULES.whose}_`);
      L.push("");
      [...allObl].forEach((o) => L.push(`- ${o}`));
    }
    if (held && kind !== "he") {
      L.push("");
      L.push("## Withheld");
      L.push("");
      L.push(`${held} reading${held === 1 ? " was" : "s were"} not exported. Each is marked [withheld] where it stood, carrying no citation number because there is no source to cite. A reading is withheld when its record carries a license that does not permit redistribution, when it carries no license at all, or when the reading on the page could not be matched to a record. The Hebrew is never withheld: it rides on the work's own license, not on any reading's.`);
    }
    // ---- custody: the way back -------------------------------------------
    // Last, the way the colophon is last: everything above it is the text,
    // and this is where the text says it can be checked.
    {
      const ef = zone.emitted_from || {};
      const oc2 = ef.identity_oracle, wk2 = ef.walk, ac2 = ef.acquisition;
      L.push("");
      L.push("## Custody");
      L.push("");
      L.push("_These sentences are plain English written in this reader; the identifiers are the chain's own. Each section above names the unit it was served from and the c0 rows it stands on — the sealed chain's row identifiers for exactly those words. Against these, and against the artifacts below, this file can be checked by someone holding neither this page nor its reader._");
      L.push(`_(${CUSTODY_RULE})_`);
      L.push("");
      if (oc2 && oc2.bridge_sha256) {
        L.push(`- identity oracle: ${oc2.bridge} · sha256 ${oc2.bridge_sha256}`);
        if (oc2.first_c0_numeric_id != null)
          L.push(`    the work stands on ${Number(oc2.sealed_c0_rows || 0).toLocaleString("en")} c0 rows in ${Number(oc2.sealed_units || 0).toLocaleString("en")} units · c0 ${oc2.first_c0_numeric_id}–${oc2.last_c0_numeric_id}`);

      if (wk2 && wk2.pointer && wk2.pointer.sha256) L.push(`- serve pointer: sha256 ${wk2.pointer.sha256}`);
      if (wk2 && wk2.module && wk2.module.sha256) L.push(`- walker module: sha256 ${wk2.module.sha256}`);
      if (!wk2 && ac2 && ac2.payload_sha256_transferred) L.push(`- payload transferred: sha256 ${ac2.payload_sha256_transferred}`);
      if (ef.gloss_layer && ef.gloss_layer.gloss_table_sha256) L.push(`- gloss table: sha256 ${ef.gloss_layer.gloss_table_sha256}`);
      L.push(`- work receipt: ${wr.receipt}`);
      // where the page itself verified the zone's bin against its pin at
      // load, the export carries that hash too — the same seal, both borders
      const zbSha = (window.__binShas || {})[`${BOOK}.bin`];
      if (zbSha) L.push(`- this zone's bin, verified against its pin at load: sha256 ${zbSha}`);
      L.push(`- this file left: ${location.origin}${location.pathname}${location.search}`);
      // The repository is never typed here — a copy is the one string with
      // nothing behind it. It was read off the page's own hostname, which
      // worked only while the site answered at a github.io address; the day
      // the work moved to its own domain that match failed and every export
      // silently lost its way back. So the pointer is a record now, derived
      // at build time from the remote the tree actually pushes to, and the
      // hostname reading stays as the fallback for a bare reader.
      const repo = (ZSTORE && ZSTORE.repository) ||
        (location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i)

      if (repo) L.push(`- the reader, its checks, and these artifacts: ${repo}`);
    }
    L.push("");
    return L.join("\n");
  };

  const saveFile = (name, text) => {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  const KINDS = { he: "Hebrew", en: "English", both: "Hebrew + English" };

  /**
   * One export control. It arms rather than fires: the first press gathers the
   * records and says exactly what is about to leave, the second press writes
   * it. Nothing reaches the reader's disk from a single tap.
   */
  const exportButton = (kind, label, note, gather, filename) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "xp"; b.textContent = label;
    b.setAttribute("aria-label", `Export ${KINDS[kind]}`);
    let armed = null;
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (armed) {
        const wr = workRights();
        if (!wr.family) {
          note.textContent = "Refused: this work's own license is not established in the zone's rights record, so nothing may leave.";
          b.classList.remove("armed"); b.textContent = label; armed = null;
          return;
        }
        saveFile(filename(), renderExport(armed.bundles, kind, armed.title));
        b.classList.remove("armed"); b.textContent = label;
        note.textContent = "Saved."; armed = null;
        return;
      }
      b.classList.add("busy"); note.textContent = "Reading the records this stands on…";
      let g;
      try { g = await gather(); }
      catch (err) { b.classList.remove("busy"); note.textContent = `Could not read the records: ${err.message}`; return; }
      b.classList.remove("busy");
      const words = g.bundles.reduce((a, x) => a + x.words.length, 0);
      const srcs = new Set(); const obl = new Set(); let held = 0;
      g.bundles.forEach((x) => { x.sources.forEach((s) => srcs.add(s.label)); x.obligations.forEach((o) => obl.add(o)); held += x.held; });
      note.replaceChildren();
      const say = (t, cls) => { const sp = document.createElement("span"); if (cls) sp.className = cls; sp.textContent = t; note.append(sp); };
      const wr = workRights();
      wr.obligations.forEach((o) => obl.add(`The Hebrew text: ${o}`));
      if (kind === "he") {
        say(`${words} words of Hebrew · ${wr.family || "license NOT ESTABLISHED"}`);
        if (wr.obligations.length) { say(" · in our words: "); say(wr.obligations.join(" ")); }
        say(". ");
      } else {
        say(`${words} words · ${srcs.size} source${srcs.size === 1 ? "" : "s"}`);
        if (obl.size) { say(" · in our words: "); say([...obl].join(" ").replace(/\.$/, "")); }
        if (held) { say(" · "); say(`${held} reading${held === 1 ? "" : "s"} withheld on license`, "held"); }
        say(". ");
      }
      const strong = document.createElement("b"); strong.textContent = "Press again to save.";
      note.append(strong);
      b.classList.add("armed"); b.textContent = "save";
      armed = g;
      setTimeout(() => { if (armed) { armed = null; b.classList.remove("armed"); b.textContent = label; note.textContent = ""; } }, 20000);
    });

  };

  const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // A card the reader dragged is theirs. They may park it half off the side or
  // hanging below the fold — that is a legitimate thing to want from a card

  // handle: the head must stay reachable, or the card could be pushed
  // somewhere it can never be pulled back from.
  const GRAB = 56;

   * Give each band a whole number of rows.

   * pills is — which depends on the font, and the font depends on the device.
   * So a band showed a row and a half, and half a pill reads as something
   * broken rather than as something scrolling. And the two bands were not

   * readings sprawled over five, which is not a proportion anyone chose.

  const rowsOf = (box) => {

    // lines, which is the record's floor everywhere, and its source line,
    // which is the license, is not part of what it lends. A floor of one line

    // else is on the card, and what else is on the card changes as this runs,
    // so a share worked out from one measurement is a share of a card that no
    // longer exists. Three passes settle it; each one measures the layout the
    // last one produced.

      for (const x of bands) { x.box.style.height = ""; x.box.style.maxHeight = ""; }
      for (const x of bands) { const r = rowsOf(x.box); if (r.length) x.rows = r; }
      for (let pass = 0; pass < 3; pass += 1) {
        room = rowsEl.clientHeight;
        take = bands.map(() => 1);
        let used = bands.reduce((n, x) => n + x.chrome + x.rows[0].bottom, 0);
        const grow = (i, limit) => {
          const x = bands[i];
          while (take[i] < Math.min(limit, x.rows.length)) {
            const more = x.rows[take[i]].bottom - x.rows[take[i] - 1].bottom;
            if (used + more > room) return;

          }

        bands.forEach((x, i) => { if (x.box !== read) grow(i, cap); });
        bands.forEach((x, i) => { if (x.box === read) grow(i, x.rows.length); });
        bands.forEach((x, i) => {
          const px = `${Math.ceil(x.rows[take[i] - 1].bottom)}px`;
          x.box.style.height = px; x.box.style.maxHeight = px;

    };
    handOut();
    // A structural band's share is the whole of it, up to the window's cap —
    // and the measured room can lie high about whether it fits. At measure
    // time the unfitted bands are at their natural height, the card is hard
    // against its cap, and the provenance line is crushed to nothing; the
    // arithmetic sees its space as free. Then whole rows are assigned, the
    // card comes off its cap, the line re-inflates — and takes a division
    // row back. So the outcome is what gets checked, not the estimate, and
    // when a band ended short of its share the yielders yield in the card's
    // own order: the record down to its floor — never the source line — and
    // after the record, the provenance line. Each yield is followed by a
    // fresh handout against the layout it actually produced.
    const owedShort = () => bands.some((x, i) => x.box !== read && take[i] < Math.min(cap, x.rows.length));
    if (owedShort() && dSlot && !dSlot.classList.contains("whole")) {
      const foot = hud.querySelector(".d-foot");
      const dLine = parseFloat(getComputedStyle(hud.querySelector(".d-text") || dSlot).lineHeight) || 26;
      const floor = (foot ? foot.offsetHeight : 0) + Math.ceil(dLine * 3);
      const shares = bands.reduce((n, x) => n + x.chrome
        + x.rows[Math.min(x.box === read ? 1 : cap, x.rows.length) - 1].bottom, 0);
      const give = Math.min(Math.ceil(shares - rowsEl.clientHeight), Math.max(0, dSlot.clientHeight - floor));

    }
    if (owedShort() && prov && prov.offsetHeight) { prov.hidden = true; handOut(); }
    // The record's floor, held against the laid-out foot. The stylesheet caps
    // the slot at a length written for a one-row source line, but the M is as
    // tall as its own chips: a licence whose names wrap takes three rows of
    // foot, and under the cap the record stood fourteen pixels tall above
    // it — the source standing on a sliver. Only the laid-out card knows the
    // foot's real height, so the floor binds here: a line of record above
    // the source on a squashed window, two where the window affords them,
    // and never more than the slack the card actually has — a band's row is
    // not the record's to take.
    // The raise spends only slack — room the card has under its own caps —
    // never position: a shortfall here must not push the card off its
    // placement, because a card that grew upward stood over the very word
    // it belongs to, and under-the-word outranks every comfort inside the
    // card. Short of slack, the record rests a line shy and the whole of it
    // stays a press away on its own control.
    const dBody = hud.querySelector(".d-card .d-body");
    const dFoot = hud.querySelector(".d-card .d-foot");
    if (dSlot && dBody && dFoot && !dSlot.classList.contains("whole")) {

      const seen = Math.min(br.bottom, dFoot.getBoundingClientRect().top) - Math.max(br.top, sr.top);

      const oweD = Math.min(Math.ceil(lineH * afford), dBody.scrollHeight);
      if (seen < oweD) {
        // slack is the room below where the card actually stands, not below
        // the top of the window: a raise measured from the wrong datum
        // pushed the card's own bottom two pixels off the screen
        const capH = parseFloat(getComputedStyle(hud).maxHeight);
        const slack = Math.max(0, Math.floor(Math.min(
          Number.isFinite(capH) ? capH : Infinity,
          window.innerHeight - 8 - (parseFloat(hud.style.top) || 8)) - hud.offsetHeight));
        const raise = Math.min(Math.ceil(oweD - seen), slack);
        if (raise > 0) dSlot.style.maxHeight = `${dSlot.clientHeight + raise}px`;
      }
      // And the matching maximum: the record never takes more than half the
      // card. The slot's stylesheet cap is written against the window, but
      // under a placement budget the card is shorter than the window ever
      // told the stylesheet — a 509px card carried a 293px record, and the
      // readings paid for it. The slot yields to what the rest of the card
      // stands at, never below its own floor, and the bands are handed the
      // room it returns.
      const other = hud.clientHeight - dSlot.clientHeight;
      if (dSlot.clientHeight > other + 1) {
        const chromeAbove = Math.max(0, Math.ceil(br.top - sr.top + dSlot.scrollTop));
        const floorPx = dFoot.offsetHeight + Math.ceil(lineH * afford) + chromeAbove;
        const to = Math.max(floorPx, other);
        if (to < dSlot.clientHeight - 1) { dSlot.style.maxHeight = `${Math.floor(to)}px`; handOut(); }
      }
    }
    // did every band end up with the row it is owed, in the space it actually
    // has? The caller decides what to do about it — there is nothing left here
    // to take it out of.
    const stands = bands.reduce((n, x) => n + x.el.offsetHeight, 0);
    return stands <= rowsEl.clientHeight + 1;

  const placeInBounds = () => {

    // and clamped than short with dead controls in it.

    // clamp below would pull it up over the very word it opened from — a
    // card above the word covers the text the reader was reading to get
    // there. The word outranks the clamp: when pulling the card up would
    // stand it on its own word, it is placed again under the whole law —
    // the word scrolls up, the card shrinks, and only past usefulness does
    // it stand anywhere else.

  const clampHud = placeInBounds;
  // The tether tracks the card's four corners back to the word it opened
  // from — the owner's own mechanic, carried in: a card should say where
  // you were working without the reader hunting for the lit word. Driven
  // per frame so drag, scroll, clamp and growth all keep it true; the
  // change-detection key makes an idle frame cost one string compare.

  const drawTether = () => {
    const anchor = activeEl && activeEl.isConnected ? activeEl : hudAnchor;
    if (hud.hidden || !anchor || !anchor.isConnected) {
      if (tetherKey) { tether.style.display = "none"; tetherKey = ""; }
      return;
    }

      [a.left, a.top, h.left, h.top], [a.right, a.top, h.right, h.top],
      [a.left, a.bottom, h.left, h.bottom], [a.right, a.bottom, h.right, h.bottom],

    // moved back to a word again, only kept on screen.
    if (hudMoved) { clampHud(); return; }
    // a height fixed for a previous word's placement is not this word's
    hud.style.maxHeight = "";
    // The card must clear the word's whole block, not just the span that was
    // pressed: a ruled reading painted under the word grows the block (the
    // growth law), and a card anchored on the span alone covered the ruled
    // reading's second line — caught by the overlaps gate, 2026-08-30.
    const anchorBlock = (hudAnchor.closest && hudAnchor.closest(".wb")) || hudAnchor;
    let rect = anchorBlock.getBoundingClientRect();
    let h = hud.offsetHeight || 0;
    const w = hud.offsetWidth || 0;

    // text the reader was reading to get there, and on a phone that is most of
    // the verse. When there is not room beneath, the answer is not to flip the
    // card over the top — it is to bring the word up: the page scrolls until
    // the word sits high enough for the card to open beneath it. The word moves
    // with the page, which is a thing a reader can follow; the card appearing
    // over the text is not.
    const want = window.innerHeight - pad - h - pad;   // where the word's foot has to be
