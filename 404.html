<script>
(function () {
  var m = /^\/([a-z0-9-]+)\/(\d+):(\d+)(?::(\d+(?:[-\u2013]\d+)?))?\/?$/.exec(location.pathname);
  if (m) location.replace("/" + m[1] + "/" + m[2] + (m[4] ? "#" + m[2] + ":" + m[3] + ":" + m[4] : "#v" + m[2] + "-" + m[3]));
})();
</script></head>
