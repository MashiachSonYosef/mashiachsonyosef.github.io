<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Not Published</title>
  <style>
    :root { color-scheme: dark; --bg: #0a0b0d; --panel: rgba(18,21,27,0.94); --text: #efe8da; --muted: #aaa18f; --line: rgba(214,190,138,0.2); --accent: #d6be8a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #0a0b0d 0%, #11141a 100%); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
    main { width: min(720px, calc(100% - 28px)); border: 1px solid var(--line); background: var(--panel); padding: clamp(18px, 4vw, 34px); }
    h1 { margin: 0 0 10px; font-weight: 400; font-size: clamp(2rem, 7vw, 4rem); line-height: 0.95; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 18px; }
    a { display: inline-block; border: 1px solid rgba(214,190,138,0.34); background: rgba(214,190,138,0.06); color: var(--accent); padding: 9px 12px; text-decoration: none; }
    a:hover, a:focus-visible { outline: 2px solid rgba(214,190,138,0.78); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Not Published</h1>
    <p>This page is not in the current lightweight public artifact.</p>
    <a href="/">Open the live HUD surface</a>
  </main>
</body>
</html>
